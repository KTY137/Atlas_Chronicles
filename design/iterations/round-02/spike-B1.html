/* ─────────────────────────────────────────────────────────────────────────

   ───────────────────────────────────────────────────────────────────────── */
:root{
  color-scheme: light;

  --f-serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --f-sans: ui-sans-serif,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono: ui-monospace,"Cascadia Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;

  --t-100: .6875rem;  --t-200: .75rem;   --t-300: .8125rem;
  --t-400: .875rem;   --t-500: .9375rem; --t-600: 1.0625rem;
  --t-700: 1.1875rem; --t-800: 1.5rem;   --t-900: 2.125rem;
  --lh-prosa: 1.62;   --lh-ui: 1.35;

  --s-1: .25rem; --s-2: .5rem;  --s-3: .75rem; --s-4: 1rem;
  --s-5: 1.5rem; --s-6: 2rem;   --s-7: 3rem;

  --r-xs: 2px; --r-sm: 3px; --r-md: 5px; --r-lg: 8px; --r-pill: 999px;

  --c-shell:      #ddd4c4;
  --c-shell-tief: #cfc4b0;
  --c-chrom:      #f2ece1;
  --c-panel:      #f8f4ec;
  --c-papier:     #fdfbf6;
  --c-papier-2:   #f4efe4;
  --c-ink:        #1d1a15;
  --c-ink-2:      #635a4d;
  --c-ink-3:      #8b8173;
  --c-linie:      #ddd3c2;
  --c-linie-satt: #bfb3a0;
  --c-akzent:     #7a2733;
  --c-akzent-2:   #a24151;
  --c-akzent-weich:#f3e3e2;
  --c-akzent-auf: #fdfbf6;
  --c-messing:    #7a5e26;
  --c-messing-weich:#efe4c9;
  --c-link:       #2b4c7e;
  --c-link-rot:   #8f2b18;
  --c-gut:        #34603f;
  --c-gut-weich:  #e2ecdf;
  --c-fokus:      #12439e;
  --c-fokus-auf:  #fdfbf6;

  --tex-papier:
    repeating-linear-gradient(94deg, rgba(90,70,40,.020) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(3deg, rgba(90,70,40,.014) 0 1px, transparent 1px 6px);
  --tex-chrom:
    repeating-linear-gradient(0deg, rgba(0,0,0,.018) 0 1px, transparent 1px 3px);

  --sh-1: 0 1px 1px rgba(48,36,20,.07), 0 2px 4px rgba(48,36,20,.05);
  --sh-2: 0 1px 2px rgba(48,36,20,.10), 0 10px 26px -14px rgba(48,36,20,.45);
  --sh-hoch: 0 2px 4px rgba(48,36,20,.12), 0 22px 48px -22px rgba(48,36,20,.55);
  --sh-innen: inset 0 1px 0 rgba(255,255,255,.7);

  --m-antwort: 140ms;
  --m-zustand: 280ms;
  --m-uebergang: 820ms;
  --m-abbruch: 4000ms;
  --e-aus: cubic-bezier(.2,.7,.3,1);
  --e-ein: cubic-bezier(.4,0,.6,1);
}

    --tex-chrom: repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);

    --sh-2: 0 1px 2px rgba(0,0,0,.6), 0 12px 30px -16px rgba(0,0,0,.9);
    --sh-hoch: 0 2px 6px rgba(0,0,0,.65), 0 26px 54px -24px rgba(0,0,0,1);

  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --c-shell:      #100f0e;
  --c-shell-tief: #0a0a09;

/* ── Grundlagen ─────────────────────────────────────────────────────────── */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--c-shell); color:var(--c-ink);
  font-family:var(--f-sans); font-size:var(--t-400); line-height:var(--lh-ui);
  overflow-x:hidden;
}
button,input,select,textarea{ font:inherit; color:inherit; }
:where(a){ color:var(--c-link); }
:focus-visible{
  outline:2px solid var(--c-fokus); outline-offset:2px; border-radius:var(--r-xs);
  box-shadow:0 0 0 4px var(--c-fokus-auf);
}
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.zahl{ font-variant-numeric:tabular-nums; }

/* ── Gerüst ─────────────────────────────────────────────────────────────── */
.app{ display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; min-height:100dvh; }
@media (min-width:1100px){ .app{ height:100dvh; } }

.topbar{
  display:flex; align-items:center; gap:var(--s-4); flex-wrap:wrap;
  padding:var(--s-3) var(--s-4);
  background:var(--c-chrom); background-image:var(--tex-chrom);
  border-bottom:1px solid var(--c-linie-satt);
  box-shadow:var(--sh-1);
}
.marke{ display:flex; align-items:center; gap:var(--s-3); min-width:0; }
.marke svg{ display:block; width:26px; height:26px; color:var(--c-akzent); flex:none; }
.marke-txt{ min-width:0; }
.marke-uni{
  margin:0; font-size:var(--t-300); font-weight:600;
  letter-spacing:var(--ls-kapital); text-transform:uppercase; color:var(--c-ink);
}
.marke-kmp{ margin:0; font-size:var(--t-200); color:var(--c-ink-2); }
.topbar-spacer{ flex:1 1 auto; }

.praesenz{ display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
.pchip{
  display:inline-flex; align-items:center; gap:.375rem;
  font-size:var(--t-200); color:var(--c-ink-2);
  padding:.15rem .5rem .15rem .35rem; border-radius:var(--r-pill);
  background:var(--c-panel); border:1px solid var(--c-linie);
}
.pdot{ width:7px; height:7px; border-radius:50%; background:var(--c-gut); flex:none; }
.pchip[data-an="0"] .pdot{ background:transparent; border:1.5px solid var(--c-ink-3); }
.pchip[data-an="0"]{ color:var(--c-ink-3); }

.knopf{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  padding:.4rem .7rem; border-radius:var(--r-sm); cursor:pointer;
  background:var(--c-panel); color:var(--c-ink);
  border:1px solid var(--c-linie-satt); box-shadow:var(--sh-1);
  font-size:var(--t-300); font-weight:550;
  transition:background var(--m-antwort) var(--e-aus),
             border-color var(--m-antwort) var(--e-aus),
             transform var(--m-antwort) var(--e-aus),
             box-shadow var(--m-antwort) var(--e-aus);
}
.knopf:hover{ background:var(--c-papier); border-color:var(--c-linie-satt); }
.knopf:active{ transform:translateY(1px); box-shadow:none; }
.knopf[disabled],.knopf[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; box-shadow:none; }
.knopf.haupt{
  background:var(--c-akzent); color:var(--c-akzent-auf);
  border-color:color-mix(in srgb, var(--c-akzent) 70%, #000 30%);
}
.knopf.haupt:hover{ background:var(--c-akzent-2); }
.knopf.klein{ padding:.25rem .5rem; font-size:var(--t-200); }
.knopf svg{ width:14px; height:14px; display:block; }

/* ── Projektionsleiste ──────────────────────────────────────────────────── */
.projleiste{
  display:flex; align-items:center; gap:var(--s-4); flex-wrap:wrap;
  padding:var(--s-2) var(--s-4);
  background:var(--c-shell-tief); background-image:var(--tex-chrom);
  border-bottom:1px solid var(--c-linie-satt);
}
.pl-label{
  font-size:var(--t-100); text-transform:uppercase; letter-spacing:var(--ls-kapital);
  color:var(--c-ink-2); font-weight:700; flex:none;
}
.leserband{
  display:flex; gap:var(--s-2); overflow-x:auto; padding:.2rem .1rem; flex:1 1 22rem;
  scrollbar-width:thin;
}
.leser{
  flex:none; cursor:pointer; text-align:left; white-space:nowrap;
  padding:.3rem .65rem; border-radius:var(--r-sm);
  background:var(--c-panel); border:1px solid var(--c-linie);
  transition:background var(--m-antwort) var(--e-aus),
             border-color var(--m-antwort) var(--e-aus),
             color var(--m-antwort) var(--e-aus);
}
.leser b{ display:block; font-size:var(--t-300); font-weight:600; }
.leser span{ display:block; font-size:var(--t-100); color:var(--c-ink-3); }
.leser:hover{ background:var(--c-papier); }
.leser[aria-checked="true"]{
  background:var(--c-akzent); border-color:var(--c-akzent);
  color:var(--c-akzent-auf); box-shadow:var(--sh-1);
}
.leser[aria-checked="true"] span{ color:color-mix(in srgb, var(--c-akzent-auf) 78%, transparent); }
.anzeige{ display:flex; gap:var(--s-2); align-items:center; flex:none; }

/* ── Hauptraster ────────────────────────────────────────────────────────── */
.main{
  display:grid; gap:var(--s-4); padding:var(--s-4);
  grid-template-columns:12.25rem minmax(0,1fr) 21.5rem;
  min-height:0;
}
@media (max-width:1240px){ .main{ grid-template-columns:12.25rem minmax(0,1fr); } }
@media (max-width:900px){ .main{ grid-template-columns:minmax(0,1fr); padding:var(--s-3); } }

.rail{ display:flex; flex-direction:column; gap:.15rem; min-width:0; }
@media (max-width:900px){
  .rail{ flex-direction:row; overflow-x:auto; gap:var(--s-2); padding-bottom:var(--s-1); }
}
.rail-kopf{
  font-size:var(--t-100); text-transform:uppercase; letter-spacing:var(--ls-kapital);
  color:var(--c-ink-3); font-weight:700; padding:0 var(--s-2) var(--s-2);
}
@media (max-width:900px){ .rail-kopf{ display:none; } }
.modul{
  display:flex; align-items:center; gap:var(--s-2); white-space:nowrap;
  padding:.45rem var(--s-2); border-radius:var(--r-sm); cursor:pointer;
  background:transparent; border:1px solid transparent; text-align:left;
  color:var(--c-ink-2); font-size:var(--t-400);
  transition:background var(--m-antwort) var(--e-aus), color var(--m-antwort) var(--e-aus);
}
.modul svg{ width:16px; height:16px; flex:none; opacity:.85; }
.modul:hover{ background:var(--c-panel); color:var(--c-ink); }
.modul[aria-current="page"]{
  background:var(--c-panel); color:var(--c-ink); font-weight:600;
  border-color:var(--c-linie); box-shadow:var(--sh-1);
}
.modul[aria-current="page"] svg{ color:var(--c-akzent); opacity:1; }
.modul[aria-disabled="true"]{ opacity:.55; }

/* ── Bühne ──────────────────────────────────────────────────────────────── */
.stage{
  min-width:0; display:flex; flex-direction:column;
  background:var(--c-papier); background-image:var(--tex-papier);
  border:1px solid var(--c-linie-satt); border-radius:var(--r-md);
  box-shadow:var(--sh-2); overflow:hidden;
}
.stage-kopf{
  display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap;
  padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--c-linie);
  background:linear-gradient(180deg, var(--c-panel), transparent);
}
.rezepte{ display:flex; gap:.15rem; padding:.15rem; background:var(--c-papier-2);
  border:1px solid var(--c-linie); border-radius:var(--r-sm); }
.rezept{
  cursor:pointer; padding:.3rem .7rem; border-radius:var(--r-xs);
  background:transparent; border:0; font-size:var(--t-300); color:var(--c-ink-2);
  transition:background var(--m-antwort) var(--e-aus), color var(--m-antwort) var(--e-aus);
}
.rezept:hover{ color:var(--c-ink); }
.rezept[aria-selected="true"]{
  background:var(--c-papier); color:var(--c-ink); font-weight:600; box-shadow:var(--sh-1);
}
.schalter{ display:inline-flex; align-items:center; gap:.45rem; font-size:var(--t-300);
  color:var(--c-ink-2); cursor:pointer; }
.schalter input{ accent-color:var(--c-akzent); width:.95rem; height:.95rem; }
.stage-kopf-spacer{ flex:1 1 auto; }
.stage-zaehler{ font-size:var(--t-200); color:var(--c-ink-3); }

.stage-koerper{ overflow:auto; padding:var(--s-5) var(--s-5) var(--s-7); min-height:0; }
@media (max-width:900px){ .stage-koerper{ padding:var(--s-4) var(--s-3) var(--s-6); } }

/* ── Lesefassung: eine Fandom-Seite, keine Kartenwand ───────────────────── */
.artikel{ max-width:52rem; margin:0 auto; }
.artikel h1{
  font-family:var(--f-serif); font-size:var(--t-900); line-height:1.15;
  margin:0 0 .15rem; font-weight:600; letter-spacing:-.01em;
}
.artikel-unter{
  margin:0 0 var(--s-2); font-size:var(--t-200); color:var(--c-ink-3);
  font-family:var(--f-mono);
}
.artikel-regel{ height:2px; background:var(--c-akzent); opacity:.85; margin:0 0 var(--s-1); }
.artikel-regel + .artikel-regel{ height:1px; background:var(--c-messing); opacity:.55; margin-bottom:var(--s-5); }

.abschnitt{ margin:0 0 var(--s-5); }
.abschnitt h2{
  font-family:var(--f-sans); font-size:var(--t-300); font-weight:700;
  text-transform:uppercase; letter-spacing:var(--ls-kapital);
  color:var(--c-ink-2); margin:var(--s-6) 0 var(--s-3);
  padding-bottom:.3rem; border-bottom:1px solid var(--c-linie);
}
.prosa{
  font-family:var(--f-serif); font-size:var(--t-600); line-height:var(--lh-prosa);
  margin:0 0 var(--s-3); color:var(--c-ink); hyphens:auto;
}
.karte-block{ position:relative; }
.karte-block + .karte-block{ margin-top:0; }
.griff{
  position:absolute; left:-2.6rem; top:.35rem;
  width:2rem; height:1.5rem; display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; background:var(--c-papier-2); border:1px solid var(--c-linie);
  border-radius:var(--r-xs); color:var(--c-ink-3);
  font-family:var(--f-mono); font-size:var(--t-100);
  opacity:0; transition:opacity var(--m-antwort) var(--e-aus),
                        color var(--m-antwort) var(--e-aus),
                        border-color var(--m-antwort) var(--e-aus);
}
.karte-block:hover .griff,.griff:focus-visible,.karte-block:focus-within .griff{ opacity:1; }
.griff:hover{ color:var(--c-akzent); border-color:var(--c-akzent); }
@media (max-width:1000px){
  .griff{ position:static; opacity:1; margin:0 0 .3rem; width:auto; padding:0 .4rem; height:1.25rem; }
}
.karte-block.gewaehlt::before{
  content:""; position:absolute; left:-1rem; top:.2rem; bottom:.2rem; width:3px;
  background:var(--c-akzent); border-radius:var(--r-pill);
}
@media (max-width:1000px){ .karte-block.gewaehlt::before{ left:-.5rem; } }

/* Kanten zeigen: derselbe Text, sichtbare Atome */
.kanten .karte-block{
  outline:1px dashed var(--c-linie-satt); outline-offset:6px; border-radius:var(--r-xs);
  margin-bottom:var(--s-4);
}
.kanten .griff{ opacity:1; }
.kanten .karte-block::after{
  content:attr(data-id) " · " attr(data-art) " · S" attr(data-s);
  position:absolute; right:-.2rem; top:-1.15rem;
  font-family:var(--f-mono); font-size:var(--t-100); color:var(--c-ink-3);
  font-variant-numeric:tabular-nums;
}

.wiki{ text-decoration-color:color-mix(in srgb, currentColor 40%, transparent); text-underline-offset:2px; }
.wiki.rot{ color:var(--c-link-rot); }
.abschnitt-lede .prosa:first-of-type::first-letter{
  font-size:3.1em; line-height:.86; float:left; padding:.06em .09em 0 0;
  font-weight:600; color:var(--c-akzent);
}

/* Infobox aus Feldkarten */
.infobox{
  float:right; width:19.5rem; margin:0 0 var(--s-4) var(--s-5);
  background:var(--c-panel); border:1px solid var(--c-linie-satt);
  border-radius:var(--r-sm); box-shadow:var(--sh-1); overflow:hidden;
}
@media (max-width:760px){ .infobox{ float:none; width:100%; margin:0 0 var(--s-4); } }
.infobox-kopf{
  background:var(--c-akzent); color:var(--c-akzent-auf);
  padding:var(--s-2) var(--s-3); display:flex; align-items:center; gap:var(--s-2);
}
.infobox-kopf h2{
  margin:0; font-family:var(--f-serif); font-size:var(--t-500); font-weight:600;
  text-transform:none; letter-spacing:0; border:0; padding:0; color:inherit;
}
.infobox-kopf svg{ width:18px; height:18px; flex:none; opacity:.9; }
.wappen{ display:block; margin:var(--s-3) auto var(--s-2); width:104px; height:82px; color:var(--c-ink-3); }
.infobox dl{ margin:0; padding:0 var(--s-3) var(--s-3); }
.infobox .zeile{
  display:grid; grid-template-columns:8.25rem minmax(0,1fr); gap:var(--s-2);
  padding:.42rem 0; border-top:1px solid var(--c-linie); align-items:baseline;
}
.infobox .zeile:first-child{ border-top:0; }
@media (max-width:430px){
  .infobox .zeile{ grid-template-columns:minmax(0,1fr); gap:.1rem; }
}
.infobox dt{ font-size:var(--t-200); color:var(--c-ink-2); text-transform:uppercase; letter-spacing:.06em; }
.infobox dd{ margin:0; font-size:var(--t-400); font-family:var(--f-serif); }
.infobox .sl-notiz{
  display:block; margin-top:.2rem; font-family:var(--f-sans); font-size:var(--t-100);
  color:var(--c-akzent); background:var(--c-akzent-weich);
  border-left:2px solid var(--c-akzent); padding:.2rem .35rem; border-radius:0 var(--r-xs) var(--r-xs) 0;
}

/* ═══════════════════════════════════════════════════════════════════════════
   7 · EINZELKARTEN-EDITOR — der Cursor verlässt die Karte nicht.
   ═══════════════════════════════════════════════════════════════════════════ */
function oeffneEditor(){
  S.bearbeitet = true; S.gewaehlt = "k_9f21"; S.rezept = "lese"; alles();
  var zielBlock = document.querySelector('.karte-block[data-id="k_9f21"]');
  if(!zielBlock) return;
  var z = nachhallZahlen("k_9f21");
  var ed = document.createElement("div");
  ed.className = "editor";
  ed.innerHTML =
    '<div class="editor-nachhall"><span class="vorlauf">Nachhall — bevor der Editor öffnet</span>'+
      '<p>Diese Karte liegt in <b>'+z.anord.length+' Anordnungen</b>, ist von <b>'+z.stuetzen.length+
      ' Karten</b> gestützt, trägt <b>'+z.klauseln.length+' Klausel</b>, ist an <b>'+
      (new Set(z.halter.map(function(a){return a.figur;}))).size+' Charaktere</b> ausgegeben und ist die <b>Quelle</b> von '+
      z.quelleFuer.length+' weiteren Ausgaben.</p></div>'+
    '<div class="kartengrenze"><span>Kartengrenze</span><span class="strichlinie"></span><span>k_9f21</span></div>'+
    '<div class="feld" contenteditable="true" role="textbox" aria-multiline="false" spellcheck="false" '+
      'aria-label="Kartentext berichtigen. Enter schreibt fest, Escape bricht ab."></div>'+
    '<div class="kartengrenze unten"><span>Kartengrenze</span><span class="strichlinie"></span>'+
      '<span>Enter schreibt fest · kein Absatz, kein Umbruch</span></div>'+
    '<div class="editor-fuss">'+
      '<p class="klassifikator" id="klass"></p>'+
      '<button class="knopf klein" type="button" id="btn-beispiel">Beispieltext einsetzen</button>'+
      '<button class="knopf klein" type="button" id="btn-abbrechen-ed">Verwerfen (Esc)</button>'+
      '<button class="knopf haupt klein" type="button" id="btn-festschreiben">Berichtigen · festschreiben</button>'+
    '</div>';
  zielBlock.replaceWith(ed);

  var feld = ed.querySelector(".feld");
  feld.textContent = nur(K.k_9f21.t);
  var pruefe = function(){
    var r = klassifiziere(nur(K.k_9f21.t), feld.textContent);
    var k = $("#klass");
    k.dataset.art = r.art;
    if(r.art === "gleich"){
      k.innerHTML = "<b>Unverändert.</b> Nichts festzuschreiben.";
    } else if(r.art === "redaktion"){
      k.innerHTML = "<b>Redaktion angeboten</b> — dieselbe Karte, korrigiert dargestellt. Kein supersedes, keine Strichlinie, niemand wird benachrichtigt. "+
        esc(r.grund)+" <em>Angeboten, nie gewählt.</em>";
    } else {
      k.innerHTML = "<b>Berichtigung</b> — neue Karte, <code>supersedes k_9f21</code>. Halter sehen die Abweichung. "+esc(r.grund);
    }
  };
  feld.addEventListener("input", pruefe);
  feld.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); festschreiben(feld.textContent); }
    if(e.key === "Escape"){ e.preventDefault(); S.bearbeitet = false; alles(); fokus('[data-karte="k_9f21"]'); }
  });
  feld.addEventListener("paste", function(e){
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
    document.execCommand("insertText", false, t.replace(/\s+/g," ").trim());
    sag("Struktur verworfen. Die Einfügung ergibt genau eine Karte.");
    pruefe();
  });
  pruefe();
  ed.querySelector("#btn-beispiel").addEventListener("click", function(){
    feld.textContent = nur(NEU_TEXT); pruefe(); feld.focus();
  });
  ed.querySelector("#btn-abbrechen-ed").addEventListener("click", function(){
    S.bearbeitet = false; alles(); fokus('[data-karte="k_9f21"]');
  });
  ed.querySelector("#btn-festschreiben").addEventListener("click", function(){ festschreiben(feld.textContent); });
  feld.focus();
  var r = document.createRange(); r.selectNodeContents(feld);
  var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  sag("Editor offen für eine einzige Karte. Enter schreibt fest, Escape verwirft.");
}

function festschreiben(text){
  var t = String(text).replace(/\s+/g," ").trim();
  if(!t){ sag("Leere Karten gibt es nicht."); return; }
  var r = klassifiziere(nur(K.k_9f21.t), t);
  if(r.art === "gleich"){ sag("Unverändert. Nichts festzuschreiben."); return; }
  S.bearbeitet = false; alles();
  abbruchfenster({
    titel:"Berichtigung wird gesendet",
    sub:"Noch hat nichts den Server verlassen. 4 Anordnungen · 3 Halter · 1 Klausel.",
    ok:function(){ berichtigungLanden(t); }
  });
}

function berichtigungLanden(t){
  var neu = { id:"k_a7e3", art:"text", s:14, von:"sl", zeit:"21:52",
    t:t.replace("Kestrel-Vertrag","[[Kestrel-Vertrag]]"), eti:["haus-vharon"] };
  if(neu.t.indexOf("[[") < 0) neu.t = t;
  KARTEN.push(neu); K.k_a7e3 = neu;
  RELATIONEN.push({ von:"k_a7e3", zu:"k_9f21", art:"supersedes" });
  /* Halter der alten Karte erhalten die Berichtigung — dieselbe Menge, kein Fanout. */
  AUSGABEN.filter(function(a){ return a.karte==="k_9f21"; }).forEach(function(a){
    AUSGABEN.push({ karte:"k_a7e3", figur:a.figur, s:14, quelle:"k_9f21" });
  });
  neu.h = AUSGABEN.filter(function(a){ return a.karte==="k_a7e3"; }).map(function(a){ return a.figur; }).join(",");
  neu.hs = 14;
  S.phase = "nach"; S.gewaehlt = "k_a7e3"; S.frisch = "k_9f21"; S.linse = "nachhall";
  S.strom.push({ zeit:"21:52", txt:"Berichtigung k_9f21 → k_a7e3 · 4 Anordnungen · 3 Halter", neu:true });
  alles();
  /* Die vier Anordnungen kippen gestaffelt auf „berichtigt". */
  var betroffen = ANORDNUNGEN.filter(function(a){ return (a.enthaelt||[]).indexOf("k_9f21") > -1; });
  betroffen.forEach(function(a, i){
    setTimeout(function(){ a.berichtigt = true; if(S.linse==="nachhall") $("#lens").innerHTML = renderLinse(), bindeLinse(); }, 200 + i*160);
  });
  setTimeout(function(){ S.frisch = null; }, 1400);
  toastRuhig("Berichtigung festgeschrieben",
    "Ein Satz. Vier Anordnungen sind jetzt richtig — und jede Leserin weiß etwas anderes davon.");
  sag("Berichtigung festgeschrieben. Vier Anordnungen korrigiert, drei Halter sehen die Abweichung, "+
      "die öffentliche Anordnung zeigt nichts. Es gibt keine Datei. Es gibt eine Karte.");
}

/* ═══════════════════════════════════════════════════════════════════════════
   8 · ABBRUCHFENSTER — vier Sekunden, in denen nichts passiert ist.
   ═══════════════════════════════════════════════════════════════════════════ */
var laufend = null;
function abbruchfenster(o){
  abbruchAus();
  var wrap = $("#toastwrap");
  var el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role","alertdialog"); el.setAttribute("aria-label", o.titel);
  el.innerHTML =
    '<div class="ring"><svg viewBox="0 0 38 38" aria-hidden="true">'+
      '<circle class="bahn" cx="19" cy="19" r="16"/><circle class="lauf" cx="19" cy="19" r="16"/></svg>'+
      '<span class="rest zahl">4</span></div>'+
    '<div class="toast-txt"><p class="toast-titel">'+esc(o.titel)+'</p>'+
      '<p class="toast-sub">'+esc(o.sub)+'</p>'+
      '<div class="toast-akt">'+
        '<button class="knopf klein" type="button" data-akt="abbruch">Abbrechen (Esc)</button>'+
        '<button class="knopf haupt klein" type="button" data-akt="jetzt">Jetzt senden</button>'+
      '</div></div>';
  wrap.appendChild(el);
  var ende = Date.now() + 4000;
  var tick = setInterval(function(){
    var rest = Math.max(0, Math.ceil((ende - Date.now())/1000));
    var r = el.querySelector(".rest"); if(r) r.textContent = rest;
  }, 120);
  var timer = setTimeout(function(){ feuern(); }, 4000);
  function aufraeumen(){ clearTimeout(timer); clearInterval(tick); el.remove(); laufend = null; }
  function feuern(){ aufraeumen(); o.ok(); }
  laufend = { weg:aufraeumen, abbrechen:function(){
    aufraeumen();
    toastRuhig("Verworfen", "Nichts hat den Server verlassen. Der Kasten ist unverändert.");
    sag("Verworfen. Nichts hat den Server verlassen.");
  }, feuern:feuern };
  el.querySelector('[data-akt="abbruch"]').addEventListener("click", function(){ laufend.abbrechen(); });
  el.querySelector('[data-akt="jetzt"]').addEventListener("click", function(){ feuern(); });
  el.querySelector('[data-akt="jetzt"]').focus();
  sag(o.titel + ". " + o.sub + " Vier Sekunden zum Abbrechen mit Escape.");
}
function abbruchAus(){ if(laufend && laufend.weg) laufend.weg(); laufend = null; }
function toastRuhig(titel, sub){
  var el = document.createElement("div");
  el.className = "toast ruhig";
  el.innerHTML = '<div class="toast-txt"><p class="toast-titel">'+esc(titel)+'</p><p class="toast-sub">'+esc(sub)+'</p></div>';
  $("#toastwrap").appendChild(el);
  setTimeout(function(){ el.remove(); }, 7000);
}

function leserWechseln(id){

function fokus(sel){ var e = document.querySelector(sel); if(e) e.focus(); }

/* Ereignisse */
document.addEventListener("click", function(e){
  var g = e.target.closest("[data-karte]");

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && laufend){ e.preventDefault(); laufend.abbrechen(); return; }

    var i = items.indexOf(e.target);

});
