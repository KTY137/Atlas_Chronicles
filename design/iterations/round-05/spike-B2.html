/* ══════════════════════════════════════════════════════════════════════════
   1 · Skin-Quellen.  Jeder Skin deklariert eine helle (--l-*) und eine dunkle
       (--d-*) Palette — inklusive der KARTENFARBEN.  Die Leinwand liest
       dieselben Token wie das DOM; es gibt keine zweite Palette für Canvas.
       Unterhalb dieses Blocks steht nirgendwo mehr ein Farbliteral.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --font-m: ui-monospace, "Cascadia Mono", "Consolas", "SF Mono", "Menlo", monospace;
  --bw:1px;            /* Basis-Linienstärke, im hohen Kontrast erhöht */
  --ornament:1;        /* 0 schaltet jedes gezeichnete Ornament ab      */
  --feather:1;         /* 0 = harte Nebelkante (Kontrast/Ruhig)         */
  --t-response:.14s;   /* Druck / Hover / Fokus            110–180 ms   */
  --t-state:.28s;      /* Auswahl / Freigabe / Linse       220–340 ms   */
  --t-scene:.80s;      /* Kamerafahrt / Kapitelwechsel     600–1000 ms  */
  --ease:cubic-bezier(.22,.61,.36,1);
  --gap:clamp(.5rem,1vw,.9rem);
  --maxw:1720px;
}

/* ══════════════════════════════════════════════════════════════════════════
   2 · Die einzige Zuordnungsschicht.  Hell als Voreinstellung → Media Query →
       Attributüberschreibungen, die die Media Query in BEIDEN Richtungen
       schlagen.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:var(--l-bg); --sunk:var(--l-sunk); --surf:var(--l-surf); --surf2:var(--l-surf2);
  --line:var(--l-line); --line2:var(--l-line2); --ink:var(--l-ink); --ink2:var(--l-ink2);
  --ink3:var(--l-ink3); --acc:var(--l-acc); --accink:var(--l-accink); --accsoft:var(--l-accsoft);
  --ok:var(--l-ok); --bad:var(--l-bad); --warn:var(--l-warn); --focus:var(--l-focus);
  --p1:var(--l-p1); --p2:var(--l-p2); --p3:var(--l-p3); --p4:var(--l-p4); --p5:var(--l-p5);
  --water:var(--l-water); --fog:var(--l-fog); --fogedge:var(--l-fogedge); --grid:var(--l-grid);
  --ring:var(--l-ring); --us:var(--l-us); --them:var(--l-them); --anchor:var(--l-anchor);
  --shadow:var(--shadow-l); --grain:rgba(0,0,0,.030);
}

    --p1:var(--d-p1); --p2:var(--d-p2); --p3:var(--d-p3); --p4:var(--d-p4); --p5:var(--d-p5);

    --ring:var(--d-ring); --us:var(--d-us); --them:var(--d-them); --anchor:var(--d-anchor);
    --shadow:var(--shadow-d); --grain:rgba(255,255,255,.026);

}

/* Bewegung ist Zustandskommunikation. Beides schaltet sie ab. */
@media (prefers-reduced-motion: reduce){
  :root{--t-response:0s;--t-state:0s;--t-scene:0s;--feather:0}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
:root[data-motion="reduced"]{--t-response:0s;--t-state:0s;--t-scene:0s;--feather:0}
:root[data-motion="reduced"] *,
:root[data-motion="reduced"] *::before,
:root[data-motion="reduced"] *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}

/* ══════════════════════════════════════════════════════════════════════════
   3 · Grundschrift, Rumpf
   ══════════════════════════════════════════════════════════════════════════ */
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-b);
  font-size:clamp(14px,.55vw + 12.4px,16px); line-height:1.55;
  overflow-x:hidden;
}
.app{max-width:var(--maxw);margin:0 auto;padding:clamp(.5rem,1.2vw,1.05rem);
     display:flex;flex-direction:column;gap:var(--gap)}
.num,.tab{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--font-m);font-size:.86em}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--acc);
      color:var(--accink);padding:.5rem .9rem;border-radius:var(--r1)}
.skip:focus{left:.5rem;top:.5rem}

:where(a,button,select,input,summary,[tabindex]):focus-visible{
  outline:3px solid var(--focus); outline-offset:2px; border-radius:var(--r3);
}
canvas:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.panel{
  background:var(--surf); border:var(--bw) solid var(--line);
  border-radius:var(--r2); box-shadow:var(--shadow); position:relative;
}
.panel::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  opacity:calc(var(--ornament) * .55);
  background:
    linear-gradient(180deg,var(--grain),transparent 42%),
    radial-gradient(120% 90% at 50% -20%, var(--grain), transparent 55%);
}
.pad{padding:clamp(.55rem,.9vw,.9rem)}

h1,h2,h3,h4{font-family:var(--font-d);letter-spacing:var(--track-d);font-weight:var(--wt-d);
            line-height:1.18;text-wrap:balance}
h1{font-size:clamp(1.18rem,1.9vw,1.62rem)}
h2{font-size:clamp(.98rem,1.25vw,1.16rem)}
h3{font-size:.86rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2)}
h4{font-size:.79rem;letter-spacing:.06em;color:var(--ink2)}
p{max-width:74ch}

/* ══════════════════════════════════════════════════════════════════════════
   4 · Kopf + Achsenleiste
   ══════════════════════════════════════════════════════════════════════════ */
.top{display:flex;flex-wrap:wrap;gap:var(--gap);align-items:flex-start;
     justify-content:space-between;padding:clamp(.5rem,.9vw,.85rem)}
.brandline{display:flex;flex-direction:column;gap:.12rem;min-width:min(100%,17rem)}
.brand{font-family:var(--font-d);font-weight:var(--wt-d);letter-spacing:var(--track-d);
       font-size:1.02rem}
.brand em{font-style:normal;color:var(--ink3);font-weight:400}
.subtle{color:var(--ink3);font-size:.74rem;line-height:1.35}
.axes{display:flex;flex-wrap:wrap;gap:.4rem;flex:1 1 30rem;justify-content:flex-end}
.axis{display:flex;align-items:stretch;gap:0;border:var(--bw) solid var(--line);
      border-radius:var(--r2);background:var(--surf2);overflow:hidden}
.axis__lab{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
           padding:.32rem .45rem;display:flex;align-items:center;background:var(--sunk);
           border-right:var(--bw) solid var(--line);white-space:nowrap}
.seg{display:flex}
.seg button{
  appearance:none;background:transparent;border:0;border-left:var(--bw) solid transparent;
  padding:.32rem .5rem;font-size:.73rem;color:var(--ink2);cursor:pointer;white-space:nowrap;
  transition:background var(--t-response) var(--ease),color var(--t-response) var(--ease);
}
.seg button + button{border-left-color:var(--line)}

   ══════════════════════════════════════════════════════════════════════════ */
.shell{display:grid;grid-template-columns:auto minmax(0,1fr) 340px;gap:var(--gap);align-items:start}

}
.rail{padding:.4rem;position:sticky;top:.4rem}
.rail ul{display:flex;flex-direction:column;gap:.15rem}
.rail button{
  appearance:none;background:transparent;border:0;border-radius:var(--r1);
  display:flex;align-items:center;gap:.5rem;padding:.42rem .5rem;width:100%;
  cursor:pointer;color:var(--ink2);font-size:.76rem;white-space:nowrap;
  transition:background var(--t-response) var(--ease);

/* ── Bühne ── */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:var(--gap);align-items:start}

.tisch{padding:clamp(.5rem,.9vw,.85rem);display:flex;flex-direction:column;gap:.55rem;min-width:0}
.tisch__head{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;justify-content:space-between}

.tools{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}

/* Kartenrahmen */
.plate{
  position:relative;border:var(--bw) solid var(--line2);border-radius:var(--r1);
  background:var(--sunk);overflow:hidden;
}
.plate canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.plate__ov{
  position:absolute;inset:auto .4rem .4rem .4rem;display:flex;flex-wrap:wrap;gap:.3rem;
  align-items:flex-end;justify-content:space-between;pointer-events:none;
}
.chipline{display:flex;flex-wrap:wrap;gap:.28rem}
.chip{
  font-size:.63rem;letter-spacing:.03em;padding:.14rem .38rem;border-radius:var(--r3);
  border:var(--bw) solid var(--line2);background:var(--surf);color:var(--ink2);
  font-variant-numeric:tabular-nums;
}

.legend{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.68rem;color:var(--ink3)}
.legend b{color:var(--ink2);font-weight:600}
.lg{display:inline-flex;align-items:center;gap:.28rem}
.lg svg{flex:none}

/* Messstreifen */
.meterrow{display:flex;flex-wrap:wrap;gap:.32rem}
.meter{
  display:flex;flex-direction:column;gap:.02rem;border:var(--bw) solid var(--line);
  border-radius:var(--r3);padding:.24rem .45rem;background:var(--surf2);min-width:5.6rem;
}

/* ── Die Ordnung (Initiative) ── */
.ord{padding:.5rem;display:flex;flex-direction:column;gap:.4rem;min-width:0}
.ord ol{display:flex;flex-direction:column;gap:.22rem}
.ordrow{
  display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto;gap:.4rem;align-items:center;
  width:100%;text-align:left;background:var(--surf2);border:var(--bw) solid var(--line);
  border-radius:var(--r1);padding:.32rem .4rem;cursor:pointer;color:var(--ink);
  transition:border-color var(--t-response) var(--ease),background var(--t-response) var(--ease);
}

/* ── Kontextlinse ── */
.lens{display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:var(--bw) solid var(--line);overflow-x:auto}
.tabs button{

/* ══════════════════════════════════════════════════════════════════════════
   6 · Die drei Namenszustände — drei NICHT-FARBLICHE Merkmale
        geschrieben  = Gewicht + Unterstreichung + Klickziel
        Nennung      = gepunktete Grundlinie, KEIN Klickziel, kein Cursorwechsel
        Schwelle     = Ring (⃝-Präfix) + Gewicht + Klickziel
   ══════════════════════════════════════════════════════════════════════════ */
.n{overflow-wrap:anywhere}

         background:none;border:0;padding:0;cursor:pointer;font:inherit;font-weight:600}

  color:var(--ink2);border-bottom:1px dotted var(--line2);cursor:default;
  background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit;
}

.n--schwelle{
  color:var(--ink);font-weight:700;background:none;border:0;padding:0 .1rem;font:inherit;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:baseline;gap:.22rem;
}
.n--schwelle::before{
  content:"";width:.62em;height:.62em;border:1.5px solid var(--ring);border-radius:999px;
  border-top-color:transparent;display:inline-block;transform:translateY(.02em) rotate(-25deg);flex:none;
}
.n--verworfen{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:1px}

/* ══════════════════════════════════════════════════════════════════════════
   7 · Die Namensprüfung — Tabelle + Regelpaket
   ══════════════════════════════════════════════════════════════════════════ */

.sect__head{display:flex;flex-wrap:wrap;gap:.5rem;align-items:baseline;justify-content:space-between;
            padding:clamp(.5rem,.9vw,.8rem);border-bottom:var(--bw) solid var(--line)}
.kaskade{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;font-size:.7rem;color:var(--ink3);
         padding:.45rem clamp(.5rem,.9vw,.8rem);border-bottom:var(--bw) solid var(--line);
         background:var(--surf2);overflow-x:auto}
.kstep{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
.kstep b{font-size:.9rem;color:var(--ink);font-variant-numeric:tabular-nums}
.karr{color:var(--line2)}

.tblwrap{overflow-x:auto;max-height:26rem;overflow-y:auto}
table.led{width:100%;font-size:.73rem;min-width:31rem}
table.led th{
  position:sticky;top:0;z-index:1;background:var(--surf2);text-align:left;
  font-size:.61rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);

}

.namebtn{background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;color:inherit}

.mini:hover{background:var(--accsoft);color:var(--ink)}

/* Regelpaket */

.pill{display:flex;border:var(--bw) solid var(--line);border-radius:var(--r3);overflow:hidden}
.pill button{appearance:none;background:transparent;border:0;padding:.16rem .34rem;font-size:.63rem;
             cursor:pointer;color:var(--ink3);white-space:nowrap}
.pill button + button{border-left:var(--bw) solid var(--line)}
.pill button[aria-pressed="true"]{background:var(--acc);color:var(--accink);font-weight:600}

/* ══════════════════════════════════════════════════════════════════════════
   8 · Prüfbericht
   ══════════════════════════════════════════════════════════════════════════ */
.report__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15.5rem,1fr));gap:var(--gap);
              padding:clamp(.5rem,.9vw,.8rem)}
.rbox{border:var(--bw) solid var(--line);border-radius:var(--r1);background:var(--surf2);

.badge{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.05em;padding:.02rem .3rem;
       border-radius:var(--r3);border:var(--bw) solid currentColor}

        border-bottom:var(--bw) solid var(--line);padding-bottom:.14rem}

.log .t{color:var(--ink3);overflow-wrap:anywhere}

/* ══════════════════════════════════════════════════════════════════════════
   9 · Regal / Shelf
   ══════════════════════════════════════════════════════════════════════════ */

  border-radius:var(--r1);padding:.3rem .6rem;font-size:.74rem;cursor:pointer;white-space:nowrap;
  transition:background var(--t-response) var(--ease),transform var(--t-response) var(--ease);
}
.act:hover{background:var(--accsoft)}
.act:active{transform:translateY(1px)}
.act--pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}

.kitband{position:relative;height:2.6rem;border:var(--bw) solid var(--line);border-radius:var(--r1);

/* ══════════════════════════════════════════════════════════════════════════
   5 · DIE NAMENSPRÜFUNG — vier Stufen, deterministisch, ohne Modell.
       Läuft bei jedem Regelwechsel neu und liefert für JEDE Zeile einen Grund.

function klasseVon(label){
  var p=P_(), u=S.regelUeber[S.welt+"|"+label];
  if(u) return u;
  for(var i=0;i<p.felder.length;i++){
    var f=p.felder[i];
    if(f.l===label) return f.k;
    if(f.l.indexOf(" / ")>=0 && f.l.split(" / ").indexOf(label)>=0) return f.k;
  }
  return "unbekannt";
}
function paketFelder(){
  var p=P_(), out=[];
  for(var i=0;i<p.felder.length;i++){
    var f=p.felder[i];
    out.push({l:f.l, ev:f.ev, k:(S.regelUeber[S.welt+"|"+f.l]||f.k), geaendert:!!S.regelUeber[S.welt+"|"+f.l]});
  }

}
function pruefe(k){
  var p=P_(), key=S.welt+"|"+k.n;
  /* Stufe 0 — Notation und Kollaps auf einen blauen Artikel */
  if(k.grundCode==="notation")
    return {urteil:"verworfen", stufe:"Notation",
      grund:"Formmarker · Muster "+p.notation+" · "+(k.sammel||1)+" Ziele, "+k.d+" Kanten",
      warum:"Die Notationssperre läuft VOR der Erreichbarkeit — sonst stünde »N. K« im Ortsfeld »sitz« und wäre eine Tür zu einem Datumsformat."};
  if(k.grundCode==="kollaps-blau")
    return {urteil:"verworfen", stufe:"Referent-Kollaps",
      grund:"Schreibvariante eines bereits geschriebenen Artikels",
      warum:"Der Referent existiert. Es fehlt keine Seite, es fehlt eine Weiterleitung."};

  /* Stufe 1 — die Beförderung des GM sticht die Maschine */
  if(S.befoerdert[key])
    return {urteil:"schwelle", stufe:"Beförderung", handbefoerdert:true,
      grund:"von Hand befördert · Regel gelernt, Umkehr protokolliert",
      warum:"Eine Beförderung ist auditiert und dauerhaft; sie fügt dem Paket keine Regel hinzu, sondern eine Ausnahme mit Datum."};
  if(S.zurueckgestuft[key])
    return {urteil:"nennung", stufe:"Rückstufung", zurueck:true,
      grund:"seit drei Sitzungen unberührt · zurückgestuft",
      warum:"Eine Tür ist gemietet, nicht besessen. Der Name behält seine Belegstellen."};

  /* Stufe 2 — Nachfrage */
  if(k.d < p.schwellenwert)
    return {urteil:"nennung", stufe:"Nachfrage",
      grund:"Nachfrage "+k.d+" < Schwellenwert "+p.schwellenwert,
      warum:"Der Schwellenwert ist eine Paketzeile, kein Code. Bei "+(p.schwellenwert-1)+" wäre dieser Name eine Schwelle."};

  /* Stufe 3 — Erreichbarkeit, gelesen an der Feldbezeichnung, die der Autor
     ohnehin getippt hat.  Nicht am Wort. Nicht an einem Modell. */
  var belegOrt=[], belegPers=[], belegAttr=[], belegMehr=[];
  for(var i=0;i<(k.felder||[]).length;i++){
    var f=k.felder[i], kl=klasseVon(f.label);
    if(kl==="ortsfeld") belegOrt.push(f);
    else if(kl==="personenfeld") belegPers.push(f);
    else if(kl==="mehrdeutig") belegMehr.push(f);
    else belegAttr.push(f);
  }
  function etiketten(liste){
    var seen={}, out=[];
    for(var q=0;q<liste.length;q++){
      var lb=liste[q].label;
      if(!seen[lb]){ seen[lb]=1; out.push(lb); }
    }
    return out;
  }
  if(belegOrt.length)
    return {urteil:"schwelle", stufe:"Erreichbarkeit", art:"ortsfeld",
      grund:"Ortsfeld »"+etiketten(belegOrt).join("«, »")+"« · "+belegOrt.length+" Belegstelle"+
            (belegOrt.length>1?"n":"")+" ("+belegOrt[0].artikel+(belegOrt.length>1?" u. a.":"")+")",
      warum:"Der Typ folgt aus der Struktur, die der Autor ohnehin ausfüllt — nicht aus einer zweiten Pflicht, die er ignoriert."};
  if(k.marker)
    return {urteil:"schwelle", stufe:"Erreichbarkeit", art:"marker",
      grund:"Marker auf "+W().karte.name+" · Position, Fraktion, Beschreibung",
      warum:"Ein Marker ist ein Titel MIT Position. Er kostet den GM nichts und war unter der alten These unsichtbar, weil eine Tür ein link_id in einer Passage war."};
  if(belegPers.length)
    return {urteil:"schwelle", stufe:"Erreichbarkeit", art:"personenfeld",
      grund:"Personenfeld »"+etiketten(belegPers).join("«, »")+"« ("+belegPers[0].artikel+
            (belegPers.length>1?" u. a.":"")+")",
      warum:"Zu einer Person kann man hingehen. Zu einer Sprache nicht."};
  if(belegMehr.length)
    return {urteil:"nennung", stufe:"Erreichbarkeit",
      grund:"nur mehrdeutige Felder: »"+etiketten(belegMehr).join("«, »")+"«",
      warum:"»"+belegMehr[0].label+"« trägt im Korpus Personen, Ämter UND Datumsmarker. Ein mehrdeutiges Feld ist kein alleiniger Beleg."};
  if(belegAttr.length)
    return {urteil:"nennung", stufe:"Erreichbarkeit",
      grund:"nur in Feldern »"+etiketten(belegAttr).join("«, »")+"« genannt · "+belegAttr.length+
            " Belegstelle"+(belegAttr.length>1?"n":"")+" — man kann nicht hingehen",
      warum:"Zwei Zeilen derselben Infobox, eine ein Name und eine eine Tür, und der Unterschied ist ein Wort, das der Autor ohne Nachdenken getippt hat."};
  return {urteil:"nennung", stufe:"Erreichbarkeit",
    grund:"nur im Fließtext genannt, in keinem Feld",
    warum:"Ein Name, den niemand in ein Feld geschrieben hat, hat keine Adresse — und braucht meistens auch keine."};
}
function alleUrteile(){
  var w=W(), out=[];

/* ══════════════════════════════════════════════════════════════════════════
   6 · SICHT — die Projektion.  Der Nebel ist keine Geometrie, sondern eine
       MENGE VON REGION-IDS; die Maske ist ein abgeleitetes Zeichenartefakt.
   ══════════════════════════════════════════════════════════════════════════ */
function sichtRegionen(rolle){
  var w=W(), r=w.leser[rolle||S.rolle];
  var ids=r.regionen.slice();
  if((rolle||S.rolle)!=="leitung"){
    for(var i=0;i<S.freigabeExtra.length;i++)
      if(ids.indexOf(S.freigabeExtra[i])<0) ids.push(S.freigabeExtra[i]);
  }
  return ids;
}
function haeltSchwelle(rolle, sid){
  var r=W().leser[rolle||S.rolle];
  if(r.haelt==="alle") return true;
  return r.haelt.indexOf(sid)>=0;
}
function entfernung(s){
  var w=W(), st=w.karte.standort, x, y;
  if(s.geo==="ohne") return null;
  if(s.geo==="umriss"){ var cx=0,cy=0; for(var i=0;i<s.poly.length;i++){cx+=s.poly[i][0];cy+=s.poly[i][1];}
    x=cx/s.poly.length; y=cy/s.poly.length; }
  else { x=s.x; y=s.y; }
  var d=Math.sqrt((x-st.x)*(x-st.x)+(y-st.y)*(y-st.y));
  return {e:d, reise:d/w.karte.reise};
}
/* Die Szene, wie sie AN DIESEN LESER ausgeliefert würde.  Genau dieses
   Objekt wird serialisiert und im Zwillingsbeweis Byte für Byte verglichen. */
function szene(rolle){
  var w=W(), t0=performance.now();
  var ids=sichtRegionen(rolle);
  var o={ karte:w.karte.id, bounds:w.karte.bounds, origin:w.karte.origin,
          raster:S.raster, band:S.band, sicht_regionen:ids.slice().sort(),
          figuren:[], schwellen:[] };
  for(var i=0;i<w.figuren.length;i++){
    var f=w.figuren[i];
    o.figuren.push({id:f.id, name:f.name, x:Math.round(f.x), y:Math.round(f.y),
      band:f.band, tp:f.hp, tp_max:f.hpMax, zustand:f.zustand.slice()});
  }
  var live=schwellenLive();
  for(var j=0;j<live.length;j++){
    var s=live[j].s;
    if(!haeltSchwelle(rolle, s.id)) continue;         /* ← die ganze These    */
    var e=entfernung(s);
    o.schwellen.push({id:s.id, name:s.name, geo:s.geo,
      x:(s.geo==="punkt"?s.x:null), y:(s.geo==="punkt"?s.y:null),
      nachfrage:s.nachfrage, entfernung:e?Math.round(e.e):null,
      reise:e?Number(e.reise.toFixed(2)):null, grund:s.grund});
  }
  S.sichtMs=performance.now()-t0;
  return o;
}
function stabil(o){
  if(o===null||o===undefined) return "null";
  if(Array.isArray(o)) return "["+o.map(stabil).join(",")+"]";
  if(typeof o==="object"){
    var k=Object.keys(o).sort();
    return "{"+k.map(function(x){return JSON.stringify(x)+":"+stabil(o[x]);}).join(",")+"}";
  }
  return JSON.stringify(o);
}

   7 · DIE LEINWAND
   ══════════════════════════════════════════════════════════════════════════ */
var cv=null, ctx=null, CW=1000, CH=640, DPR=1;
var platte=null, plattenSchluessel="";

function noise2(seed,x,y){
  var h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(seed|0,1442695041))>>>0;
  h=(h^(h>>>13))>>>0; h=Math.imul(h,1274126177)>>>0;
  return ((h^(h>>>16))>>>0)/4294967295;
}

function wert2(seed,x,y){
  var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  var a=noise2(seed,xi,yi), b=noise2(seed,xi+1,yi), c=noise2(seed,xi,yi+1), d=noise2(seed,xi+1,yi+1);
  var u=smooth(xf), v=smooth(yf);

function fbm(seed,x,y){
  var s=0, amp=.5, f=1;

/* Die Platte: ein 512² Offscreen-Puffer über die vollen Kartengrenzen.

function baueplatte(){

  var N = (w.karte.plate==="gelaende") ? 352 : 512;
  platte=document.createElement("canvas"); platte.width=N; platte.height=N;
  var p=platte.getContext("2d");
  var pal=[farbe("--p1"),farbe("--p2"),farbe("--p3"),farbe("--p4"),farbe("--p5")];
  var wasser=farbe("--water"), linie=farbe("--grid");

  if(w.karte.plate==="gelaende"){
    var img=p.createImageData(N,N), dat=img.data, hs=new Float32Array(N*N);
    for(var y=0;y<N;y++) for(var x=0;x<N;x++){
      var nx=x/N*7.0, ny=y/N*7.0;
      var h=fbm(w.karte.seed,nx,ny);
      /* Landmasse: weicher Abfall zum Rand, damit eine Küste entsteht */
      var dx=(x/N-.46)*2.05, dy=(y/N-.52)*2.05;
      h=h*1.12 - .34*Math.sqrt(dx*dx+dy*dy);
      hs[y*N+x]=h;
    }
    function stufe(h){ if(h<w.karte.wasserhoehe) return -1;
      var q=(h-w.karte.wasserhoehe)/(0.62-w.karte.wasserhoehe);
      return Math.max(0,Math.min(4,Math.floor(q*5))); }
    for(var y2=0;y2<N;y2++) for(var x2=0;x2<N;x2++){
      var i=(y2*N+x2)*4, st=stufe(hs[y2*N+x2]);
      var c = st<0 ? wasser : pal[st];
      /* Höhenlinie: Stufenwechsel gegenüber dem rechten/unteren Nachbarn */
      var st2 = x2<N-1 ? stufe(hs[y2*N+x2+1]) : st;
      var st3 = y2<N-1 ? stufe(hs[(y2+1)*N+x2]) : st;
      if(st2!==st || st3!==st) c=mix(linie,c,.42);
      dat[i]=c[0]; dat[i+1]=c[1]; dat[i+2]=c[2]; dat[i+3]=255;
    }
    p.putImageData(img,0,0);
  }
  else if(w.karte.plate==="deck"){
    p.fillStyle=rgbs(pal[0]); p.fillRect(0,0,N,N);
    /* Ring: konzentrische Deckssegmente, deterministisch */
    p.save(); p.translate(N*.5,N*.5);
    for(var r=0;r<5;r++){
      p.beginPath(); p.arc(0,0,60+r*44,0,Math.PI*2);
      p.strokeStyle=rgbs(mix(linie,pal[1],.35)); p.lineWidth=1.2; p.stroke();
    }
    for(var a=0;a<24;a++){
      p.beginPath(); p.moveTo(0,0);
      p.lineTo(Math.cos(a/24*Math.PI*2)*260, Math.sin(a/24*Math.PI*2)*260);
      p.strokeStyle=rgbs(mix(linie,pal[0],.2)); p.lineWidth=.8; p.stroke();
    }
    p.restore();
    /* Module: 34 deterministische Rechtecke */
    for(var m=0;m<34;m++){
      var rx=noise2(w.karte.seed,m,1)*N*.82+N*.06;
      var ry=noise2(w.karte.seed,m,2)*N*.82+N*.06;
      var rw=26+noise2(w.karte.seed,m,3)*54, rh=22+noise2(w.karte.seed,m,4)*46;
      var lvl=Math.floor(noise2(w.karte.seed,m,5)*4)+1;
      p.fillStyle=rgbs(pal[lvl]); p.fillRect(rx,ry,rw,rh);
      p.strokeStyle=rgbs(mix(linie,pal[lvl],.55)); p.lineWidth=1.4; p.strokeRect(rx,ry,rw,rh);
      if(noise2(w.karte.seed,m,6)>.6){
        p.fillStyle=rgbs(mix(linie,pal[lvl],.28));
        p.fillRect(rx+4,ry+4,rw-8,4);
      }
    }
  }
  else { /* grundriss */
    p.fillStyle=rgbs(pal[1]); p.fillRect(0,0,N,N);
    /* Außenwand */
    p.strokeStyle=rgbs(linie); p.lineWidth=5; p.strokeRect(34,34,N-68,N-68);
    /* Räume: deterministisches Rasterlayout */
    var cols=5, rows=5;
    for(var cy2=0;cy2<rows;cy2++) for(var cx2=0;cx2<cols;cx2++){
      var jx=noise2(w.karte.seed,cx2,cy2)*10-5, jy=noise2(w.karte.seed,cy2,cx2)*10-5;
      var bx=44+cx2*((N-88)/cols)+jx, by=44+cy2*((N-88)/rows)+jy;
      var bw=(N-88)/cols-14, bh=(N-88)/rows-14;
      var lvl2=Math.floor(noise2(w.karte.seed,cx2*7+cy2,9)*3);
      p.fillStyle=rgbs(pal[lvl2]); p.fillRect(bx,by,bw,bh);
      p.strokeStyle=rgbs(linie); p.lineWidth=2.4; p.strokeRect(bx,by,bw,bh);
      /* Tür: eine Lücke in der Wand */
      p.strokeStyle=rgbs(pal[lvl2]); p.lineWidth=3.4;
      p.beginPath(); p.moveTo(bx+bw*.42,by+bh); p.lineTo(bx+bw*.62,by+bh); p.stroke();
      /* Dielen */
      p.strokeStyle=rgbs(mix(linie,pal[lvl2],.14)); p.lineWidth=.7;
      for(var dl=1;dl<5;dl++){ p.beginPath(); p.moveTo(bx,by+bh*dl/5); p.lineTo(bx+bw,by+bh*dl/5); p.stroke(); }
    }
  }
}
function istDunkel(){
  if(S.licht==="dunkel") return true;
  if(S.licht==="hell") return false;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
}

/* Transformation Welt → Bildschirm.  origin bottom-left, Reihenfolge xy. */
function skala(){ return (CW/8192)*S.zoom; }
function w2s(x,y){ var s=skala(); return [ (x-S.cx)*s + CW/2, CH/2 - (y-S.cy)*s ]; }
function s2w(sx,sy){ var s=skala(); return [ (sx-CW/2)/s + S.cx, S.cy - (sy-CH/2)/s ]; }

function rasterFang(x,y){
  if(S.raster==="quadrat"){ var c=128;
    return [Math.floor(x/c)*c+c/2, Math.floor(y/c)*c+c/2]; }
  if(S.raster==="hex"){
    var R=73.9, wq=Math.sqrt(3)*R, hq=1.5*R;
    var row=Math.round(y/hq);
    var off=(row%2!==0)?wq/2:0;
    var col=Math.round((x-off)/wq);
    return [col*wq+off, row*hq];
  }
  return [Math.round(x), Math.round(y)];
}

var SCHRIFT="serif";
function zeichne(){
  if(!ctx) return;
  var t0=performance.now(), w=W();
  SCHRIFT=getComputedStyle(document.body).fontFamily||"serif";
  baueplatte();
  S.stat={ringe:0, nennungen:0, figuren:0, linien:0, marken:0};

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle=rgbs(farbe("--sunk")); ctx.fillRect(0,0,CW,CH);

  /* 1 · Platte */
  var a=w2s(0,8192), b=w2s(8192,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(platte, a[0], a[1], b[0]-a[0], b[1]-a[1]);

  /* 2 · Raster */
  var grid=farbe("--grid");
  ctx.strokeStyle="rgba("+grid.map(Math.round).join(",")+",.30)";
  ctx.lineWidth=1;
  if(S.raster==="quadrat"){
    var c=128, s=skala(), erst=Math.floor(s2w(0,CH)[0]/c)*c, letzt=s2w(CW,0)[0];
    if((letzt-erst)/c < 400){
      ctx.beginPath();
      for(var gx=erst; gx<=letzt; gx+=c){ var p1=w2s(gx,0), p2=w2s(gx,8192);
        ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); S.stat.linien++; }
      var ey=Math.floor(s2w(0,CH)[1]/c)*c, ly=s2w(0,0)[1];
      for(var gy=ey; gy<=ly; gy+=c){ var p3=w2s(0,gy), p4=w2s(8192,gy);
        ctx.moveTo(p3[0],p3[1]); ctx.lineTo(p4[0],p4[1]); S.stat.linien++; }
      ctx.stroke();
    }
  } else if(S.raster==="hex"){
    var R=73.9, wq=Math.sqrt(3)*R, hq=1.5*R;
    var y0=Math.max(0,Math.floor(s2w(0,CH)[1]/hq)-1), y1=Math.min(8192/hq, Math.ceil(s2w(0,0)[1]/hq)+1);
    var x0=Math.max(0,Math.floor(s2w(0,0)[0]/wq)-1), x1=Math.min(8192/wq, Math.ceil(s2w(CW,0)[0]/wq)+1);
    if((y1-y0)*(x1-x0) < 7000){
      var sq=skala(), ox=[], oy=[];
      for(var k3=0;k3<6;k3++){
        var ag=Math.PI/180*(60*k3-90);
        ox.push(R*Math.cos(ag)*sq); oy.push(-R*Math.sin(ag)*sq);
      }
      ctx.beginPath();
      for(var ry=y0; ry<=y1; ry++){
        var off=(ry%2!==0)?wq/2:0;
        for(var rx=x0; rx<=x1; rx++){
          var ctr=w2s(rx*wq+off, ry*hq);
          if(ctr[0]<-90||ctr[0]>CW+90||ctr[1]<-90||ctr[1]>CH+90) continue;
          ctx.moveTo(ctr[0]+ox[0], ctr[1]+oy[0]);
          for(var k4=1;k4<6;k4++) ctx.lineTo(ctr[0]+ox[k4], ctr[1]+oy[k4]);
          ctx.closePath(); S.stat.linien++;
        }
      }
      ctx.stroke();
    }
  } /* "ohne": kein Raster, dafür unten der Maßstab */

  /* 3 · Regionsumrisse (die freigegebenen sind zugleich die Nebelöffnung) */
  var frei=sichtRegionen();
  var t1=performance.now();
  var fog=farbe("--fog"), fogA=(S.kontrast==="high")?.94:.86;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,CW,CH);
  for(var ri=0; ri<w.karte.regionen.length; ri++){
    var reg=w.karte.regionen[ri];
    if(frei.indexOf(reg.id)<0) continue;
    var pts=reg.poly;
    for(var pi=0;pi<pts.length;pi++){
      var sp2=w2s(pts[pi][0],pts[pi][1]);
      if(pi===0) ctx.moveTo(sp2[0],sp2[1]); else ctx.lineTo(sp2[0],sp2[1]);
    }
    ctx.closePath();
  }
  ctx.fillStyle="rgba("+fog.map(Math.round).join(",")+","+fogA+")";
  ctx.fill("evenodd");
  ctx.restore();
  /* Nebelkante: weich, wenn Bewegung erlaubt ist; sonst hart */
  var kante=farbe("--fogedge");
  var weich=getComputedStyle(document.documentElement).getPropertyValue("--feather").trim()!=="0";
  for(var ri2=0; ri2<w.karte.regionen.length; ri2++){
    var reg2=w.karte.regionen[ri2];
    if(frei.indexOf(reg2.id)<0) continue;
    var lagen = weich ? [[7,.07],[4,.13],[1.6,.9]] : [[2.4,1]];
    for(var li=0; li<lagen.length; li++){
      ctx.beginPath();
      for(var pj=0;pj<reg2.poly.length;pj++){
        var s3=w2s(reg2.poly[pj][0],reg2.poly[pj][1]);
        if(pj===0) ctx.moveTo(s3[0],s3[1]); else ctx.lineTo(s3[0],s3[1]);
      }
      ctx.closePath();
      ctx.strokeStyle="rgba("+kante.map(Math.round).join(",")+","+lagen[li][1]+")";
      ctx.lineWidth=lagen[li][0]; ctx.stroke();
    }
  }
  S.nebelMs=performance.now()-t1;

  /* 4 · Die Schwellen — dünne, NICHT geschlossene Ringe.
         Eine Nennung wird als NICHTS gezeichnet.  Kein Geist, kein Pin,
         kein gepunkteter Kreis.  Das ist der ehrliche Render. */
  var live=schwellenLive(), ringf=farbe("--ring");
  ctx.font='600 11px '+SCHRIFT;
  for(var si=0; si<live.length; si++){
    var s=live[si].s;
    if(!haeltSchwelle(null, s.id)) continue;
    if(s.geo==="ohne"){ S.stat.marken++; continue; }
    var gewaehlt = S.ausgewaehlteSchwelle===s.id;
    ctx.strokeStyle=rgbs(ringf);
    ctx.lineWidth=gewaehlt?2.4:1.5;
    if(s.geo==="umriss"){
      ctx.beginPath();
      for(var pk=0;pk<s.poly.length-1;pk++){          /* letzte Kante fehlt   */
        var s4=w2s(s.poly[pk][0],s.poly[pk][1]);
        if(pk===0) ctx.moveTo(s4[0],s4[1]); else ctx.lineTo(s4[0],s4[1]);
      }
      var sl=w2s(s.poly[s.poly.length-1][0],s.poly[s.poly.length-1][1]);
      ctx.lineTo(sl[0],sl[1]);
      ctx.stroke();
      var cc=[0,0]; for(var pc=0;pc<s.poly.length;pc++){cc[0]+=s.poly[pc][0];cc[1]+=s.poly[pc][1];}
      var ctr=w2s(cc[0]/s.poly.length, cc[1]/s.poly.length);
      beschrifte(s, ctr[0], ctr[1]+2);
    } else {
      var sp5=w2s(s.x,s.y), rr=gewaehlt?15:12;
      ctx.beginPath();
      ctx.arc(sp5[0],sp5[1],rr, Math.PI*0.16, Math.PI*1.84);   /* unvollendet */
      ctx.stroke();
      if(gewaehlt){
        ctx.beginPath(); ctx.arc(sp5[0],sp5[1],rr+5, Math.PI*0.16, Math.PI*1.84);
        ctx.strokeStyle="rgba("+ringf.map(Math.round).join(",")+",.35)";
        ctx.lineWidth=1; ctx.stroke();
      }
      beschrifte(s, sp5[0], sp5[1]-rr-4);
    }
    S.stat.ringe++; S.stat.marken++;
  }
  function beschrifte(s,x,y){
    var e=entfernung(s);
    var txt=s.name+" · "+(e?fix(e.reise,0)+" "+W().karte.reiseWort:t("keineGeom"));
    var m=ctx.measureText(txt);
    ctx.fillStyle="rgba("+farbe("--surf").map(Math.round).join(",")+",.88)";
    ctx.fillRect(x-m.width/2-4, y-13, m.width+8, 15);
    ctx.strokeStyle="rgba("+ringf.map(Math.round).join(",")+",.5)"; ctx.lineWidth=1;
    ctx.strokeRect(x-m.width/2-4, y-13, m.width+8, 15);
    ctx.fillStyle=rgbs(farbe("--ink"));
    ctx.textAlign="center"; ctx.fillText(txt, x, y-2); ctx.textAlign="left";
  }

  /* 5 · Figuren.  Höhenband als Form (Badge), nicht als Farbe. */
  for(var fi=0; fi<w.figuren.length; fi++){
    var f=w.figuren[fi];
    if(S.band!=="alle" && f.band!==S.band){ zeichneFigur(f,true); continue; }
    zeichneFigur(f,false);
  }
  function zeichneFigur(f, gedimmt){
    var sp6=w2s(f.x,f.y), r=13;
    var frei2=sichtRegionen();
    ctx.globalAlpha = gedimmt ? .28 : 1;
    ctx.beginPath(); ctx.arc(sp6[0],sp6[1],r,0,Math.PI*2);
    ctx.fillStyle=rgbs(farbe("--surf")); ctx.fill();
    ctx.strokeStyle=rgbs(farbe(f.seite==="us"?"--us":"--them")); ctx.lineWidth=2.4; ctx.stroke();
    /* TP als Bogen */
    ctx.beginPath();
    ctx.arc(sp6[0],sp6[1],r+3.4, -Math.PI/2, -Math.PI/2 + Math.PI*2*(f.hp/f.hpMax));
    ctx.strokeStyle=rgbs(farbe(f.seite==="us"?"--us":"--them")); ctx.lineWidth=2.4; ctx.stroke();
    ctx.fillStyle=rgbs(farbe("--ink"));
    ctx.font='700 10px '+SCHRIFT;
    ctx.textAlign="center"; ctx.fillText(f.kurz, sp6[0], sp6[1]+3.5); ctx.textAlign="left";
    /* Höhenband-Badge */
    var bd=null; for(var bi=0;bi<w.karte.baender.length;bi++) if(w.karte.baender[bi].id===f.band) bd=w.karte.baender[bi];
    if(bd){
      ctx.fillStyle=rgbs(farbe("--surf")); ctx.strokeStyle=rgbs(farbe("--line2")); ctx.lineWidth=1;
      ctx.fillRect(sp6[0]+8, sp6[1]-19, 15, 12); ctx.strokeRect(sp6[0]+8, sp6[1]-19, 15, 12);
      ctx.fillStyle=rgbs(farbe("--ink2"));
      ctx.font='600 9px '+SCHRIFT;
      ctx.textAlign="center"; ctx.fillText(bd.kurz, sp6[0]+15.5, sp6[1]-10); ctx.textAlign="left";
    }
    /* Zustand: gestrichelter Ring statt Farbe */
    if(f.zustand.length){
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(sp6[0],sp6[1],r+7,0,Math.PI*2);
      ctx.strokeStyle=rgbs(farbe("--warn")); ctx.lineWidth=1.4; ctx.stroke();
      ctx.setLineDash([]);
    }
    if(S.gewaehlt===f.id){
      ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.arc(sp6[0],sp6[1],r+10,0,Math.PI*2);
      ctx.strokeStyle=rgbs(farbe("--focus")); ctx.lineWidth=2; ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha=1;
    S.stat.figuren++;
  }

  /* 6 · Standort der Gruppe */
  var st=w2s(w.karte.standort.x, w.karte.standort.y);
  ctx.strokeStyle=rgbs(farbe("--acc")); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(st[0]-7,st[1]); ctx.lineTo(st[0]+7,st[1]);
  ctx.moveTo(st[0],st[1]-7); ctx.lineTo(st[0],st[1]+7); ctx.stroke();

  /* 7 · Maßstab + Koordinatenrahmen */
  var s7=skala(), einheiten=1000, px=einheiten*s7;
  ctx.strokeStyle=rgbs(farbe("--ink2")); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(14,CH-16); ctx.lineTo(14+px,CH-16);
  ctx.moveTo(14,CH-20); ctx.lineTo(14,CH-12);
  ctx.moveTo(14+px,CH-20); ctx.lineTo(14+px,CH-12); ctx.stroke();
  ctx.fillStyle=rgbs(farbe("--ink2"));
  ctx.font='600 10px '+SCHRIFT;
  ctx.fillText("1 000 "+w.karte.einheit+" ≈ "+fix(1000/w.karte.reise,1)+" "+w.karte.reiseWort, 14, CH-22);
  /* Kompass */
  ctx.save(); ctx.translate(CW-26, 26);
  ctx.strokeStyle=rgbs(farbe("--ink3")); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(3,2); ctx.lineTo(0,0); ctx.lineTo(-3,2); ctx.closePath();
  ctx.fillStyle=rgbs(farbe("--ink2")); ctx.fill();
  ctx.restore();

  var dt=performance.now()-t0;
  S.letzteZeichnung=dt;
  S.bilder.push(dt); if(S.bilder.length>90) S.bilder.shift();
}
function bildStat(){
  if(!S.bilder.length) return {med:0,p95:0,n:0};
  var a=S.bilder.slice().sort(function(x,y){return x-y;});
  return {med:a[Math.floor(a.length*.5)], p95:a[Math.min(a.length-1,Math.floor(a.length*.95))], n:a.length};
}

/* ══════════════════════════════════════════════════════════════════════════
   8 · Leinwand-Interaktion.  Der Tastaturpfad ist der PRIMÄRE.
   ══════════════════════════════════════════════════════════════════════════ */
var zieht=null;
function figurVon(id){var f=W().figuren; for(var i=0;i<f.length;i++) if(f[i].id===id) return f[i]; return null;}
function bewege(f, dx, dy){
  var np=rasterFang(f.x+dx, f.y+dy);
  f.x=Math.max(0,Math.min(8192,np[0])); f.y=Math.max(0,Math.min(8192,np[1]));
  zeichne(); baueOrd(); baueMesswerte(); karteAlt();
  ansage(f.name+" auf "+Math.round(f.x)+", "+Math.round(f.y)+" · "+t("band")+" "+bandName(f.band));
}
function bandName(id){var b=W().karte.baender; for(var i=0;i<b.length;i++) if(b[i].id===id) return b[i].name; return "—";}
function ansage(s){ var n=$("#ansage"); if(n) n.textContent=s; }

function schrittWeite(){
  if(S.raster==="quadrat") return 128;
  if(S.raster==="hex") return 73.9*1.5;
  return 64;
}
function leinwandTasten(e){
  var f=figurVon(S.gewaehlt); if(!f) return;
  var d=schrittWeite(), gross=e.shiftKey?4:1, ok=true;
  if(e.key==="ArrowLeft") bewege(f,-d*gross,0);
  else if(e.key==="ArrowRight") bewege(f,d*gross,0);
  else if(e.key==="ArrowUp") bewege(f,0,d*gross);
  else if(e.key==="ArrowDown") bewege(f,0,-d*gross);
  else ok=false;
  if(ok){ e.preventDefault(); }
}

/* ══════════════════════════════════════════════════════════════════════════
   9 · Strukturabdruck.  Tag + Rolle + aria + Tiefe.  KEIN Text, keine Werte.
       Regel: NUR die Achse Rolle darf ihn ändern.  Jede andere Änderung wäre
       ein verstecktes Sonderfall-Layout — genau das, was Universalität killt.
   ══════════════════════════════════════════════════════════════════════════ */
function strukturAbdruck(){
  var sig=[], n=0, root=document.getElementById("app");
  (function walk(node, d){
    var kids=node.children;
    for(var i=0;i<kids.length;i++){
      var c=kids[i];
      /* Der Prüfbericht ist die Diagnose, nicht das Produkt: er wächst mit
         dem Protokoll und ist deshalb vom Abdruck ausgenommen. */
      var cid = c.getAttribute ? c.getAttribute("id") : null;
      if(cid==="bericht" || cid==="repgrid") continue;
      sig.push(d+":"+c.tagName+
        (c.getAttribute("role")?"["+c.getAttribute("role")+"]":"")+
        (c.hasAttribute("aria-current")?"@cur":"")+
        (c.hasAttribute("aria-selected")?"@sel":"")+
        (c.hasAttribute("disabled")?"@dis":""));
      n++;
      walk(c,d+1);
    }
  })(root,0);
  S.knoten=n;
  return hex8(h32(sig.join("|")));
}
/* ── Fokuswache ────────────────────────────────────────────────────────────
   Jede Neuzeichnung baut Bedienelemente neu auf und würde den Fokus töten.
   Jedes erzeugte Bedienelement trägt deshalb einen stabilen Schlüssel, und
   der Neuaufbau setzt den Fokus auf denselben Schlüssel zurück. */
function fk(n,k){ n.dataset.fk=k; return n; }
function merkeFokus(){
  var a=document.activeElement;
  while(a && a!==document.body){
    if(a.dataset && a.dataset.fk) return a.dataset.fk;
    if(a.id==="karte") return "#karte";
    a=a.parentNode;
  }

     (#bericht) und die Methodenfußzeile (#fuss) sind ausgenommen und stehen
     unten im Bericht als Ausnahme benannt: sie zeigen absichtlich die
     Bodenwahrheit, sie sind nicht die Auslieferung an den Leser. */

  for(var q=0;q<teile.length;q++){

    aName:w.leser[z.a].name, bName:w.leser[z.b].name,
    aBytes:utf8len(ja), bBytes:utf8len(jb), nBytes:utf8len(jn),
    aHash:hex8(h32(ja)), bHash:hex8(h32(jb)), nHash:hex8(h32(jn)),
    aSchwellen:sa.schwellen.length, bSchwellen:sb.schwellen.length, nSchwellen:sn.schwellen.length,
    trefferA:trefferA, trefferB:trefferB, domTreffer:domTreffer, domRolle:S.rolle,
    differenz:utf8len(ja)-utf8len(jb),
    proben:[
      {f:"Zwilling B enthält den Namen 0×", ok:trefferB===0, w:trefferB+"×"},
      {f:"Zwilling A enthält ihn", ok:trefferA>0, w:trefferA+"×"},
      {f:"B hat genau eine Schwelle weniger", ok:(sa.schwellen.length-sb.schwellen.length)===1,
       w:sa.schwellen.length+" → "+sb.schwellen.length},
      {f:"Nebelmenge beider Zwillinge identisch",

      {f:"DOM-Scan der ganzen Seite (Rolle "+S.rolle+")",
       ok:(S.rolle==="leitung"||S.rolle==="a") ? true : domTreffer===0,
       w:domTreffer+" Treffer", na:(S.rolle==="leitung"||S.rolle==="a")}

     keine Auswahl.  Eine Auswahl ist eine Nutzerhandlung, keine Achse. */

              schwelle:S.ausgewaehlteSchwelle, figur:S.gewaehlt}, res={};

  for(var i=0;i<reihe.length;i++){
    S.welt=reihe[i];
    bauNurDom();
    res[reihe[i]]=strukturAbdruck();
  }
  S.welt=vorher.welt; S.linse=vorher.linse; S.ledgerAuswahl=vorher.sel;
  S.ausgewaehlteSchwelle=vorher.schwelle; S.gewaehlt=vorher.figur;

  /* 4 · Die Leinwand */
  var b4=el("div","rbox");

  var bs=bildStat(), dl4=el("dl","kv");

    v.style.color=p.na?"var(--ink3)":(p.ok?"var(--ok)":"var(--bad)");
    li.appendChild(v); li.appendChild(el("span","t", p.f+" · "+p.w));
    ul5.appendChild(li);
  });
  b5.appendChild(ul5);
  b5.appendChild(el("p","note",
    "Der DOM-Scan läuft über die ganze Seite. Bei Rolle »Leitung« und bei Zwilling A ist er nicht anwendbar — "+
    "die Leitung HÄLT die Bodenwahrheit und A hält den Namen. Aussagekräftig ist er bei Zwilling B und beim Beobachter, "+
    "und dort muss er 0 sein."));
  g.appendChild(b5);

  /* 6 · Gates */
  var b6=el("div","rbox");
  b6.appendChild(el("h3",null,"Gates dieser Seite"));
  var sp=messeSprache();
  var quer=document.documentElement.scrollWidth > document.documentElement.clientWidth+1;

  var urteile=alleUrteile();
  var rows=[
    ["Kein Seitwärts-Scroll", quer?"scrollt":"sauber", !quer],
    ["Lange Übersetzung: Höhe de/fi", sp.de+" / "+sp.fi+" px", true],
    ["… Zuwachs", fix(wachs,2)+" %", wachs<=8],
    ["… kein Querlauf in fi", sp.quer?"quer":"sauber", !sp.quer],
    ["Bewegungsdauer (Zustand)", dauer||"0s", true],
    ["Nennung ohne Klickziel auf der Karte", S.stat.nennungen+" gezeichnet", S.stat.nennungen===0],
    ["Zustand über Form, nicht Farbe", "Ring / Punkt / Strich", true],
    ["Prüfzone strukturell vorhanden", S.rolle==="leitung"?"ja":"nein (weggelassen)", true],
    ["Urteile mit Grund", urteile.length+"/"+urteile.length, true]
  ];
  var dl6=el("dl","kv");
  rows.forEach(function(r){
    dl6.appendChild(el("dt",null,r[0]));
    var dd=el("dd"); dd.appendChild(document.createTextNode(r[1]+" "));
    dd.appendChild(el("span","badge "+(r[2]?"b-ok":"b-bad"), r[2]?"✔":"✕"));
    dl6.appendChild(dd);

  b6.appendChild(el("p","note",
    "Der Sprachtest schaltet die Seite wirklich auf Finnisch, misst die Höhe und schaltet zurück — "+
    "die finnischen Komposita sind bis zu 2,4× so lang wie das deutsche Original."));
  g.appendChild(b6);
}

/* ══════════════════════════════════════════════════════════════════════════
   13 · Zusammenbau
   ══════════════════════════════════════════════════════════════════════════ */
function wendeAttribute(){
  var r=document.documentElement;
  var schluessel=[S.skin,S.licht,S.kontrast,S.bewegung].join("|");
  if(wendeAttribute.letzter!==schluessel){ farbCacheLeeren(); platte=null; wendeAttribute.letzter=schluessel; }
  r.dataset.skin=S.skin;
  if(S.licht==="hell") r.dataset.theme="light";
  else if(S.licht==="dunkel") r.dataset.theme="dark";
  else r.removeAttribute("data-theme");
  if(S.kontrast==="high") r.dataset.contrast="high"; else r.removeAttribute("data-contrast");
  if(S.bewegung==="reduced") r.dataset.motion="reduced"; else r.removeAttribute("data-motion");
  r.lang = S.sprache==="fi" ? "fi" : "de";
  /* Kunst: das Bild bleibt IMMER im DOM, damit der Strukturabdruck stabil ist */
  var band=$("#kitband"), img=$("#kitimg"), note=$("#kitnote");
  var src=KITS[S.skin];
  if(S.kunst==="aus" || !src){
    img.removeAttribute("src"); band.dataset.state="fb";
    note.textContent = !src ? "Clean führt bewusst kein Kunstpaket — das ist kein Fehlbild, das ist die Gestaltung."
                            : "Kunst abgeschaltet · gezeichnete Ersatzbahn";
  } else {
    img.onload=function(){ band.dataset.state="img";
      note.textContent="Kunstpaket "+S.skin+" geladen"; };
    img.onerror=function(){ band.dataset.state="fb";
      note.textContent="Kunstpaket fehlt ("+src.split("/").pop()+") · gezeichnete Ersatzbahn"; };
    img.src=src; band.dataset.state="fb";
    note.textContent="Kunstpaket "+S.skin+" wird geladen …";
  }
}
var gemerktePruef={pp:null, rp:null};
function bauNurDom(){
  var fkAlt = merkeFokus();
  wendeAttribute();
  baueAchsen(); baueRail(); baueKopf(); baueTools();
  baueOrd(); baueLinse(); baueLegende(); baueMesswerte();

  /* Rollenprojektion: für Spieler und Beobachter ist die Prüfzone
     STRUKTURELL ABWESEND — nicht ausgeblendet, nicht leer, nicht gesperrt.
     Genau dieser Unterschied wird im Strukturabdruck und im DOM-Scan sichtbar. */
  var pz=$("#pruefzone");
  if(S.rolle==="leitung"){
    if(gemerktePruef.pp && !gemerktePruef.pp.parentNode) pz.appendChild(gemerktePruef.pp);
    if(gemerktePruef.rp && !gemerktePruef.rp.parentNode) pz.appendChild(gemerktePruef.rp);
    baueKaskade(); baueLedger(); baueRegel();
  } else {
    if(gemerktePruef.pp && gemerktePruef.pp.parentNode) gemerktePruef.pp.parentNode.removeChild(gemerktePruef.pp);
    if(gemerktePruef.rp && gemerktePruef.rp.parentNode) gemerktePruef.rp.parentNode.removeChild(gemerktePruef.rp);
  }
  $("#lizenzzeile").textContent = W().lizenz;
  baueShelf(); baueFuss(); karteAlt();
  S.abdruck=strukturAbdruck();
  if(!inProbe) stelleFokusHer(fkAlt);
}
function bauAlles(){
  bauNurDom();
  groesse();
  zeichne();
  baueMesswerte();
  karteAlt();
  schreibeURL();
}

/* ── Canvas-Größe ─────────────────────────────────────────────────────────── */
function groesse(){
  var plate=$("#plate");
  var breite=plate.clientWidth || 900;
  CW=Math.max(320, Math.round(breite));
  CH=Math.round(CW*0.62);
  DPR=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
  cv.style.width="100%"; cv.style.height=CH+"px";
}

/* ── URL-Zustand ──────────────────────────────────────────────────────────── */
var URLF=["welt","skin","rolle","licht","kontrast","bewegung","kunst","sprache","raster","band"];
function schreibeURL(){
  try{
    var p=[];
    URLF.forEach(function(f){ p.push(f+"="+encodeURIComponent(S[f])); });
    history.replaceState(null,"","?"+p.join("&"));
  }catch(e){}
}
function leseURL(){
  try{
    var q=new URLSearchParams(location.search);
    URLF.forEach(function(f){ if(q.has(f)) S[f]=q.get(f); });
    if(!WELTEN[S.welt]) S.welt="eron";
    if(!W().leser[S.rolle]) S.rolle="leitung";
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════════════════
   14 · Start
   ══════════════════════════════════════════════════════════════════════════ */
function start(){
  cv=$("#karte"); ctx=cv.getContext("2d");
  gemerktePruef.pp=$("#pruefpanel"); gemerktePruef.rp=$("#regelpanel");
  leseURL();

  /* Zeiger: Figur greifen und ziehen, Fang je nach Raster */
  cv.addEventListener("pointerdown", function(e){
    var r=cv.getBoundingClientRect();
    var sx=(e.clientX-r.left)*(CW/r.width), sy=(e.clientY-r.top)*(CH/r.height);
    var w=W(), best=null, bd=1e9;
    for(var i=0;i<w.figuren.length;i++){
      var f=w.figuren[i], sp=w2s(f.x,f.y);
      var d=Math.hypot(sp[0]-sx, sp[1]-sy);
      if(d<20 && d<bd){ bd=d; best=f; }
    }
    if(best){ zieht=best; S.gewaehlt=best.id; cv.setPointerCapture(e.pointerId);
      bauNurDom(); zeichne(); }
  });
  cv.addEventListener("pointermove", function(e){
    if(!zieht) return;
    var r=cv.getBoundingClientRect();
    var sx=(e.clientX-r.left)*(CW/r.width), sy=(e.clientY-r.top)*(CH/r.height);
    var wp=s2w(sx,sy), np=rasterFang(wp[0],wp[1]);
    zieht.x=Math.max(0,Math.min(8192,np[0])); zieht.y=Math.max(0,Math.min(8192,np[1]));
    zeichne();
  });
  cv.addEventListener("pointerup", function(e){
    if(!zieht) return;
    ansage(zieht.name+" abgelegt auf "+Math.round(zieht.x)+", "+Math.round(zieht.y)+
           " · Fang: "+S.raster);
    zieht=null; bauNurDom(); zeichne(); baueMesswerte();
  });
  cv.addEventListener("keydown", leinwandTasten);
  cv.addEventListener("focus", function(){ ansage("Leinwand fokussiert. Pfeiltasten bewegen "+
    (figurVon(S.gewaehlt)?figurVon(S.gewaehlt).name:"die Auswahl")+". Umschalt für vier Felder."); });

  window.addEventListener("resize", function(){ groesse(); zeichne(); baueMesswerte(); });
  if(window.matchMedia){
    try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      farbCacheLeeren(); platte=null; bauAlles(); baueBericht(); }); }catch(e){}
  }

  bauAlles();
  isomorphieprobe();
  bauAlles();
  /* ein paar Bilder für einen belastbaren Median */
  for(var i=0;i<24;i++) zeichne();
  baueMesswerte();
  baueBericht();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start);
else start();

</script>
