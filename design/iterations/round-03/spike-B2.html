<script>
/* ============================================================

var R = document.documentElement;
function $(id) { return document.getElementById(id); }
function el(tag, attrs, kinder) {
  var n = document.createElement(tag), k;
  if (attrs) for (k in attrs) {
    if (k === "text") n.textContent = attrs[k];
    else if (k === "klasse") n.className = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if (kinder) kinder.forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}
function svgEl(tag, attrs) {
  var n = document.createElementNS("http://www.w3.org/2000/svg", tag), k;
  if (attrs) for (k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function leeren(n) { while (n.firstChild) n.removeChild(n.firstChild); }

var zustand = {
  welt: "aldenfall", skin: "archive", rolle: "sl", theme: "system",
  kontrast: "normal", bewegung: "voll", art: "an", etiketten: "kurz",
  herkunft: "aus", grad: "alles", offenerBeleg: null, augenblick: null
};

function L(schluessel) {
  var satz = ETIKETTEN[zustand.etiketten];
  return (satz && satz[schluessel]) || ETIKETTEN.kurz[schluessel] || schluessel;
}
function welt() { return WELTEN[zustand.welt]; }

/* ============================================================
   ERSATZSIGNATUR — die entworfene Leerstelle statt eines leeren Kastens.
   Deterministisch aus dem Titel; reagiert auf die Tokens, nicht auf ein Bild.
   ============================================================ */
function signatur(titel) {
  var h = 0, i;
  for (i = 0; i < titel.length; i++) { h = (h * 31 + titel.charCodeAt(i)) >>> 0; }
  var strahlen = 7 + (h % 6);
  var s = svgEl("svg", { viewBox: "0 0 120 90", class: "ersatzsignatur", role: "img" });
  var titelKnoten = svgEl("title", {});
  titelKnoten.textContent = "Ersatzsignatur für " + titel + " — keine Bilddatei vorhanden";
  s.appendChild(titelKnoten);
  var g = svgEl("g", { fill: "none", stroke: "currentColor", "stroke-width": "1" });
  g.appendChild(svgEl("circle", { cx: 60, cy: 45, r: 26 }));
  g.appendChild(svgEl("rect", { x: 45, y: 30, width: 30, height: 30, transform: "rotate(" + (h % 45) + " 60 45)" }));
  for (i = 0; i < strahlen; i++) {
    var a = (i / strahlen) * Math.PI * 2;
    g.appendChild(svgEl("line", {
      x1: (60 + Math.cos(a) * 30).toFixed(2), y1: (45 + Math.sin(a) * 30).toFixed(2),
      x2: (60 + Math.cos(a) * 36).toFixed(2), y2: (45 + Math.sin(a) * 36).toFixed(2)
    }));
  }
  s.appendChild(g);
  var buchstaben = titel.replace(/[^A-Za-zÄÖÜäöü ]/g, " ").split(/\s+/)
    .filter(function (w) { return w.length; }).slice(0, 2)
    .map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
  var t = svgEl("text", {
    x: 60, y: 50, "text-anchor": "middle", fill: "currentColor",
    "font-size": "15", "font-family": "inherit", "letter-spacing": "1"
  });
  t.textContent = buchstaben;
  s.appendChild(t);
  return s;
}

/* ============================================================
   TEXT MIT VERWEISEN — [[Ziel]] blau, [[!Ziel]] rot (Eintrag fehlt)
   ============================================================ */
function textMitVerweisen(roh, ziel) {
  var teile = roh.split(/(\[\[[^\]]+\]\])/g);
  teile.forEach(function (teil) {
    var m = /^\[\[(!?)([^\]]+)\]\]$/.exec(teil);
    if (!m) { if (teil) ziel.appendChild(document.createTextNode(teil)); return; }
    var a = el("a", {
      klasse: "verweis" + (m[1] ? " rot" : ""),
      href: "#", text: m[2],
      title: m[1] ? "Roter Verweis — dieser Eintrag existiert noch nicht" : "Eintrag im Archiv"
    });
    a.addEventListener("click", function (e) {
      e.preventDefault();
      melde(m[1]
        ? "Roter Verweis: „" + m[2] + "“ hat noch keinen Eintrag. Er entsteht, wenn jemand ihn prägt."
        : "Verweis auf „" + m[2] + "“ — in diesem Prüfstand ist nur ein Artikel bestückt.");
    });
    ziel.appendChild(a);
  });
}

function sichtbar(absatz) {

  return true;
}

function renderArtikel() {

  var lab = el("label", { klasse: "dial-name", for: "grad-wahl", text: L("grad_name") });
  var sel = el("select", { id: "grad-wahl" });
  [["alles", L("grad_alles")], ["erfahren", L("grad_erfahren")], ["ohne", L("grad_ohne")]]
    .forEach(function (o) {
      var opt = el("option", { value: o[0], text: o[1] });
      if (zustand.grad === o[0]) opt.setAttribute("selected", "selected");
      sel.appendChild(opt);
    });
  sel.addEventListener("change", function () { zustand.grad = sel.value; renderArtikel(); renderPruefstand(); });
  dial.appendChild(lab); dial.appendChild(sel);
  dials.appendChild(dial);
  kopf.appendChild(dials);

  var sichtbare = alleAbsaetze().filter(sichtbar);
  var zaehl = { getippt: 0, gepraegt: 0, importiert: 0 };
  sichtbare.forEach(function (p) {
    if (p.art === "getippt") zaehl.getippt++;
    else if (p.art === "import") zaehl.importiert++;
    else zaehl.gepraegt++;
  });
  var bilanz = el("p", { klasse: "bilanz ziffern" });
  bilanz.appendChild(el("span", {}, [el("b", { text: String(zaehl.getippt) }), document.createTextNode(" getippt")]));
  bilanz.appendChild(el("span", {}, [el("b", { text: String(zaehl.gepraegt) }), document.createTextNode(" geprägt am Tisch")]));
  if (zaehl.importiert) bilanz.appendChild(el("span", {}, [el("b", { text: String(zaehl.importiert) }), document.createTextNode(" importiert")]));
  bilanz.appendChild(el("span", { text: "Sicht: " + L(ROLLENNAME[zustand.rolle]) }));
  kopf.appendChild(bilanz);
  wurzel.appendChild(kopf);

  /* Infobox = N feld-Passagen */
  var box = el("aside", { klasse: "infobox", "aria-label": "Kurzübersicht " + a.titel });
  box.appendChild(el("p", { klasse: "infobox-kopf", text: a.titel }));
  var dl = el("dl");
  a.infobox.forEach(function (zeile) {
    dl.appendChild(el("dt", { text: zeile[0] }));
    dl.appendChild(el("dd", { klasse: "ziffern", text: zeile[1] }));
  });
  box.appendChild(dl);
  wurzel.appendChild(box);

  a.abschnitte.forEach(function (ab) {
    var treffer = ab.absaetze.filter(sichtbar);
    if (!treffer.length) return;
    var sec = el("section", { klasse: "abschnitt" });
    sec.appendChild(el("h3", { text: ab.h }));
    treffer.forEach(function (p) { sec.appendChild(renderAbsatz(p)); });
    wurzel.appendChild(sec);
  });

  wurzel.appendChild(renderTafeln(a.tafeln));

  var fuss = el("p", { klasse: "sammlung-fuss" });
  fuss.textContent = "Rollenprojektion in diesem Prüfstand wird im Browser gerechnet. "
    + "Das beweist die UI-Zustände, nicht die Zugriffskontrolle: in der Produktion lässt die Antwort "
    + "unberechtigte Sätze weg, statt sie zu verstecken.";
  wurzel.appendChild(fuss);
}

function renderAbsatz(p) {
  var wrap = el("div", { klasse: "absatz" });
  var g = el("div", { klasse: "gutter", "aria-hidden": "true" });
  g.appendChild(el("span", { klasse: "gutter-marke" }));
  wrap.appendChild(g);

  var text = el("p");
  textMitVerweisen(p.text, text);
  if (p.beleg) {
    var fn = el("button", {
      type: "button", klasse: "fussnote",
      "aria-expanded": zustand.offenerBeleg === p ? "true" : "false",
      "aria-label": "Beleg " + p.beleg.nr + " öffnen — " + p.beleg.probe + ", " + p.beleg.wer
    });
    fn.textContent = "[" + p.beleg.nr + "]";
    fn.addEventListener("click", function () {
      zustand.offenerBeleg = (zustand.offenerBeleg === p) ? null : p;
      if (!zustand.offenerBeleg) zustand.augenblick = null;
      renderArtikel(); renderLinse(); renderPruefstand();
      var neu = document.querySelector('.fussnote[aria-expanded="true"]');
      if (neu) neu.focus();
    });
    text.appendChild(document.createTextNode(" "));
    text.appendChild(fn);
  }
  wrap.appendChild(text);

  var zeile = el("div", { klasse: "chip-zeile" });
  var chip = el("span", { klasse: "chip", "data-art": p.art });
  chip.appendChild(el("span", { klasse: "chip-glyph", "aria-hidden": "true", text: GLYPH[p.art] || "·" }));
  chip.appendChild(el("span", { klasse: "ziffern", text: p.chip }));
  zeile.appendChild(chip);
  (p.stempel || []).forEach(function (s) {
    zeile.appendChild(el("span", { klasse: "stempel", "data-art": s.art, text: s.text }));
  });
  wrap.appendChild(zeile);

  if (zustand.offenerBeleg === p) wrap.appendChild(renderBeleg(p.beleg));
  return wrap;
}

function renderTafeln(tafeln) {
  var g = el("div", { klasse: "tafeln" });
  tafeln.forEach(function (t) {
    var karte = el("figure", { klasse: "tafel" });
    var flaeche = el("div", { klasse: "tafel-flaeche" });
    if (t.quelle && zustand.art === "an") {
      var img = el("img", { src: t.quelle, alt: t.titel, loading: "lazy" });
      img.addEventListener("error", function () {
        if (img.parentNode) { img.parentNode.replaceChild(signatur(t.titel), img); }
      });
      flaeche.appendChild(img);
    } else {
      flaeche.appendChild(signatur(t.titel));
    }
    karte.appendChild(flaeche);
    var cap = el("figcaption", { klasse: "tafel-unter" });
    cap.appendChild(el("b", { text: t.titel }));
    cap.appendChild(document.createTextNode(zustand.art === "aus" ? "Artwork abgeschaltet — Ersatzsignatur" : t.unter));
    karte.appendChild(cap);
    g.appendChild(karte);
  });
  return g;
}
</script>

<script>
/* ============================================================
   DER BELEG — Fussnotenkarte mit vollstaendiger Ableitung
   ============================================================ */
function renderBeleg(b) {
  var karte = el("div", { klasse: "beleg", role: "note", "aria-label": "Beleg " + b.nr });
  var kopf = el("header", { klasse: "beleg-kopf" });
  kopf.appendChild(el("span", { klasse: "beleg-nr", text: "[" + b.nr + "]" }));
  kopf.appendChild(el("span", { klasse: "beleg-titel", text: b.probe + " · " + b.wer }));
  kopf.appendChild(el("span", { klasse: "beleg-meta ziffern", text: "Sitzung " + b.sitzung + " · " + b.zeit }));
  karte.appendChild(kopf);

  var koerper = el("div", { klasse: "beleg-koerper" });

  if (b.trace === "complete") {
    var wrap = el("div", { klasse: "ableitung" });
    var tab = el("table");
    var cap = el("caption", { klasse: "nur-sr", text: "Ableitung des Wurfs " + b.nr });
    tab.appendChild(cap);
    var tb = el("tbody");
    var z0 = el("tr", { klasse: "wurf" });
    z0.appendChild(el("td", { klasse: "t-wert", text: b.wuerfel.split("=")[1].trim() }));
    z0.appendChild(el("td", { klasse: "t-grund", text: b.wuerfel.split("=")[0].trim() }));
    tb.appendChild(z0);
    b.terme.forEach(function (t) {
      var tr = el("tr");
      tr.appendChild(el("td", { klasse: "t-wert", text: t[0] }));
      tr.appendChild(el("td", { klasse: "t-grund", text: t[1] }));
      tb.appendChild(tr);
    });
    var zs = el("tr", { klasse: "summe" });
    zs.appendChild(el("td", { klasse: "t-wert", text: "= " + b.summe }));
    zs.appendChild(el("td", { text: "gegen " + b.ziel + " · " + b.ausgang }));
    tb.appendChild(zs);
    tab.appendChild(tb);
    wrap.appendChild(tab);
    koerper.appendChild(wrap);
  } else {
    koerper.appendChild(el("p", {
      klasse: "beleg-versiegelt ziffern",
      text: "= " + b.summe + " gegen " + b.ziel + " · " + b.ausgang
        + " — Terme versiegelt (Verdeckte Probe). Eine Termliste, die nicht auf ihre eigene Summe addiert,"
        + " ist in dieser API nicht darstellbar; deshalb gibt es hier keine Terme statt falscher."
    }));
  }

  var siegel = el("p", { klasse: "beleg-siegel" });
  siegel.appendChild(el("span", { text: "Regelpaket: " + b.paket }));
  siegel.appendChild(el("span", { text: "Klausel: " + b.klausel }));
  koerper.appendChild(siegel);

  var aktionen = el("div", { klasse: "beleg-aktionen" });
  if (b.augenblick) {
    var kn = el("button", { type: "button", klasse: "knopf", text: L("augenblick") });
    kn.addEventListener("click", function () {
      zustand.augenblick = b.augenblick;
      renderLinse(); renderPruefstand();
      $("linse-titel").focus();
    });
    aktionen.appendChild(kn);
  } else {
    aktionen.appendChild(el("span", {
      klasse: "beleg-meta",
      text: "Kein Augenblick — bei dieser Probe wurde nichts geprägt, also wurde kein Brett aufgezeichnet."
    }));
  }
  var zu = el("button", { type: "button", klasse: "knopf leise", text: L("beleg_schliessen") });
  zu.addEventListener("click", function () {
    zustand.offenerBeleg = null; zustand.augenblick = null;
    renderArtikel(); renderLinse(); renderPruefstand();
  });
  aktionen.appendChild(zu);
  koerper.appendChild(aktionen);

  karte.appendChild(koerper);
  return karte;
}

/* ============================================================
   DIE LINSE — der Augenblick, pro Leserin projiziert
   ============================================================ */
function sichtbareMarken(szene) {
  return szene.marken.filter(function (m) { return m.r.indexOf(zustand.rolle) !== -1; });
}

function renderLinse() {
  var ziel = $("linse-inhalt"), titel = $("linse-titel");
  leeren(ziel);
  titel.setAttribute("tabindex", "-1");

  if (!zustand.offenerBeleg) {
    titel.textContent = L("linse_leer_titel");
    ziel.appendChild(el("p", {
      klasse: "linse-leer",
      text: "Öffne eine Fußnote im Artikel. Sie sieht aus wie eine Quellenangabe und ist ein Würfelwurf; "
        + "der Wurf trägt einen Augenblick, und der Augenblick ist das Brett, wie es in dieser Sekunde stand."
    }));
    return;
  }

  var b = zustand.offenerBeleg.beleg;
  titel.textContent = "Beleg [" + b.nr + "] · " + b.probe;

  if (!zustand.augenblick) {
    ziel.appendChild(el("p", {
      klasse: "linse-leer",
      text: b.augenblick
        ? "Die Auswahl ist hier angekommen. „" + L("augenblick") + "“ auf der Karte öffnet das Brett zum Zeitpunkt " + b.zeit + "."
        : "Zu diesem Wurf gibt es kein Brett: es wurde nichts geprägt, also wurde nichts aufgezeichnet."
    }));
    return;
  }

  var szene = welt().szenen[zustand.augenblick];
  var block = el("div", { klasse: "szene" });
  var meta = el("div", { klasse: "szene-meta" });
  [szene.name, szene.zeit, szene.runde].forEach(function (s) { meta.appendChild(el("span", { text: s })); });
  block.appendChild(meta);

  var rahmen = el("div", { klasse: "szene-rahmen" });
  rahmen.appendChild(zeichneSzene(szene));
  block.appendChild(rahmen);

  var legende = el("div", { klasse: "szene-legende" });
  sichtbareMarken(szene).forEach(function (m) {
    var z = el("p", { klasse: "legende-zeile" });
    z.appendChild(el("span", { klasse: "legende-punkt", "aria-hidden": "true" }));
    z.appendChild(el("span", { text: m.k + " — " + m.n + (m.lage ? " (" + m.lage + ")" : "") }));
    legende.appendChild(z);
  });
  block.appendChild(legende);

  var ini = el("div", { klasse: "initiative" });
  ini.appendChild(el("p", { klasse: "eyebrow" }, [el("span", { text: "Zugfolge" })]));
  var ol = el("ol");
  szene.initiative.forEach(function (i) {
    var li = el("li");
    if (i.zug) li.setAttribute("data-zug", "ja");
    li.appendChild(el("span", { klasse: "ini-wert", text: String(i.w) }));
    li.appendChild(el("span", { text: i.n }));
    li.appendChild(el("span", { klasse: "ini-wert", text: i.zug ? "am Zug" : "" }));
    ol.appendChild(li);
  });
  ini.appendChild(ol);
  block.appendChild(ini);

  var verdeckt = szene.marken.length - sichtbareMarken(szene).length;
  block.appendChild(el("p", {
    klasse: "linse-notiz",
    text: verdeckt
      ? verdeckt + " Marke(n) liegen in einer Region, die diese Leserin nicht hält. Sie fehlen hier nicht optisch — "
        + "sie stehen weder im DOM noch im Barrierebaum. Das ist die Stelle, an der dieses Produkt leckt, wenn es leckt."
      : "Alle Marken dieser Aufnahme liegen in Regionen, die diese Leserin hält."
  }));

  ziel.appendChild(block);
}

function zeichneSzene(szene) {
  var pad = 0.5;
  var s = svgEl("svg", {
    viewBox: "0 0 " + (szene.w + pad) + " " + (szene.h + pad),
    role: "img",
    "aria-label": "Brett „" + szene.name + "“ um " + szene.zeit + ", " + sichtbareMarken(szene).length + " sichtbare Marken"
  });

  var defs = svgEl("defs", {});
  var pat = svgEl("pattern", { id: "raster", width: 1, height: 1, patternUnits: "userSpaceOnUse" });
  pat.appendChild(svgEl("path", { d: "M1 0 V1 M0 1 H1", stroke: "var(--line)", "stroke-width": 0.03, fill: "none" }));
  defs.appendChild(pat);
  var nebelPat = svgEl("pattern", { id: "nebelmuster", width: 0.7, height: 0.7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
  nebelPat.appendChild(svgEl("rect", { width: 0.7, height: 0.7, fill: "var(--surface-2)" }));
  nebelPat.appendChild(svgEl("path", { d: "M0 0 V0.7", stroke: "var(--line-strong)", "stroke-width": 0.12 }));
  defs.appendChild(nebelPat);
  s.appendChild(defs);

  s.appendChild(svgEl("rect", { x: 0.5, y: 0.5, width: szene.w - 0.5, height: szene.h - 0.5, fill: "var(--paper)" }));
  s.appendChild(svgEl("rect", { x: 0.5, y: 0.5, width: szene.w - 0.5, height: szene.h - 0.5, fill: "url(#raster)" }));

  if (szene.nebel) {
    var nebelSichtbar = zustand.rolle !== "sl";
    s.appendChild(svgEl("path", {
      d: szene.nebel,
      fill: nebelSichtbar ? "url(#nebelmuster)" : "none",
      stroke: "var(--line-strong)",
      "stroke-width": 0.06,
      "stroke-dasharray": nebelSichtbar ? "none" : "0.4 0.3"
    }));
  }

  s.appendChild(svgEl("path", {
    d: szene.waende, fill: "none", stroke: "var(--ink)",
    "stroke-width": 0.16, "stroke-linecap": "square"
  }));
  (szene.tueren || []).forEach(function (t) {
    s.appendChild(svgEl("circle", { cx: t[0], cy: t[1], r: 0.28, fill: "var(--paper)", stroke: "var(--accent)", "stroke-width": 0.1 }));
  });

  sichtbareMarken(szene).forEach(function (m) {
    var g = svgEl("g", { class: "marke-token" });
    var istPc = m.t === "pc";
    if (m.t === "objekt") {
      g.appendChild(svgEl("rect", {
        x: m.x - 0.34, y: m.y - 0.34, width: 0.68, height: 0.68,
        fill: "var(--surface-2)", stroke: "var(--muted)", "stroke-width": 0.08
      }));
    } else {
      g.appendChild(svgEl("circle", {
        cx: m.x, cy: m.y, r: 0.38,
        fill: istPc ? "var(--accent)" : "var(--surface)",
        stroke: istPc ? "var(--accent)" : "var(--ink)", "stroke-width": 0.08
      }));
    }
    var t = svgEl("text", {
      x: m.x, y: m.y + 0.14, "text-anchor": "middle", "font-size": 0.38,
      "font-family": "inherit", "font-weight": 600,
      fill: istPc ? "var(--on-accent)" : "var(--ink)"
    });
    t.textContent = m.k;
    g.appendChild(t);
    var titelK = svgEl("title", {});
    titelK.textContent = m.n;
    g.appendChild(titelK);
    s.appendChild(g);
  });

  return s;
}
</script>

<script>
/* ============================================================
   MESSUNG — echte Werte aus echten Elementen, nicht aus dem Stylesheet.
   Jede Zahl hier kann rot werden; sonst waere sie kein Beweis.
   ============================================================ */
function rgbWerte(s) {
  var m = /rgba?\(([^)]+)\)/.exec(s);
  if (!m) return [0, 0, 0];
  var t = m[1].split(/[ ,\/]+/).filter(function (x) { return x.length; });
  return [parseFloat(t[0]), parseFloat(t[1]), parseFloat(t[2])];
}
function leuchtdichte(rgb) {
  var k = rgb.map(function (c) {
    c = c / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * k[0] + 0.7152 * k[1] + 0.0722 * k[2];
}
function verhaeltnis(vordergrund, hintergrund) {
  var a = leuchtdichte(rgbWerte(vordergrund)), b = leuchtdichte(rgbWerte(hintergrund));
  var hell = Math.max(a, b), dunkel = Math.min(a, b);
  return (hell + 0.05) / (dunkel + 0.05);
}
function sondiere(id) {
  var n = $(id), cs = getComputedStyle(n);
  return verhaeltnis(cs.color, cs.backgroundColor);
}
var UEBERLAUF_WAHL = ".schalter, .modul, .achse-name, .mess-name, .knopf, .beleg-titel, .eintrag-zahl";
function ueberlaeufe() {
  var treffer = [];
  Array.prototype.forEach.call(document.querySelectorAll(UEBERLAUF_WAHL), function (n) {
    if (n.scrollWidth > n.clientWidth + 1) treffer.push(n);
  });
  return treffer;
}
function seiteLaeuftUeber() { return R.scrollWidth > R.clientWidth + 1; }
function strukturVollstaendig() {
  return !!(document.querySelector("h1") && document.querySelector("main")
    && document.querySelector("nav") && document.querySelector("footer")
    && document.querySelector("#artikel h2") && document.querySelectorAll("#artikel h3").length);
}
function zahl(x, n) { return x.toFixed(n === undefined ? 2 : n).replace(".", ","); }

function messwerte() {
  var alle = alleAbsaetze(), sicht = alle.filter(sichtbar);
  var szene = welt().szenen[zustand.augenblick || "a1"];
  var markenGesamt = szene.marken.length, markenSicht = sichtbareMarken(szene).length;
  return {
    kText: sondiere("sonde-ink"),
    kLeise: sondiere("sonde-muted"),
    kAkzent: sondiere("sonde-accent"),
    kAufAkzent: sondiere("sonde-onaccent"),
    absaetze: sicht.length, absaetzeGesamt: alle.length,
    marken: markenSicht, markenGesamt: markenGesamt,
    signaturen: document.querySelectorAll(".ersatzsignatur").length,
    ueberlauf: ueberlaeufe().length,
    seite: seiteLaeuftUeber(),
    struktur: strukturVollstaendig()
  };
}

function renderPruefstand() {
  var m = messwerte(), ziel = $("messwerte");
  leeren(ziel);
  function karte(name, wert, fuss, rot) {
    var k = el("div", { klasse: "mess", "data-urteil": rot ? "rot" : "gruen" });
    k.appendChild(el("p", { klasse: "mess-name", text: name }));
    k.appendChild(el("p", { klasse: "mess-wert", text: wert }));
    k.appendChild(el("p", { klasse: "mess-fuss", text: fuss }));
    ziel.appendChild(k);
  }
  karte("Fließtext", zahl(m.kText) + " : 1", "gemessen, Ziel ≥ 4,5", m.kText < 4.5);
  karte("Nebentext", zahl(m.kLeise) + " : 1", "gemessen, Ziel ≥ 4,5", m.kLeise < 4.5);
  karte("Akzent", zahl(m.kAkzent) + " : 1", "auf Papier", m.kAkzent < 4.5);
  karte("Auf Akzent", zahl(m.kAufAkzent) + " : 1", "Schrift auf Knopffläche", m.kAufAkzent < 4.5);
  karte("Absätze", m.absaetze + " / " + m.absaetzeGesamt, L(ROLLENNAME[zustand.rolle]) + " · Rest nicht im DOM", false);
  karte("Marken", m.marken + " / " + m.markenGesamt, "im Augenblick projiziert", false);
  karte("Ersatzsignaturen", String(m.signaturen), "fehlende oder abgeschaltete Bilder", false);
  karte("Etikettenschnitt", String(m.ueberlauf), "abgeschnittene Beschriftungen", m.ueberlauf > 0);
  karte("Seitenbreite", m.seite ? "läuft über" : "in Ordnung", "kein horizontaler Körperlauf", m.seite);
  karte("Struktur", m.struktur ? "vollständig" : "unvollständig", "h1 · nav · main · h2 · h3 · footer", !m.struktur);

  var bericht = $("pruefbericht");
  var schlecht = m.kText < 4.5 || m.kLeise < 4.5 || m.ueberlauf > 0 || m.seite || !m.struktur;
  bericht.setAttribute("data-urteil", schlecht ? "rot" : "gruen");
  leeren(bericht);
  bericht.appendChild(el("b", { text: welt().label + " · " + zustand.skin + " · " + L(ROLLENNAME[zustand.rolle]) + ": " }));
  bericht.appendChild(document.createTextNode(
    schlecht
      ? "diese Kombination hält den Härtetest nicht — siehe die roten Felder."
      : "gemessen, nicht behauptet. Umschalten und wieder ablesen; der Prüflauf macht dasselbe 144-mal."
  ));
}

function melde(text) {
  var bericht = $("pruefbericht");
  bericht.setAttribute("data-urteil", "gruen");
  leeren(bericht);
  bericht.appendChild(document.createTextNode(text));
}

/* ============================================================
   DER PRÜFLAUF — 144 Kombinationen, gemessen, mit Nennung der schlechtesten
   ============================================================ */
function pruefLauf() {
  var knopf = $("pruef-start");
  var alt = {
    welt: zustand.welt, skin: zustand.skin, rolle: zustand.rolle,
    theme: zustand.theme, etiketten: zustand.etiketten
  };
  var kombis = [];
  ["aldenfall", "kepler", "nebelakte"].forEach(function (w) {
    ["relic", "signal", "archive", "clean"].forEach(function (s) {
      ["sl", "spielerin", "beobachter"].forEach(function (r) {
        ["light", "dark"].forEach(function (t) {
          ["kurz", "lang"].forEach(function (e) { kombis.push([w, s, r, t, e]); });
        });
      });
    });
  });

  var i = 0, minText = { v: 99 }, minAkzent = { v: 99 }, schnitte = 0, laeufe = 0, strukturFehler = 0;
  var start = performance.now();
  knopf.disabled = true;
  knopf.setAttribute("aria-busy", "true");
  melde("Prüflauf läuft — " + kombis.length + " Kombinationen …");

  function schritt() {
    var ende = Math.min(i + 12, kombis.length);
    for (; i < ende; i++) {
      var k = kombis[i];
      zustand.welt = k[0]; zustand.skin = k[1]; zustand.rolle = k[2];
      zustand.theme = k[3]; zustand.etiketten = k[4];
      zustand.offenerBeleg = null; zustand.augenblick = null;
      anwenden(); etikettieren();
      renderKopf(); renderSammlung(); renderArtikel(); renderLinse();
      var kt = sondiere("sonde-ink"), ka = sondiere("sonde-accent");
      var wo = WELTEN[k[0]].label + " / " + k[1] + " / " + (k[3] === "dark" ? "dunkel" : "hell");
      if (kt < minText.v) minText = { v: kt, wo: wo };
      if (ka < minAkzent.v) minAkzent = { v: ka, wo: wo };
      schnitte += ueberlaeufe().length;
      if (seiteLaeuftUeber()) laeufe++;
      if (!strukturVollstaendig()) strukturFehler++;
    }
    if (i < kombis.length) { setTimeout(schritt, 0); return; }

    var dauer = Math.round(performance.now() - start);
    zustand.welt = alt.welt; zustand.skin = alt.skin; zustand.rolle = alt.rolle;
    zustand.theme = alt.theme; zustand.etiketten = alt.etiketten;
    anwenden(); etikettieren(); renderAlles();
    knopf.disabled = false;
    knopf.removeAttribute("aria-busy");

    var rot = minText.v < 4.5 || schnitte > 0 || laeufe > 0 || strukturFehler > 0;
    var bericht = $("pruefbericht");
    bericht.setAttribute("data-urteil", rot ? "rot" : "gruen");
    leeren(bericht);
    bericht.appendChild(el("b", { text: "Prüflauf: " + kombis.length + " Kombinationen in " + dauer + " ms. " }));
    bericht.appendChild(document.createTextNode(
      "3 Inhaltspakete × 4 Skins × 3 Rollen × 2 Modi × 2 Etikettenlängen. "
      + "Kleinster Fließtext-Kontrast " + zahl(minText.v) + " : 1 (" + minText.wo + "). "
      + "Kleinster Akzent-Kontrast " + zahl(minAkzent.v) + " : 1 (" + minAkzent.wo + "). "
      + schnitte + " abgeschnittene Beschriftungen · " + laeufe + " horizontale Seitenläufe · "
      + strukturFehler + " unvollständige Dokumentstrukturen. "
      + (rot ? "Diese Runde ist rot." : "Nicht gemalt, gemessen — bei der aktuellen Fensterbreite.")
    ));
  }
  setTimeout(schritt, 20);
}

/* ============================================================
   ACHSEN
   ============================================================ */
function anwenden() {
  R.setAttribute("data-welt", zustand.welt);
  R.setAttribute("data-skin", zustand.skin);
  R.setAttribute("data-rolle", zustand.rolle);
  if (zustand.theme === "system") R.removeAttribute("data-theme");
  else R.setAttribute("data-theme", zustand.theme);
  R.setAttribute("data-kontrast", zustand.kontrast);
  R.setAttribute("data-bewegung", zustand.bewegung);
  R.setAttribute("data-art", zustand.art);
  R.setAttribute("data-etiketten", zustand.etiketten);
  R.setAttribute("data-herkunft", zustand.herkunft);
}

function etikettieren() {
  Array.prototype.forEach.call(document.querySelectorAll("[data-l]"), function (n) {
    n.textContent = L(n.getAttribute("data-l"));
    n.setAttribute("lang", LANG_ATTR[zustand.etiketten]);
  });
}

function spiegleSchalter() {
  Array.prototype.forEach.call(document.querySelectorAll(".schalter[data-achse]"), function (b) {
    var achse = b.getAttribute("data-achse"), wert = b.getAttribute("data-wert");
    var gedrueckt;
    if (achse === "kontrast") gedrueckt = zustand.kontrast === "hoch";
    else if (achse === "bewegung") gedrueckt = zustand.bewegung === "reduziert";
    else if (achse === "art") gedrueckt = zustand.art === "aus";
    else if (achse === "etiketten") gedrueckt = zustand.etiketten === "lang";
    else gedrueckt = zustand[achse] === wert;
    b.setAttribute("aria-pressed", gedrueckt ? "true" : "false");
  });
}

function setzeHerkunft(wert) {
  zustand.herkunft = wert;
  anwenden();
  renderArtikel();
  renderPruefstand();
  var s = $("herkunft-schalter");
  if (s) s.focus();
}

function renderAlles() {
  renderKopf(); renderSammlung(); renderArtikel(); renderLinse(); renderPruefstand(); spiegleSchalter();
}

document.addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest(".schalter[data-achse]") : null;
  if (b) {
    var achse = b.getAttribute("data-achse"), wert = b.getAttribute("data-wert");
    if (achse === "kontrast") zustand.kontrast = zustand.kontrast === "hoch" ? "normal" : "hoch";
    else if (achse === "bewegung") zustand.bewegung = zustand.bewegung === "reduziert" ? "voll" : "reduziert";
    else if (achse === "art") zustand.art = zustand.art === "aus" ? "an" : "aus";
    else if (achse === "etiketten") zustand.etiketten = zustand.etiketten === "lang" ? "kurz" : "lang";
    else {
      if (achse === "welt" && zustand.welt !== wert) { zustand.offenerBeleg = null; zustand.augenblick = null; }
      zustand[achse] = wert;
    }
    anwenden(); etikettieren(); renderAlles();
    return;
  }
  var m = ev.target.closest ? ev.target.closest(".modul") : null;
  if (m && m.getAttribute("aria-current") !== "page") {
    melde("Zone „" + m.textContent.trim() + "“ steht in der Schale, ist in diesem Prüfstand aber nicht bestückt. "
      + "Geprüft wird hier eine Zone unter allen Achsen, nicht sechs Zonen unter einer.");
  }
});

document.addEventListener("keydown", function (ev) {
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === "h" || ev.key === "H")) {
    ev.preventDefault();
    setzeHerkunft(zustand.herkunft === "an" ? "aus" : "an");
  }
});

$("pruef-start").addEventListener("click", pruefLauf);

var messTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(messTimer);
  messTimer = setTimeout(renderPruefstand, 200);
});

anwenden();
etikettieren();
renderAlles();
</script>
