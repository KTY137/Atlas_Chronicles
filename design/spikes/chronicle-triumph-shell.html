      };

      var refs = {
        html:document.documentElement,
        campaign:document.getElementById("campaign-name"),
        campaignLine:document.getElementById("campaign-line"),
        modules:document.getElementById("module-rail"),
        collection:document.getElementById("collection-panel"),
        stage:document.getElementById("stage-panel"),
        lens:document.getElementById("lens-panel"),
        shelf:document.getElementById("session-shelf"),
        atmosphere:document.getElementById("atmosphere-button"),
        motion:document.getElementById("motion-button"),
        contrast:document.getElementById("contrast-button"),
        focus:document.getElementById("focus-transfer"),
        focusPath:document.getElementById("focus-path"),
        focusOrb:document.getElementById("focus-orb"),
        toast:document.getElementById("toast"),
        commandButton:document.getElementById("command-button"),
        commandDialog:document.getElementById("command-dialog"),
        commandSearch:document.getElementById("command-search"),
        commandResults:document.getElementById("command-results")
      };

      function world() { return WORLDS[state.world]; }

      function visible(record) {
        if (!record) return false;
        if (state.role === "gm") return true;
        if (record.secret) return Array.isArray(record.audience) && record.audience.indexOf(state.role) !== -1;
        if (state.role === "observer" && /Nur|privat/i.test(record.visibility || "")) return false;
        return true;
      }

      function listForModule(module) {
        var data = world();
        if (module === "story") return data.story.filter(visible);
        if (module === "cast") return data.cast.filter(visible);
        if (module === "library") return data.items.filter(visible);
        if (module === "table") return data.scenes.filter(visible);
        if (module === "forge") return [
          {id:"theme",icon:"◈",name:"Theme Studio",type:"Art Manifest",meta:"4 Skins"},
          {id:"rules",icon:"⌘",name:"Rule Builder",type:"Deklarativ",meta:"17 Knoten"},
          {id:"generator",icon:"⌗",name:"Generator Lab",type:"WFC + Tabellen",meta:"3 Presets"}
        ];
        return [
          {id:"agenda",icon:"✓",name:"Session-Agenda",type:"Heute",meta:"3 offen"},
          {id:"decisions",icon:"?",name:"Offene Entscheidungen",type:"Vorbereitung",meta:"2 kritisch"},
          {id:"recent",icon:"↺",name:"Zuletzt bearbeitet",type:"Chronicle",meta:"vor 8 Min"}
        ];
      }

      function selectedRecord() {
        var list = listForModule(state.module);
        var id = state.selection[state.module];
        return list.find(function (entry) { return entry.id === id; }) || list[0];
      }

      function resetSelectionForWorld() {
        var data = world();
        state.selection.story = (data.story.filter(visible)[0] || data.story[0]).id;
        state.selection.cast = (data.cast.filter(visible)[0] || data.cast[0]).id;
        state.selection.library = (data.items.filter(visible)[0] || data.items[0]).id;
        state.selection.table = (data.scenes.filter(visible)[0] || data.scenes[0]).id;
      }

      function panelHeading(kicker, title, count) {
        return '<header class="panel-heading"><div><small>' + kicker + '</small><h2>' + title + '</h2></div><span class="panel-count">' + (count || "") + "</span></header>";
      }

      function renderAll() {
        refs.html.dataset.world = state.world;
        refs.html.dataset.skin = state.skin;
        refs.html.dataset.role = state.role;
        refs.html.dataset.atmosphere = state.atmosphere;
        refs.html.dataset.motion = state.motion;
        refs.html.dataset.contrast = state.contrast;
        refs.html.dataset.mobileDrawer = state.mobileDrawer;
        refs.campaign.textContent = world().campaign;
        refs.campaignLine.textContent = (world().universe ? world().universe + " › " : "") + world().session;

        document.querySelectorAll("[data-world]").forEach(function (button) {
          button.setAttribute("aria-pressed", button.dataset.world === state.world ? "true" : "false");
        });
        document.querySelectorAll("[data-skin]").forEach(function (button) {
          button.setAttribute("aria-pressed", button.dataset.skin === state.skin ? "true" : "false");
        });
        document.querySelectorAll("[data-role]").forEach(function (button) {
          button.setAttribute("aria-pressed", button.dataset.role === state.role ? "true" : "false");
        });
        document.querySelectorAll("[data-module]").forEach(function (button) {
          if (button.dataset.module === state.module) button.setAttribute("aria-current","page");
          else button.removeAttribute("aria-current");
          if (button.dataset.module === "forge") button.hidden = state.role !== "gm";
        });
        document.querySelectorAll("button[data-mobile-drawer]").forEach(function (button) {
          button.setAttribute("aria-pressed", button.dataset.mobileDrawer === state.mobileDrawer ? "true" : "false");
        });
        refs.atmosphere.textContent = state.atmosphere === "clean" ? "Clean" : state.atmosphere === "cinematic" ? "Cinema" : "Craft";
        refs.atmosphere.setAttribute("aria-pressed", state.atmosphere !== "crafted" ? "true" : "false");
        refs.motion.textContent = state.motion === "reduced" ? "Still" : "Motion";
        refs.motion.setAttribute("aria-pressed", state.motion === "reduced" ? "true" : "false");
        refs.contrast.textContent = state.contrast === "high" ? "High‑C" : "A11y";
        refs.contrast.setAttribute("aria-pressed", state.contrast === "high" ? "true" : "false");

        renderCollection();
        renderStage();
        renderLens();
        renderShelf();
      }

      function renderCollection() {
        var module = MODULES[state.module];
        var list = listForModule(state.module);
        refs.collection.innerHTML =
          panelHeading(stageKicker(), module.label, list.length + " Einträge") +
          '<label class="search"><input type="search" id="collection-search" placeholder="In ' + module.label + ' suchen …" autocomplete="off"></label>' +
          '<div class="collection-list">' +
            list.map(function (entry) {
              var selected = state.selection[state.module] === entry.id;
              return '<button class="collection-entry" type="button" data-select="' + entry.id + '" aria-pressed="' + selected + '">' +
                '<span class="entry-icon">' + (entry.icon || "◇") + '</span>' +
                '<span class="entry-copy"><b>' + entry.name + '</b><small>' + (entry.type || "") + '</small></span>' +
                (entry.secret ? '<span class="secret-mark" title="' + (entry.visibility || "Eingeschränkt") + '">◆</span>' : '<span class="entry-state">' + (entry.meta || "") + '</span>') +
              "</button>";
            }).join("") +
          '</div><div class="collection-foot">Lokale UI-Projektion · Produktion filtert Berechtigungen serverseitig.</div>';

        var search = document.getElementById("collection-search");
        search.addEventListener("input", function () {
          var q = search.value.toLocaleLowerCase("de");
          refs.collection.querySelectorAll(".collection-entry").forEach(function (button) {
            button.hidden = button.textContent.toLocaleLowerCase("de").indexOf(q) === -1;
          });
        });
      }

      function renderStage() {
        refs.stage.innerHTML = panelHeading(stageKicker(), stageTitle(), stageCount()) + '<div class="stage-content">' + stageMarkup() + "</div>";
      }

      function stageKicker() {
        if (state.module !== "session") return MODULES[state.module].kicker;
        if (state.role === "gm") return "GM-Arbeitslast · Heute";
        if (state.role === "player") return "Session · Spielerfokus";
        return "Session · Synchronisierte Ansicht";
      }

      function stageTitle() {
        if (state.module === "session") return state.role === "gm" ? "Heute am Tisch" : state.role === "player" ? "Deine Session" : "Live am Tisch";
        if (state.module === "story") return selectedRecord().name;
        if (state.module === "cast") return selectedRecord().name;
        if (state.module === "library") return "Sammlung";
        if (state.module === "table") return selectedRecord().name;
        return "Theme & Rule Studio";
      }

      function stageCount() {
        if (state.module === "library") return listForModule("library").length + " Objekte";
        if (state.module === "table") return state.sceneMode;
        if (state.module === "forge") return "validiert";
        return "";
      }

      function stageMarkup() {
        if (state.module === "session") return sessionMarkup();
        if (state.module === "story") return storyMarkup(selectedRecord());
        if (state.module === "cast") return castMarkup(selectedRecord());
        if (state.module === "library") return libraryMarkup();
        if (state.module === "table") return tableMarkup(selectedRecord());
        return forgeMarkup();
      }

      function sessionMarkup() {
        var sidePanels;
        if (state.role === "gm") {
          sidePanels = '<section class="dashboard-card"><h3>Session-Agenda</h3><div class="agenda-row"><i>✓</i><span>Spielerzusammenfassung freigeben</span><small>bereit</small></div><div class="agenda-row"><i>○</i><span>Offenen Hinweis platzieren</span><small>2 Min</small></div><div class="agenda-row"><i>○</i><span>Folgeszene prüfen</span><small>GM</small></div></section>' +
            '<section class="dashboard-card"><h3>Offene Entscheidungen</h3><div class="agenda-row"><i>!</i><span>Was weiß die Gruppe bereits?</span><small>kritisch</small></div><div class="agenda-row"><i>?</i><span>Abbruchpunkt der Session</span><small>offen</small></div></section>';
        } else if (state.role === "player") {
          sidePanels = '<section class="dashboard-card"><h3>Dein Fokus</h3><div class="agenda-row"><i>✓</i><span>Rückblick gelesen</span><small>bereit</small></div><div class="agenda-row"><i>○</i><span>Offene Spur verfolgen</span><small>geteilt</small></div><div class="agenda-row"><i>○</i><span>Auf Scene vorbereiten</span><small>jetzt</small></div></section>' +
            '<section class="dashboard-card"><h3>Mit der Gruppe geteilt</h3><div class="agenda-row"><i>!</i><span>Letzter öffentlicher Hinweis</span><small>neu</small></div><div class="agenda-row"><i>?</i><span>Gemeinsame offene Frage</span><small>offen</small></div></section>';
        } else {
          sidePanels = '<section class="dashboard-card"><h3>Session-Stand</h3><div class="agenda-row"><i>✓</i><span>Gruppe verbunden</span><small>4 online</small></div><div class="agenda-row"><i>○</i><span>Aktueller Abschnitt</span><small>Scene 2</small></div><div class="agenda-row"><i>○</i><span>Letzte Synchronisierung</span><small>vor 6 s</small></div></section>' +
            '<section class="dashboard-card"><h3>Öffentliche Chronik</h3><div class="agenda-row"><i>!</i><span>Geteilter Hinweis</span><small>neu</small></div><div class="agenda-row"><i>?</i><span>Gruppenfrage</span><small>offen</small></div></section>';
        }
        return '<div class="session-grid">' +
          '<section class="session-hero" style="background-image:url(&quot;' + world().sceneImage + '&quot;)"><div><span class="badge">Nächste Scene</span><h1>' + world().sceneName + '</h1><p>' + world().sceneLine + '</p></div></section>' +
          sidePanels +
        "</div>";
      }

      function storyMarkup(record) {
        return '<article class="document"><span class="doc-kicker">' + record.type + " · " + record.visibility + '</span><h1>' + record.name + '</h1><p class="lead">' + record.summary + '</p>' +
          record.body.map(function (p) { return "<p>" + p + "</p>"; }).join("") +
          '<div class="relation-strip">' + record.relations.map(function (relation, index) { return '<div class="relation"><small>' + (index === 0 ? "Person / Entity" : index === 1 ? "Ort / Scene" : "Objekt / Hinweis") + '</small><b>' + relation + "</b></div>"; }).join("") + "</div></article>";
      }

      function castMarkup(record) {
        return '<div class="cast-sheet"><section class="cast-hero"><div class="portrait">' + record.icon + '</div><div><h1>' + record.name + '</h1><p>' + record.role + ' · ' + record.visibility + '</p></div><div class="resources">' +
          record.resources.map(function (resource) { return '<div class="resource-line">' + resource[0] + '<b>' + resource[1] + '%</b><div class="resource-track"><i style="--value:' + resource[1] + '%"></i></div></div>'; }).join("") +
          '</div></section><div class="stage-toolbar"><div class="chips"><span class="chip active">Übersicht</span><span class="chip">Aktionen</span><span class="chip">Notizen</span><span class="chip">Historie</span></div><button class="generic-button" data-action="sheet-edit">Layout bearbeiten</button></div><div class="field-groups">' +
          record.groups.map(function (group) { return '<section class="field-group"><h3>' + group[0] + '</h3>' + group[1].map(function (skill) { var parts=skill.split(" "); return '<div class="skill"><span>' + parts.slice(0,-1).join(" ") + '</span><b>' + parts[parts.length-1] + "</b></div>"; }).join("") + "</section>"; }).join("") +
          "</div></div>";
      }

      function libraryMarkup() {
        var items = listForModule("library");
        return '<div class="stage-toolbar"><div class="chips"><span class="chip active">Alle</span><span class="chip">Ausrüstung</span><span class="chip">Dokumente</span><span class="chip">Hinweise</span></div><button class="generic-button" data-action="collection-view">▦ Raster</button></div><div class="card-grid">' +
          items.map(function (item,index) {
            var selected = state.selection.library === item.id;
            var art = item.art ? 'url(&quot;' + item.art + '&quot;)' : "";
            return '<button class="object-card' + (art ? " has-art" : "") + '" type="button" data-select="' + item.id + '" aria-pressed="' + selected + '" style="--delay:' + (index*35) + 'ms;' + (art ? "--art:" + art + ";--art-opacity:.66" : "") + '">' +
              '<span class="card-top"><span class="glyph">' + item.icon + '</span>' + (item.qty > 1 ? '<span class="quantity">×' + item.qty + '</span>' : "") + '</span>' + (art ? "" : '<span class="card-illustration" aria-hidden="true"><span>' + item.icon + '</span></span>') + '<h3>' + item.name + '</h3><span class="card-meta"><span>' + item.type + '</span><span>' + item.meta + "</span></span></button>";
          }).join("") + "</div>";
      }

      function tableMarkup(scene) {
        var tabs = '<div class="stage-toolbar"><div class="mode-tabs" role="group" aria-label="Scene-Darstellung"><button type="button" data-scene-mode="cinematic" aria-pressed="' + (state.sceneMode==="cinematic") + '">Cinematic</button><button type="button" data-scene-mode="tactical" aria-pressed="' + (state.sceneMode==="tactical") + '">Tactical</button><button type="button" data-scene-mode="outline" aria-pressed="' + (state.sceneMode==="outline") + '">Outline</button></div><button class="generic-button" data-action="scene-focus">Fokusmodus</button></div>';
        if (state.sceneMode === "outline") {
          return '<div class="table-workspace">' + tabs + '<div class="outline-view"><div class="outline-group"><h3>Party · 3</h3><div class="outline-row"><b>' + world().actor.name + '</b><span>Zone Mitte</span><span>bereit</span></div><div class="outline-row"><b>Verbündete Figur</b><span>Zone Eingang</span><span>verdeckt</span></div><div class="outline-row"><b>Beobachter</b><span>Zone Ost</span><span>wartet</span></div></div><div class="outline-group"><h3>Objekte & Hinweise · 4</h3><div class="outline-row"><b>Interaktiver Zugang</b><span>12 m</span><span>geschlossen</span></div><div class="outline-row"><b>Hinweis</b><span>8 m</span><span>unentdeckt</span></div></div></div></div>';
        }
        var tactical = state.sceneMode === "tactical";
        return '<div class="table-workspace">' + tabs + '<div class="scene-stage"><img class="scene-art" src="' + world().sceneImage + '" alt=""><div class="' + (tactical ? "tactical-grid" : "") + '"></div>' +
          (tactical ? '<span class="token" style="--x:42%;--y:61%">' + world().actor.initials + '</span><span class="token" style="--x:57%;--y:48%;--token-color:var(--accent)">A2</span><span class="token" style="--x:69%;--y:57%;--token-color:var(--danger)">?</span>' : "") +
          '<div class="scene-title"><small>' + (tactical ? "Tactical View · dieselbe Scene" : "Cinematic View · Ambience") + '</small><h1>' + scene.name + '</h1><p>' + scene.description + "</p></div></div></div>";
      }

      function forgeMarkup() {
        return '<div class="forge-grid"><div class="theme-preview"><div class="mini-shell"><span></span><span></span><span></span></div></div><div class="forge-controls"><div class="control-row"><label><span>Ornament-Dichte</span><b>' + state.atmosphere + '</b></label><input type="range" min="0" max="2" value="' + (state.atmosphere==="clean"?0:state.atmosphere==="cinematic"?2:1) + '"></div><div class="control-row"><label><span>Leseflächen-Kontrast</span><b>AA+</b></label><input type="range" min="0" max="100" value="84"></div><div class="control-row"><label><span>Motion Profil</span><b>' + state.motion + '</b></label><input type="range" min="0" max="100" value="' + (state.motion==="reduced"?0:72) + '"></div><button class="primary-button" data-action="validate-theme">Theme validieren</button><button class="generic-button" data-action="open-rules">Rule Graph öffnen</button></div></div>';
      }

      function renderLens() {
        var record = selectedRecord();
        refs.lens.innerHTML = panelHeading("Context Lens · " + (state.role==="gm"?"Director":"Role View"), "Details", record && record.visibility ? record.visibility : state.role.toUpperCase()) +
          '<div class="lens-content">' + lensMarkup(record) + '</div><div class="lens-actions">' + lensActions(record) + "</div>";
      }

      function lensMarkup(record) {
        if (state.trace) return traceMarkup();
        if (state.module === "library") {
          var art = record.art ? '<img src="' + record.art + '" alt="Illustration: ' + record.name + '">' : '<span class="fallback-glyph">' + record.icon + '</span>';
          return '<div class="detail-hero">' + art + '</div><div class="lens-kicker">' + record.type + '</div><h3>' + record.name + '</h3><p class="lens-description">' + record.description + '</p><div class="field-list">' + record.fields.map(fieldRow).join("") + "</div>";
        }
        if (state.module === "story") {
          return '<div class="lens-kicker">Verknüpfte Erinnerung</div><h3>' + record.name + '</h3><p class="lens-description">' + record.summary + '</p><div class="field-list">' + [["Sichtbarkeit",record.visibility],["Relationen",record.relations.length],["Backlinks","4"],["Letzte Änderung","vor 8 Min"]].map(fieldRow).join("") + '</div><div class="trace-box"><h4>Backlinks</h4>' + record.relations.map(function (r) { return '<div class="trace-step"><i>↗</i><span>' + r + "</span></div>"; }).join("") + "</div>";
        }
        if (state.module === "cast") {
          return '<div class="detail-hero"><span class="fallback-glyph">' + record.icon + '</span></div><div class="lens-kicker">' + record.type + '</div><h3>' + record.name + '</h3><p class="lens-description">' + record.role + '</p><div class="field-list">' + [["Sichtbarkeit",record.visibility],["Ressourcen",record.resources.length],["Feldgruppen",record.groups.length],["Instanz","actor."+record.id]].map(fieldRow).join("") + "</div>";
        }
        if (state.module === "table") {
          var sceneFields = record.fields.map(function (field) {
            return field[0] === "Modus" ? ["Modus", state.sceneMode.charAt(0).toUpperCase() + state.sceneMode.slice(1)] : field;
          });
          return '<div class="lens-kicker">Scene · ' + state.sceneMode + '</div><h3>' + record.name + '</h3><p class="lens-description">' + record.description + '</p><div class="field-list">' + sceneFields.map(fieldRow).join("") + '</div>' +
            (state.role==="gm" ? '<div class="trace-box"><h4>Director Layer</h4><div class="trace-step"><i>◆</i><span>Verborgene Entities sichtbar</span></div><div class="trace-step"><i>◆</i><span>Fog & Trigger editierbar</span></div><div class="trace-step"><i>◆</i><span>View as Player verfügbar</span></div></div>' : "");
        }
        if (state.module === "forge") {
          return '<div class="lens-kicker">Theme Manifest</div><h3>Unabhängige Art-Schicht</h3><p class="lens-description">Skin, Inhalt, Rolle und Dichte sind getrennte Datenachsen.</p><div class="field-list">' + [["Kontrast","AA bestanden"],["Safe Insets","definiert"],["Slice-Metriken","3 Rollen"],["Lizenzstatus","Prototype only"]].map(fieldRow).join("") + '</div><div class="trace-box"><h4>Package Gates</h4><div class="trace-step"><i>✓</i><span>Keine eingebrannten Texte</span></div><div class="trace-step"><i>✓</i><span>Reduced Motion Fallback</span></div><div class="trace-step"><i>✓</i><span>Clean Surface vorhanden</span></div></div>';
        }
        return '<div class="lens-kicker">Session Readiness</div><h3>' + world().sceneName + '</h3><p class="lens-description">' + world().sceneLine + '</p><div class="field-list">' + [["Spieler online","4 / 4"],["Agenda","3 Punkte"],["Offene Entscheidungen","2"],["Backups","aktuell"]].map(fieldRow).join("") + "</div>";
      }

      function fieldRow(field) {
        return '<div class="field"><span>' + field[0] + '</span><b>' + field[1] + "</b></div>";
      }

      function traceMarkup() {
        return '<div class="lens-kicker">Transparente Aktion · Vorschau</div><h3>' + state.trace.title + '</h3><p class="lens-description">Noch nicht committed. Chronicle zeigt Wirkung und Berechtigung vor der Änderung.</p><div class="trace-box"><h4>Berechnung & Audit</h4>' +
          state.trace.steps.map(function (step) { return '<div class="trace-step"><i>✓</i><span>' + step + "</span></div>"; }).join("") +
          '</div><div class="field-list" style="margin-top:10px">' + [["Ergebnis",state.trace.result],["Undo","verfügbar"],["Sichtbarkeit",state.role==="gm"?"Audit + Spielerlog":"Eigenes Log"]].map(fieldRow).join("") + "</div>";
      }

      function lensActions(record) {
        if (state.role === "observer") return '<button class="generic-button" type="button" disabled>Nur Ansicht</button><button class="generic-button" type="button" aria-label="Mehr">•••</button>';
        if (state.trace) return '<button class="primary-button" type="button" data-action="commit-trace">Änderung bestätigen</button><button class="generic-button" type="button" data-action="cancel-trace">×</button>';
        var label = state.module==="library" ? record.action : state.module==="story" ? (state.role==="gm"?"Für Spieler enthüllen":"Notiz hinzufügen") : state.module==="cast" ? "Aktion ausführen" : state.module==="table" ? (state.role==="gm"?"Scene starten":"Bereit") : state.module==="forge" ? "Validieren" : "Session vorbereiten";
        return '<button class="primary-button" type="button" data-action="primary">' + label + '</button><button class="generic-button" type="button" data-action="more">•••</button>';
      }

      function renderShelf() {
        var actions;
        if (state.role === "observer") actions = ["Übersicht","Scene ansehen","Handout"];
        else if (state.module === "table") actions = ["Initiative","Probe","Ping","Zug beenden"];
        else if (state.module === "story") actions = ["Enthüllen","Verknüpfen","Handout","Notiz"];
        else if (state.module === "cast") actions = ["Probe","Zustand","Ressource","Aktion"];
        else if (state.module === "library") actions = ["Ausrüsten","Übergeben","Teilen","Vergleichen"];
        else if (state.module === "forge") actions = ["Preview","Validieren","Testlauf","Export"];
        else if (state.role === "player") actions = ["Bereit","Probe","Notiz","Handout"];
        else actions = ["Agenda","Scene öffnen","Einladen","Starten"];

        refs.shelf.innerHTML =
          (state.role === "observer" ? '<div class="actor-glance"><div class="portrait">◎</div><div class="actor-copy"><b>Live-Tisch</b><span>4 Personen · synchronisiert</span><div class="micro-track"><i></i></div></div></div>' : '<div class="actor-glance"><div class="portrait">' + world().actor.initials + '</div><div class="actor-copy"><b>' + world().actor.name + '</b><span>' + world().actor.resource + '</span><div class="micro-track"><i></i></div></div></div>') +
          '<div class="shelf-actions">' + actions.map(function (action,index) { return '<button class="shelf-action ' + (index===0?"primary":"") + '" type="button" data-shelf-action="' + action + '">' + action + "</button>"; }).join("") + '</div>' +
          '<div class="shelf-history"><div class="history-copy"><b>' + (state.trace ? state.trace.title : state.lastCommitted ? state.lastCommitted.title : "Alles gespeichert") + '</b><span>' + (state.trace ? "Vorschau · nicht committed" : state.lastCommitted ? "Committed · Undo verfügbar" : world().system + " · vor 6 s") + '</span></div>' +
          (state.trace ? '<button class="generic-button" type="button" data-action="cancel-trace">Verwerfen</button>' : state.lastCommitted ? '<button class="generic-button" type="button" data-action="undo-last">Undo</button>' : "") + "</div>";
      }

      function showTrace(title) {
        var record = selectedRecord();
        state.trace = {
          title:title + (record && record.name ? " · " + record.name : ""),
          steps:[
            "Rolle " + state.role + " besitzt die erforderliche Berechtigung",
            "Deklarative Action wurde gegen Schema und aktuellen Zustand geprüft",
            "Auswirkungen auf Ressourcen, Relationen und Sichtbarkeit berechnet",
            "Audit-Eintrag und reversible Operation vorbereitet"
          ],
          result:"gültig · bereit zum Commit"
        };
        renderLens();
        renderShelf();
        pulseFocus(null);
      }

      var toastTimer;
      function toast(message) {
        clearTimeout(toastTimer);
        refs.toast.textContent = message;
        refs.toast.classList.add("show");
        toastTimer = setTimeout(function () { refs.toast.classList.remove("show"); }, 1900);
      }

      function pulseFocus(source) {
        if (state.motion === "reduced" || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
        var from = source ? source.getBoundingClientRect() : refs.stage.getBoundingClientRect();
        var to = refs.lens.getBoundingClientRect();
        var x1 = source ? from.right : from.left + from.width*.78;
        var y1 = from.top + from.height*.5;
        var x2 = to.left + 30;
        var y2 = to.top + Math.min(230,to.height*.35);
        refs.focusPath.setAttribute("d","M "+x1+" "+y1+" C "+(x1+80)+" "+y1+", "+(x2-80)+" "+y2+", "+x2+" "+y2);
        refs.focusOrb.setAttribute("cx",x2);
        refs.focusOrb.setAttribute("cy",y2);
        refs.focus.classList.remove("play");
        void refs.focus.offsetWidth;
        refs.focus.classList.add("play");
      }

      document.addEventListener("click", function (event) {
        var drawerButton = event.target.closest("button[data-mobile-drawer]");
        if (drawerButton) {
          state.mobileDrawer = state.mobileDrawer === drawerButton.dataset.mobileDrawer ? "none" : drawerButton.dataset.mobileDrawer;
          refs.html.dataset.mobileDrawer = state.mobileDrawer;
          document.querySelectorAll("button[data-mobile-drawer]").forEach(function (button) {
            button.setAttribute("aria-pressed", button.dataset.mobileDrawer === state.mobileDrawer ? "true" : "false");
          });
          return;
        }
        var worldButton = event.target.closest("[data-world]");
        if (worldButton) {
          state.world = worldButton.dataset.world;
          resetSelectionForWorld();
          state.trace = null;
          state.lastCommitted = null;
          renderAll();
          toast("Inhaltspaket gewechselt · Skin und Layout unverändert");
          return;
        }
        var skinButton = event.target.closest("[data-skin]");
        if (skinButton) {
          state.skin = skinButton.dataset.skin;
          renderAll();
          toast("Art-Skin gewechselt · Inhalt und Rolle unverändert");
          return;
        }
        var roleButton = event.target.closest("[data-role]");
        if (roleButton) {
          state.role = roleButton.dataset.role;
          if (state.role !== "gm" && state.module === "forge") state.module = "session";
          state.mobileDrawer = "none";
          resetSelectionForWorld();
          state.trace = null;
          state.lastCommitted = null;
          renderAll();
          toast("Rolle gewechselt · lokale UI-Projektion neu gefiltert");
          return;
        }
        var moduleButton = event.target.closest("[data-module]");
        if (moduleButton) {
          state.module = moduleButton.dataset.module;
          state.trace = null;
          state.mobileDrawer = "none";
          renderAll();
          return;
        }
        var select = event.target.closest("[data-select]");
        if (select) {
          state.selection[state.module] = select.dataset.select;
          state.trace = null;
          renderCollection();
          renderStage();
          renderLens();
          renderShelf();
          if (matchMedia("(max-width:760px)").matches) {
            state.mobileDrawer = "lens";
            refs.html.dataset.mobileDrawer = state.mobileDrawer;
            document.querySelectorAll("button[data-mobile-drawer]").forEach(function (button) {
              button.setAttribute("aria-pressed", button.dataset.mobileDrawer === state.mobileDrawer ? "true" : "false");
            });
          } else pulseFocus(select);
          return;
        }
        var mode = event.target.closest("[data-scene-mode]");
        if (mode) {
          state.sceneMode = mode.dataset.sceneMode;
          state.trace = null;
          renderStage();
          renderLens();
          renderShelf();
          return;
        }
        var shelfAction = event.target.closest("[data-shelf-action]");
        if (shelfAction) {
          if (state.role === "observer") {
            toast(shelfAction.dataset.shelfAction + " · schreibgeschützte Ansicht");
            return;
          }
          showTrace(shelfAction.dataset.shelfAction);
          return;
        }
        var action = event.target.closest("[data-action]");
        if (action) {
          if (action.dataset.action === "cancel-trace") {
            state.trace = null;
            renderLens();
            renderShelf();
            toast("Vorschau verworfen · Zustand unverändert");
          } else if (action.dataset.action === "commit-trace") {
            var title = state.trace ? state.trace.title : "Aktion";
            state.lastCommitted = { title:title };
            state.trace = null;
            renderLens();
            renderShelf();
            toast(title + " · committed · Undo verfügbar");
          } else if (action.dataset.action === "undo-last") {
            var undone = state.lastCommitted ? state.lastCommitted.title : "Letzte Aktion";
            state.lastCommitted = null;
            renderShelf();
            toast(undone + " · rückgängig gemacht");
          } else if (action.dataset.action === "more") {
            toast("Historie · Berechtigungen · Verknüpfen · Export");
          } else {
            showTrace(action.textContent.trim() || "Aktion");
          }
        }
      });

      refs.atmosphere.addEventListener("click", function () {
        state.atmosphere = state.atmosphere === "clean" ? "crafted" : state.atmosphere === "crafted" ? "cinematic" : "clean";
        renderAll();
      });
      refs.motion.addEventListener("click", function () {
        state.motion = state.motion === "full" ? "reduced" : "full";
        renderAll();
      });
      refs.contrast.addEventListener("click", function () {
        state.contrast = state.contrast === "standard" ? "high" : "standard";
        renderAll();
      });

      function commandResults(query) {
        var q = (query || "").toLocaleLowerCase("de");
        var commands = Object.keys(MODULES).filter(function (key) { return key !== "forge" || state.role === "gm"; }).map(function (key) {
          return {module:key,label:"Öffne " + MODULES[key].label,detail:MODULES[key].kicker};
        });
        return commands.filter(function (command) { return (command.label+" "+command.detail).toLocaleLowerCase("de").indexOf(q) !== -1; });
      }

      function renderCommands(query) {
        refs.commandResults.innerHTML = commandResults(query).map(function (command) {
          return '<button class="command-result" type="button" data-command-module="' + command.module + '"><b>' + command.label + '</b><br><small>' + command.detail + "</small></button>";
        }).join("");
      }

      refs.commandButton.addEventListener("click", function () {
        renderCommands("");
        refs.commandDialog.showModal();
        setTimeout(function () { refs.commandSearch.focus(); }, 30);
      });
      refs.commandSearch.addEventListener("input", function () { renderCommands(refs.commandSearch.value); });
      refs.commandDialog.addEventListener("click", function (event) {
        var command = event.target.closest("[data-command-module]");
        if (command) {
          state.module = command.dataset.commandModule;
          refs.commandDialog.close();
          renderAll();
        } else if (event.target === refs.commandDialog) refs.commandDialog.close();
      });

      window.addEventListener("keydown", function (event) {
        if (event.key === "/" && !event.target.matches("input")) {
          event.preventDefault();
          refs.commandButton.click();
        }
        if (event.key === "Escape" && refs.commandDialog.open) refs.commandDialog.close();
        else if (event.key === "Escape" && state.mobileDrawer !== "none") {
          state.mobileDrawer = "none";
          refs.html.dataset.mobileDrawer = "none";
          document.querySelectorAll("button[data-mobile-drawer]").forEach(function (button) {
            button.setAttribute("aria-pressed","false");
          });
        }
      });

      document.addEventListener("pointermove", function (event) {
        var x = event.clientX / innerWidth;
        var y = event.clientY / innerHeight;
        document.body.style.setProperty("--mx",x*100+"%");
        document.body.style.setProperty("--my",y*100+"%");
        document.querySelectorAll(".art-panel").forEach(function (panel) {
          var rect=panel.getBoundingClientRect();
          panel.style.setProperty("--shine-x",Math.max(0,Math.min(100,(event.clientX-rect.left)/rect.width*100))+"%");
          panel.style.setProperty("--shine-y",Math.max(0,Math.min(100,(event.clientY-rect.top)/rect.height*100))+"%");
        });
      },{passive:true});

      function ambient() {
        var canvas=document.getElementById("ambient"),ctx=canvas.getContext("2d"),particles=[];
        function resize() {
          var ratio=devicePixelRatio||1;
          canvas.width=innerWidth*ratio; canvas.height=innerHeight*ratio;
          canvas.style.width=innerWidth+"px"; canvas.style.height=innerHeight+"px";
          ctx.setTransform(ratio,0,0,ratio,0,0);
          particles=Array.from({length:15},function(){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.35+Math.random()*.8,v:-.05-Math.random()*.1,a:.07+Math.random()*.13};});
        }
        function frame() {
          ctx.clearRect(0,0,innerWidth,innerHeight);
          if (state.motion!=="reduced" && state.atmosphere!=="clean") {
            var color=getComputedStyle(document.documentElement).getPropertyValue("--accent-rgb").trim();
            particles.forEach(function(p){p.y+=p.v;if(p.y<0){p.y=innerHeight;p.x=Math.random()*innerWidth;}ctx.fillStyle="rgba("+color+","+p.a+")";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
          }
          requestAnimationFrame(frame);
        }
        addEventListener("resize",resize);resize();frame();
      }

      var query = new URLSearchParams(location.search);
      if (WORLDS[query.get("world")]) state.world=query.get("world");
      if (["relic","signal","archive","clean"].indexOf(query.get("skin"))!==-1) state.skin=query.get("skin");
      if (["gm","player","observer"].indexOf(query.get("role"))!==-1) state.role=query.get("role");
      if (MODULES[query.get("module")]) state.module=query.get("module");
      if (["clean","crafted","cinematic"].indexOf(query.get("atmosphere"))!==-1) state.atmosphere=query.get("atmosphere");
      if (["full","reduced"].indexOf(query.get("motion"))!==-1) state.motion=query.get("motion");
      if (["standard","high"].indexOf(query.get("contrast"))!==-1) state.contrast=query.get("contrast");
      if (["cinematic","tactical","outline"].indexOf(query.get("scene"))!==-1) state.sceneMode=query.get("scene");
      if (["none","collection","lens"].indexOf(query.get("drawer"))!==-1) state.mobileDrawer=query.get("drawer");
      if (state.role !== "gm" && state.module === "forge") state.module = "session";
      if (state.role === "observer") state.mobileDrawer = "none";
      resetSelectionForWorld();
      renderAll();
      if (query.get("trace") === "1" && state.role !== "observer") showTrace("Vorschau");
      ambient();
    }());
  </script>
</body>
</html>
