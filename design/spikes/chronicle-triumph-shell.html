<!doctype html>
<html lang="de" data-world="aldenfall" data-skin="relic" data-role="gm" data-atmosphere="crafted" data-motion="full" data-contrast="standard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronicle — Triumph Shell · Living Campaign Instrument</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050909;
      --bg-rgb: 5, 9, 9;
      --surface: #0d1413;
      --surface-rgb: 13, 20, 19;
      --surface-2: #121d1b;
      --text: #eee8da;
      --muted: #a0aeaa;
      --dim: #6f7e7a;
      --accent: #e2b85d;
      --accent-rgb: 226, 184, 93;
      --secondary: #58cba1;
      --secondary-rgb: 88, 203, 161;
      --danger: #d26972;
      --danger-rgb: 210, 105, 114;
      --frame-filter: none;
      --frame-opacity: .94;
      --ornament: 1;
      --panel-frame: url("assets/universal-ui/chronicle-panel-frame.png");
      --rail-frame: url("assets/universal-ui/chronicle-loadout-panel-v2.png");
      --stage-frame: url("assets/universal-ui/chronicle-collection-panel-v2.png");
      --lens-frame: url("assets/universal-ui/chronicle-detail-panel-v2.png");
      --card-frame: url("assets/universal-ui/chronicle-card-frame.png");
      --display-font: Georgia, serif;
      --ease: cubic-bezier(.2, .78, .22, 1);
      --mx: 50%;
      --my: 32%;
    }

    html[data-skin="signal"] {
      --bg: #040813;
      --bg-rgb: 4, 8, 19;
      --surface: #08131d;
      --surface-rgb: 8, 19, 29;
      --surface-2: #0b1e2b;
      --text: #e8f4f6;
      --muted: #9db2bb;
      --dim: #647b85;
      --accent: #6de0f4;
      --accent-rgb: 109, 224, 244;
      --secondary: #aa82ef;
      --secondary-rgb: 170, 130, 239;
      --panel-frame: url("assets/universal-ui/signal-frame-kit-v1.png");
      --rail-frame: url("assets/universal-ui/signal-frame-kit-v1.png");
      --stage-frame: url("assets/universal-ui/signal-frame-kit-v1.png");
      --lens-frame: url("assets/universal-ui/signal-frame-kit-v1.png");
      --card-frame: url("assets/universal-ui/signal-frame-kit-v1.png");
      --display-font: "Bahnschrift SemiCondensed", "Arial Narrow", "Segoe UI", sans-serif;
      --frame-filter: none;
      --frame-opacity: .9;
    }

    html[data-skin="archive"] {
      --bg: #0d0908;
      --bg-rgb: 13, 9, 8;
      --surface: #181312;
      --surface-rgb: 24, 19, 18;
      --surface-2: #211918;
      --text: #f0e7da;
      --muted: #b5a69e;
      --dim: #816f68;
      --accent: #df9475;
      --accent-rgb: 223, 148, 117;
      --secondary: #9db9c5;
      --secondary-rgb: 157, 185, 197;
      --panel-frame: url("assets/universal-ui/archive-frame-kit-v1.png");
      --rail-frame: url("assets/universal-ui/archive-frame-kit-v1.png");
      --stage-frame: url("assets/universal-ui/archive-frame-kit-v1.png");
      --lens-frame: url("assets/universal-ui/archive-frame-kit-v1.png");
      --card-frame: url("assets/universal-ui/archive-frame-kit-v1.png");
      --display-font: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --frame-filter: none;
      --frame-opacity: .91;
    }

    html[data-skin="clean"] {
      --bg: #07100f;
      --bg-rgb: 7, 16, 15;
      --surface: #10201d;
      --surface-rgb: 16, 32, 29;
      --surface-2: #152923;
      --text: #f2f5f2;
      --muted: #b7c5c0;
      --dim: #7f918b;
      --accent: #63d6a5;
      --accent-rgb: 99, 214, 165;
      --secondary: #7bcfe1;
      --secondary-rgb: 123, 207, 225;
      --frame-filter: grayscale(1) contrast(.82) brightness(.75);
      --frame-opacity: .15;
      --ornament: 0;
    }

    html[data-contrast="high"] {
      --text: #fff;
      --muted: #eef4f1;
      --dim: #c8d4d0;
      --accent: #ffe37f;
      --accent-rgb: 255, 227, 127;
      --secondary: #79ffd0;
      --secondary-rgb: 121, 255, 208;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background:
        radial-gradient(circle at var(--mx) var(--my), rgba(var(--accent-rgb), .09), transparent 29%),
        radial-gradient(circle at 78% 12%, rgba(var(--secondary-rgb), .06), transparent 24%),
        linear-gradient(145deg, var(--bg), #020404 76%);
      color: var(--text);
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      transition: background .45s ease, color .3s ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      z-index: -2;
      inset: -15%;
      background:
        conic-gradient(from 210deg at 47% 44%,
          transparent 0 18%,
          rgba(var(--accent-rgb), .035) 28%,
          transparent 39% 64%,
          rgba(var(--secondary-rgb), .028) 73%,
          transparent 83%);
      filter: blur(28px);
      animation: ambient-drift 28s ease-in-out infinite alternate;
    }

    body::after {
      z-index: 200;
      opacity: calc(.07 * var(--ornament));
      mix-blend-mode: soft-light;
      background-image: repeating-radial-gradient(circle at 33% 72%, transparent 0 2px, rgba(255,255,255,.15) 2.5px 3px);
      background-size: 12px 14px;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    #ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: calc(.42 * var(--ornament));
    }

    #app {
      width: min(1760px, 100%);
      height: 100vh;
      margin: 0 auto;
      padding: 12px 16px;
      display: grid;
      grid-template-rows: 68px minmax(0, 1fr) 76px;
      gap: 9px;
      position: relative;
    }

    .command-bar {
      min-width: 0;
      display: grid;
      grid-template-columns: 238px minmax(160px, 1fr) auto auto;
      align-items: center;
      gap: 15px;
      padding: 0 4px 5px;
      border-bottom: 1px solid rgba(var(--accent-rgb), .18);
      position: relative;
    }

    .command-bar::after {
      content: "";
      position: absolute;
      left: 4px;
      bottom: -1px;
      width: 24%;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      box-shadow: 0 0 12px rgba(var(--accent-rgb), .35);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand strong {
      color: #f5e8c8;
      font: 600 20px var(--display-font);
      letter-spacing: .14em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(var(--accent-rgb), .16);
    }

    .brand small {
      color: var(--dim);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .campaign-context {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .campaign-copy {
      min-width: 0;
    }

    .campaign-copy b {
      display: block;
      overflow: hidden;
      color: var(--text);
      font: 600 14px var(--display-font);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .campaign-copy span {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--dim);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-button {
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      border: 1px solid rgba(var(--accent-rgb), .18);
      background: rgba(0,0,0,.2);
      color: var(--accent);
      cursor: pointer;
      clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    }

    .axis-lab {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .axis {
      display: flex;
      align-items: center;
      padding: 3px;
      border: 1px solid rgba(var(--accent-rgb), .12);
      background: rgba(0,0,0,.2);
    }

    .axis > span {
      padding: 0 6px;
      color: var(--dim);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .axis button,
    .utility-button {
      min-width: 28px;
      height: 26px;
      padding: 0 7px;
      border: 0;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 10px;
      transition: color .18s, background .18s, box-shadow .18s;
    }

    .axis button:hover,
    .utility-button:hover { color: var(--text); }

    .axis button[aria-pressed="true"],
    .utility-button[aria-pressed="true"] {
      color: var(--accent);
      background: rgba(var(--accent-rgb), .09);
      box-shadow: inset 0 -1px var(--accent);
    }

    .utility-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .mobile-drawer-control { display:none; }

    .utility-button {
      min-width: 35px;
      border: 1px solid rgba(var(--accent-rgb), .12);
      background: rgba(0,0,0,.18);
      clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
    }

    .presence {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: 4px;
      color: var(--muted);
      font-size: 9px;
    }

    .presence i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--secondary);
      box-shadow: 0 0 9px rgba(var(--secondary-rgb), .75);
    }

    .shell {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 68px 246px minmax(510px, 1fr) 326px;
      gap: 9px;
    }

    .module-rail {
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
      padding: 8px 5px;
      border: 1px solid rgba(var(--accent-rgb), .13);
      background:
        linear-gradient(180deg, rgba(var(--accent-rgb), .045), transparent 22%),
        rgba(3,8,8,.66);
      box-shadow: inset 0 0 26px rgba(0,0,0,.35), 0 17px 40px rgba(0,0,0,.24);
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }

    .module-button {
      min-height: 55px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      padding: 6px 2px;
      border: 0;
      border-left: 1px solid transparent;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      position: relative;
      transition: color .2s, background .2s, transform .2s;
    }

    .module-button:hover {
      color: var(--text);
      background: rgba(var(--accent-rgb), .045);
    }

    .module-button[aria-current="page"] {
      color: var(--accent);
      border-left-color: var(--accent);
      background: linear-gradient(90deg, rgba(var(--accent-rgb), .12), transparent);
      text-shadow: 0 0 11px rgba(var(--accent-rgb), .35);
    }

    .module-button[aria-current="page"]::after {
      content: "";
      position: absolute;
      right: 2px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .module-icon {
      font: 600 18px var(--display-font);
      line-height: 1;
    }

    .module-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .module-spacer { flex: 1; }

    .art-panel {
      --role-art: var(--panel-frame);
      --slice: 108;
      --panel-delay: 0ms;
      min-width: 0;
      min-height: 0;
      position: relative;
      padding: 28px;
      isolation: isolate;
      opacity: 0;
      transform: translateY(12px) scale(.988);
      animation: panel-enter .46s calc(60ms + var(--panel-delay)) var(--ease) forwards;
    }

    .art-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border: 30px solid transparent;
      border-image-source: var(--role-art);
      border-image-slice: var(--slice) fill;
      border-image-width: 30px;
      border-image-repeat: stretch;
      filter: var(--frame-filter);
      opacity: var(--frame-opacity);
      pointer-events: none;
      transition: filter .38s ease, opacity .35s ease;
    }

    .art-panel::after {
      content: "";
      position: absolute;
      inset: 8px;
      z-index: 2;
      pointer-events: none;
      opacity: calc(.25 * var(--ornament));
      background:
        radial-gradient(circle at var(--shine-x, 50%) var(--shine-y, 20%),
          rgba(255,255,255,.09),
          rgba(var(--accent-rgb), .035) 17%,
          transparent 38%);
      mix-blend-mode: screen;
    }

    .panel-inner {
      height: 100%;
      min-height: 0;
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
    }

    .collection-rail {
      --role-art: var(--rail-frame);
      --slice: 116;
      --panel-delay: 0ms;
      padding: 29px 25px;
    }

    .primary-stage {
      --role-art: var(--stage-frame);
      --slice: 105;
      --panel-delay: 55ms;
      padding: 29px 28px;
    }

    .context-lens {
      --role-art: var(--lens-frame);
      --slice: 110;
      --panel-delay: 110ms;
      padding: 29px 25px;
    }

    .panel-heading {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(var(--accent-rgb), .15);
      position: relative;
    }

    .panel-heading::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 42px;
      height: 1px;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(var(--accent-rgb), .45);
    }

    .panel-heading small {
      display: block;
      margin-bottom: 3px;
      color: var(--dim);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .panel-heading h2 {
      margin: 0;
      color: var(--text);
      font: 600 17px/1.05 var(--display-font);
    }

    .panel-count {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .search {
      position: relative;
      margin-bottom: 9px;
    }

    .search input {
      width: 100%;
      height: 33px;
      padding: 0 10px 0 29px;
      border: 1px solid rgba(var(--accent-rgb), .12);
      border-radius: 0;
      background: rgba(0,0,0,.23);
      color: var(--text);
      outline: none;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }

    .search::before {
      content: "⌕";
      position: absolute;
      left: 9px;
      top: 7px;
      z-index: 2;
      color: var(--dim);
      font-size: 14px;
    }

    .collection-list {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 5px;
      overflow: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(var(--accent-rgb), .22) transparent;
    }

    .collection-entry {
      width: 100%;
      display: grid;
      grid-template-columns: 32px minmax(0,1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 7px;
      border: 1px solid transparent;
      border-bottom-color: rgba(255,255,255,.05);
      background: linear-gradient(90deg, rgba(var(--accent-rgb), .028), transparent);
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      transition: .18s ease;
    }

    .collection-entry:hover {
      color: var(--text);
      background: linear-gradient(90deg, rgba(var(--accent-rgb), .09), transparent);
      transform: translateX(2px);
    }

    .collection-entry[aria-pressed="true"] {
      color: var(--text);
      border-left-color: var(--accent);
      background: linear-gradient(90deg, rgba(var(--accent-rgb), .13), transparent 74%);
      box-shadow: inset 8px 0 18px rgba(var(--accent-rgb), .035);
    }

    .entry-icon,
    .glyph {
      display: grid;
      place-items: center;
      color: var(--accent);
      background:
        radial-gradient(circle at 36% 30%, rgba(var(--accent-rgb), .15), rgba(0,0,0,.22) 68%),
        var(--surface-2);
      box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .2);
      clip-path: polygon(20% 0,80% 0,100% 20%,100% 80%,80% 100%,20% 100%,0 80%,0 20%);
    }

    .entry-icon {
      width: 31px;
      height: 31px;
      font: 600 13px var(--display-font);
    }

    .entry-copy { min-width: 0; }
    .entry-copy b {
      display: block;
      overflow: hidden;
      color: inherit;
      font-size: 11px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-copy small {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--dim);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-state {
      color: var(--secondary);
      font-size: 9px;
      text-transform: uppercase;
    }

    .secret-mark {
      color: var(--danger);
      font-size: 10px;
    }

    .collection-foot {
      margin-top: auto;
      padding-top: 10px;
      color: var(--dim);
      border-top: 1px solid rgba(255,255,255,.05);
      font-size: 9px;
      line-height: 1.4;
    }

    .stage-content,
    .lens-content {
      min-height: 0;
      flex: 1;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(var(--accent-rgb), .22) transparent;
    }

    .stage-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .chips,
    .mode-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chip,
    .mode-tabs button {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid rgba(255,255,255,.07);
      background: rgba(0,0,0,.17);
      color: var(--dim);
      font-size: 9px;
      letter-spacing: .05em;
      cursor: pointer;
      text-transform: uppercase;
    }

    .chip.active,
    .mode-tabs button[aria-pressed="true"] {
      color: var(--accent);
      border-color: rgba(var(--accent-rgb), .26);
      background: rgba(var(--accent-rgb), .07);
      box-shadow: inset 0 -1px var(--accent);
    }

    .generic-button,
    .primary-button,
    .danger-button {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid rgba(var(--accent-rgb), .24);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 650;
      clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
      transition: transform .18s, filter .18s, background .18s;
    }

    .primary-button {
      color: #fff0ca;
      background:
        linear-gradient(180deg, rgba(var(--accent-rgb), .22), rgba(var(--accent-rgb), .07)),
        rgba(0,0,0,.28);
    }

    .danger-button {
      color: #ffd5d8;
      border-color: rgba(var(--danger-rgb), .28);
      background: rgba(var(--danger-rgb), .07);
    }

    .generic-button:hover,
    .primary-button:hover,
    .danger-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.16);
    }

    .card-grid {
      min-height: 0;
      height: calc(100% - 40px);
      display: grid;
      grid-template-columns: repeat(3, minmax(130px, 1fr));
      grid-template-rows: repeat(2, minmax(145px, 1fr));
      gap: 7px;
    }

    .object-card {
      --delay: 0ms;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 11px 12px;
      border: 10px solid transparent;
      border-image-source: var(--card-frame);
      border-image-slice: 148 fill;
      border-image-width: 10px;
      border-image-repeat: stretch;
      background: transparent;
      text-align: left;
      cursor: pointer;
      isolation: isolate;
      overflow: hidden;
      opacity: 0;
      transform: translateY(9px) scale(.988);
      animation: card-enter .36s var(--delay) var(--ease) forwards;
      transition: transform .2s var(--ease), filter .2s;
    }

    .object-card::before {
      content: "";
      position: absolute;
      inset: 2px;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(3,7,7,.08), rgba(3,7,7,.88)),
        var(--art, radial-gradient(circle at 72% 25%, rgba(var(--accent-rgb), .09), transparent 42%));
      background-position: center;
      background-size: cover;
      opacity: var(--art-opacity, .75);
      filter: saturate(.7) contrast(1.05);
      transition: transform .45s var(--ease), opacity .25s, filter .25s;
    }

    .object-card::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 2px;
      z-index: 3;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      box-shadow: 0 0 9px rgba(var(--accent-rgb), .65);
      transition: opacity .2s;
    }

    .object-card:hover {
      z-index: 2;
      transform: translateY(-4px) scale(1.008);
      filter: brightness(1.08) drop-shadow(0 12px 14px rgba(0,0,0,.34));
    }

    .object-card:hover::before { transform: scale(1.035); filter: saturate(.9) contrast(1.04); }
    .object-card[aria-pressed="true"] {
      filter: brightness(1.13) drop-shadow(0 0 9px rgba(var(--accent-rgb), .28));
    }
    .object-card[aria-pressed="true"]::after { opacity: 1; }

    .card-illustration {
      position: absolute;
      left: 24%;
      right: 24%;
      top: 24%;
      z-index: 0;
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      color: var(--secondary);
      border: 1px solid rgba(var(--accent-rgb), .12);
      background:
        radial-gradient(circle, rgba(var(--accent-rgb), .11), transparent 58%),
        repeating-conic-gradient(from 45deg, rgba(var(--accent-rgb), .035) 0 1deg, transparent 1deg 45deg);
      box-shadow:
        inset 0 0 35px rgba(var(--accent-rgb), .05),
        0 0 28px rgba(var(--accent-rgb), .04);
      opacity: .62;
      transform: rotate(45deg);
      pointer-events: none;
    }

    .card-illustration::before,
    .card-illustration::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(var(--accent-rgb), .12);
      border-radius: 50%;
    }

    .card-illustration::after {
      inset: 28%;
      border-style: dotted;
      box-shadow: 0 0 17px rgba(var(--accent-rgb), .12);
    }

    .card-illustration span {
      position: relative;
      z-index: 1;
      color: var(--accent);
      font: 400 31px/1 var(--display-font);
      text-shadow: 0 0 18px rgba(var(--accent-rgb), .44);
      transform: rotate(-45deg);
    }

    .card-top,
    .object-card h3,
    .card-meta {
      z-index: 2;
    }

    .card-top {
      position: absolute;
      left: 11px;
      right: 11px;
      top: 11px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .glyph {
      width: 36px;
      height: 36px;
      font-size: 14px;
    }

    .quantity,
    .badge {
      padding: 3px 5px;
      color: var(--accent);
      border: 1px solid rgba(var(--accent-rgb), .2);
      background: rgba(4,8,8,.62);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .object-card h3 {
      margin: 0 0 5px;
      color: var(--text);
      font: 600 13px/1.12 var(--display-font);
      text-shadow: 0 2px 5px #000;
      overflow-wrap: anywhere;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      color: var(--dim);
      font-size: 9px;
    }

    .card-meta span:first-child {
      color: var(--secondary);
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .detail-hero {
      min-height: 185px;
      display: grid;
      place-items: center;
      position: relative;
      margin: -3px 0 11px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, rgba(var(--accent-rgb), .11), transparent 42%);
      clip-path: polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
    }

    .detail-hero::before {
      content: "";
      position: absolute;
      width: 122px;
      height: 122px;
      border: 1px solid rgba(var(--accent-rgb), .1);
      transform: rotate(45deg);
      animation: halo-turn 34s linear infinite;
    }

    .detail-hero img {
      position: absolute;
      inset: -16% 3% -18%;
      width: 94%;
      height: 134%;
      object-fit: contain;
      object-position: center;
      opacity: .84;
      filter: saturate(.75) contrast(1.06) drop-shadow(0 16px 20px rgba(0,0,0,.55));
      mix-blend-mode: screen;
      mask-image: linear-gradient(180deg,transparent 0,#000 12%,#000 73%,transparent 97%);
      transition: opacity .32s, transform .45s var(--ease);
    }

    .detail-hero .fallback-glyph {
      width: 84px;
      height: 84px;
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: rgba(var(--surface-rgb), .82);
      box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .22), 0 16px 26px rgba(0,0,0,.4);
      clip-path: polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
      font: 600 30px var(--display-font);
    }

    .lens-kicker {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      color: var(--secondary);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .lens-kicker::before { content:""; width:18px; height:1px; background:var(--secondary); }

    .lens-content h3 {
      margin: 0 0 7px;
      font: 600 20px/1.08 var(--display-font);
    }

    .lens-description {
      margin: 0 0 11px;
      color: var(--muted);
      font: italic 10px/1.45 var(--display-font);
    }

    .field-list {
      display: grid;
      border-top: 1px solid rgba(255,255,255,.055);
    }

    .field {
      display: grid;
      grid-template-columns: 83px minmax(0,1fr);
      gap: 8px;
      padding: 6px 1px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      font-size: 10px;
    }

    .field span { color: var(--dim); }
    .field b { color: var(--text); text-align: right; overflow-wrap: anywhere; }

    .lens-actions {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      padding-top: 9px;
    }

    .document {
      min-height: 100%;
      padding: 24px clamp(24px, 5vw, 68px);
      background:
        linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .035) 48%, transparent),
        rgba(var(--surface-rgb), .26);
      box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .06);
    }

    .document .doc-kicker {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .document h1 {
      margin: 8px 0 4px;
      font: 600 clamp(27px, 3vw, 42px)/1.02 var(--display-font);
    }

    .document .lead {
      color: var(--muted);
      font: italic 13px/1.5 var(--display-font);
    }

    .document p {
      max-width: 72ch;
      color: #c7cfcb;
      font: 12px/1.7 var(--display-font);
    }

    .relation-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 7px;
      margin-top: 22px;
    }

    .relation {
      padding: 11px;
      border: 1px solid rgba(var(--accent-rgb), .11);
      background: rgba(0,0,0,.16);
    }

    .relation small { color: var(--dim); font-size: 9px; text-transform: uppercase; }
    .relation b { display:block; margin-top:3px; font:600 11px var(--display-font); }

    .cast-sheet {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 11px;
    }

    .cast-hero {
      display: grid;
      grid-template-columns: 94px minmax(0,1fr) auto;
      align-items: center;
      gap: 15px;
      padding: 15px;
      border: 1px solid rgba(var(--accent-rgb), .11);
      background:
        radial-gradient(circle at 10% 50%, rgba(var(--accent-rgb), .12), transparent 28%),
        rgba(0,0,0,.13);
    }

    .portrait {
      width: 88px;
      height: 88px;
      display:grid;
      place-items:center;
      color:var(--accent);
      border:1px solid rgba(var(--accent-rgb),.25);
      background:radial-gradient(circle,rgba(var(--accent-rgb),.12),rgba(0,0,0,.45));
      font:600 28px var(--display-font);
      clip-path:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);
    }

    .cast-hero h1 { margin:0 0 5px; font:600 26px/1 var(--display-font); }
    .cast-hero p { margin:0; color:var(--muted); font-size:10px; }

    .resources {
      min-width: 160px;
      display:grid;
      gap:7px;
    }

    .resource-line { font-size:10px; color:var(--dim); }
    .resource-line b { float:right; color:var(--text); }
    .resource-track { clear:both; height:5px; margin-top:4px; background:rgba(0,0,0,.4); }
    .resource-track i { display:block; height:100%; width:var(--value); background:linear-gradient(90deg,var(--secondary),var(--accent)); }

    .field-groups {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }

    .field-group {
      padding:12px;
      border:1px solid rgba(var(--accent-rgb),.1);
      background:rgba(0,0,0,.13);
    }

    .field-group h3 { margin:0 0 8px; font:600 13px var(--display-font); }
    .skill { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.045); color:var(--muted); font-size:11px; }
    .skill b { color:var(--text); }

    .session-grid {
      min-height:100%;
      display:grid;
      grid-template-columns:minmax(0,1.45fr) minmax(240px,.8fr);
      grid-template-rows:minmax(210px,1.1fr) minmax(170px,.9fr);
      gap:8px;
    }

    .session-hero {
      grid-row:1 / -1;
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:flex-end;
      padding:22px;
      background-size:cover;
      background-position:center;
      isolation:isolate;
    }

    .session-hero::before {
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:linear-gradient(180deg,rgba(2,5,5,.06),rgba(2,5,5,.9));
    }

    .session-hero h1 { margin:5px 0; font:600 30px/1 var(--display-font); }
    .session-hero p { margin:0; max-width:55ch; color:var(--muted); font-size:10px; }

    .dashboard-card {
      padding:14px;
      border:1px solid rgba(var(--accent-rgb),.1);
      background:rgba(0,0,0,.15);
    }

    .dashboard-card h3 { margin:0 0 9px; font:600 13px var(--display-font); }
    .agenda-row { display:grid; grid-template-columns:auto 1fr auto; gap:8px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.045); font-size:10px; }
    .agenda-row i { color:var(--secondary); font-style:normal; }
    .agenda-row span { color:var(--muted); }
    .agenda-row small { color:var(--dim); }

    .table-workspace {
      min-height:0;
      height:100%;
      display:flex;
      flex-direction:column;
    }

    .table-workspace > .stage-toolbar {
      flex:0 0 auto;
    }

    .scene-stage {
      min-height:0;
      flex:1;
      position:relative;
      overflow:hidden;
      background:#030606;
      isolation:isolate;
    }

    .scene-art {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      filter:saturate(.78) brightness(.68) contrast(1.05);
      transform:scale(1.015);
      transition:filter .35s, transform .7s var(--ease);
    }

    .scene-stage::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow:inset 0 0 100px 28px rgba(0,0,0,.58);
      background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 33%,rgba(0,0,0,.58));
    }

    .scene-title {
      position:absolute;
      left:22px;
      bottom:19px;
      z-index:5;
    }

    .scene-title small { color:var(--accent); font-size:9px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; }
    .scene-title h1 { margin:5px 0 3px; font:600 28px/1 var(--display-font); text-shadow:0 3px 9px #000; }
    .scene-title p { margin:0; color:#c7d0cc; font-size:11px; }

    .tactical-grid {
      position:absolute;
      inset:0;
      z-index:2;
      background-image:
        linear-gradient(rgba(var(--accent-rgb),.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(var(--accent-rgb),.12) 1px,transparent 1px);
      background-size:54px 54px;
      mix-blend-mode:screen;
    }

    .token {
      position:absolute;
      z-index:4;
      left:var(--x);
      top:var(--y);
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:2px solid var(--token-color,var(--secondary));
      border-radius:50%;
      background:rgba(4,10,9,.88);
      box-shadow:0 0 16px var(--token-color,var(--secondary));
      color:var(--text);
      font:700 10px var(--display-font);
      transform:translate(-50%,-50%);
    }

    .outline-view {
      min-height:0;
      flex:1;
      overflow:auto;
      padding:15px;
      background:rgba(0,0,0,.14);
    }

    .outline-group { margin-bottom:14px; }
    .outline-group h3 { margin:0 0 6px; color:var(--accent); font:600 12px var(--display-font); }
    .outline-row { display:grid; grid-template-columns:1fr auto auto; gap:12px; padding:8px; border-bottom:1px solid rgba(255,255,255,.05); color:var(--muted); font-size:11px; }
    .outline-row b { color:var(--text); }

    .forge-grid {
      min-height:100%;
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(270px,.7fr);
      gap:8px;
    }

    .theme-preview {
      position:relative;
      display:grid;
      place-items:center;
      overflow:hidden;
      border:1px solid rgba(var(--accent-rgb),.11);
      background:radial-gradient(circle,rgba(var(--accent-rgb),.09),rgba(0,0,0,.2));
    }

    .mini-shell {
      width:78%;
      aspect-ratio:1.55;
      display:grid;
      grid-template-columns:18% 1fr 25%;
      gap:4px;
      padding:7px;
      border:1px solid rgba(var(--accent-rgb),.35);
      box-shadow:0 18px 35px rgba(0,0,0,.42),inset 0 0 20px rgba(var(--accent-rgb),.04);
      transform:perspective(700px) rotateX(3deg) rotateY(-5deg);
    }

    .mini-shell span { border:1px solid rgba(var(--accent-rgb),.18); background:rgba(var(--surface-rgb),.65); }
    .forge-controls { display:grid; align-content:start; gap:7px; }
    .control-row { padding:10px; border:1px solid rgba(var(--accent-rgb),.1); background:rgba(0,0,0,.14); }
    .control-row label { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; }
    .control-row input { width:100%; margin-top:8px; accent-color:var(--accent); }

    .trace-box {
      margin-top:10px;
      padding:10px;
      border:1px solid rgba(var(--secondary-rgb),.18);
      background:rgba(var(--secondary-rgb),.035);
    }

    .trace-box h4 { margin:0 0 7px; color:var(--secondary); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    .trace-step { display:flex; gap:6px; padding:4px 0; color:var(--muted); font-size:10px; }
    .trace-step i { color:var(--secondary); font-style:normal; }

    .session-shelf {
      --role-art: var(--stage-frame);
      --slice: 105;
      padding: 19px 23px;
      margin-left: 77px;
    }

    .session-shelf::before {
      border-width:20px;
      border-image-width:20px;
    }

    .shelf-inner {
      height:100%;
      min-width:0;
      display:grid;
      grid-template-columns:235px minmax(0,1fr) 280px;
      align-items:center;
      gap:13px;
      position:relative;
      z-index:3;
    }

    .actor-glance {
      min-width:0;
      display:grid;
      grid-template-columns:38px minmax(0,1fr);
      gap:9px;
      align-items:center;
    }

    .actor-glance .portrait { width:38px; height:38px; font-size:12px; }
    .actor-copy { min-width:0; }
    .actor-copy b { display:block; overflow:hidden; font:600 11px var(--display-font); text-overflow:ellipsis; white-space:nowrap; }
    .actor-copy span { display:block; margin-top:3px; color:var(--dim); font-size:9px; }
    .micro-track { height:3px; margin-top:5px; background:rgba(0,0,0,.45); }
    .micro-track i { display:block; width:72%; height:100%; background:linear-gradient(90deg,var(--secondary),var(--accent)); }

    .shelf-actions {
      display:flex;
      justify-content:center;
      align-items:center;
      gap:5px;
      overflow-x:auto;
      scrollbar-width:none;
    }

    .shelf-action {
      flex:0 0 auto;
      min-width:72px;
      height:36px;
      padding:0 9px;
      border:1px solid rgba(var(--accent-rgb),.19);
      background:rgba(0,0,0,.22);
      color:var(--muted);
      cursor:pointer;
      font-size:10px;
      transition:.18s ease;
      clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    }

    .shelf-action:hover { color:var(--text); transform:translateY(-2px); background:rgba(var(--accent-rgb),.07); }
    .shelf-action.primary { color:var(--accent); border-color:rgba(var(--accent-rgb),.38); }

    .shelf-history {
      min-width:0;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:8px;
      color:var(--dim);
      font-size:9px;
    }

    .history-copy { min-width:0; text-align:right; }
    .history-copy b { display:block; overflow:hidden; color:var(--muted); font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
    .history-copy span { display:block; margin-top:2px; }

    #focus-transfer {
      position:fixed;
      inset:0;
      z-index:300;
      width:100vw;
      height:100vh;
      pointer-events:none;
      opacity:0;
    }

    #focus-transfer.play { animation:transfer-fade .68s ease-out forwards; }
    #focus-path {
      fill:none;
      stroke:var(--accent);
      stroke-width:1.3;
      stroke-linecap:round;
      stroke-dasharray:1;
      stroke-dashoffset:1;
      filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.9));
    }
    #focus-transfer.play #focus-path { animation:transfer-draw .5s var(--ease) forwards; }
    #focus-orb { fill:var(--accent); opacity:0; filter:drop-shadow(0 0 8px rgba(var(--accent-rgb),1)); }
    #focus-transfer.play #focus-orb { animation:orb-pop .5s .14s var(--ease) forwards; }

    #toast {
      position:fixed;
      left:50%;
      bottom:96px;
      z-index:400;
      min-width:270px;
      padding:11px 17px;
      border:1px solid rgba(var(--accent-rgb),.28);
      background:rgba(var(--bg-rgb),.95);
      color:var(--text);
      box-shadow:0 18px 48px rgba(0,0,0,.5),0 0 16px rgba(var(--accent-rgb),.07);
      font-size:10px;
      text-align:center;
      opacity:0;
      pointer-events:none;
      transform:translate(-50%,10px) scale(.98);
      transition:.22s var(--ease);
      clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);
    }

    #toast.show { opacity:1; transform:translate(-50%,0) scale(1); }

    dialog {
      width:min(560px,calc(100vw - 30px));
      padding:0;
      border:1px solid rgba(var(--accent-rgb),.32);
      background:rgba(var(--bg-rgb),.97);
      color:var(--text);
      box-shadow:0 35px 100px rgba(0,0,0,.72),0 0 35px rgba(var(--accent-rgb),.08);
    }

    dialog::backdrop { background:rgba(0,0,0,.64); backdrop-filter:blur(7px); }
    .command-dialog-inner { padding:18px; }
    .command-dialog-inner h2 { margin:0 0 12px; font:600 18px var(--display-font); }
    .command-dialog-inner input { width:100%; height:39px; padding:0 12px; border:1px solid rgba(var(--accent-rgb),.2); background:rgba(0,0,0,.22); color:var(--text); }
    .command-results { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:10px; }
    .command-result { padding:11px; border:1px solid rgba(var(--accent-rgb),.1); background:rgba(255,255,255,.018); color:var(--muted); cursor:pointer; text-align:left; }
    .command-result:hover { color:var(--text); background:rgba(var(--accent-rgb),.06); }

    html[data-atmosphere="clean"] {
      --frame-opacity:.18;
      --ornament:0;
    }

    html[data-atmosphere="cinematic"] {
      --frame-opacity:1;
      --ornament:1.25;
    }

    html[data-atmosphere="cinematic"] .scene-art { filter:saturate(.93) brightness(.78) contrast(1.04); transform:scale(1.035); }

    html[data-role="observer"] .collection-rail,
    html[data-role="observer"] .context-lens { display:none; }
    html[data-role="observer"] .shell { grid-template-columns:68px minmax(0,1fr); }
    html[data-role="observer"] .primary-stage { grid-column:2; }
    html[data-role="observer"] .session-shelf { margin-left:77px; }

    @keyframes panel-enter { to { opacity:1; transform:none; } }
    @keyframes card-enter { to { opacity:1; transform:none; } }
    @keyframes ambient-drift { to { transform:translate3d(2.5%,-2%,0) rotate(3deg) scale(1.04); } }
    @keyframes halo-turn { to { transform:rotate(405deg); } }
    @keyframes transfer-fade { 0%,72%{opacity:.8} 100%{opacity:0} }
    @keyframes transfer-draw { to { stroke-dashoffset:0; } }
    @keyframes orb-pop { 0%{opacity:0;r:2} 35%{opacity:1;r:5} 100%{opacity:0;r:9} }

    @media (max-width:1380px) {
      .command-bar { grid-template-columns:190px minmax(130px,1fr) auto auto; gap:8px; }
      .brand small { display:none; }
      .utility-controls .presence { display:none; }
      .shell { grid-template-columns:64px 220px minmax(470px,1fr) 292px; }
      .card-grid { grid-template-columns:repeat(2,minmax(140px,1fr)); grid-template-rows:repeat(3,minmax(125px,1fr)); }
    }

    @media (max-width:1050px) {
      body { overflow:auto; }
      #app { height:auto; min-height:100vh; grid-template-rows:auto auto auto; }
      .command-bar { grid-template-columns:1fr auto; min-height:64px; }
      .axis-lab { grid-column:1 / -1; overflow-x:auto; padding-bottom:5px; }
      .utility-controls { grid-column:2; grid-row:1; }
      .campaign-context { display:none; }
      .shell { grid-template-columns:62px minmax(220px,.42fr) minmax(460px,1fr); min-height:750px; }
      .context-lens { grid-column:2 / -1; min-height:480px; }
      .session-shelf { margin-left:71px; min-height:76px; }
    }

    @media (max-width:760px) {
      #app { padding:8px; }
      .shell { grid-template-columns:52px minmax(0,1fr); align-items:start; }
      .module-rail {
        grid-column:1;
        grid-row:1;
        position:sticky;
        top:8px;
        height:calc(100vh - 170px);
      }
      .mobile-drawer-control { display:block; }
      .collection-rail,
      .context-lens {
        display:none;
        position:fixed;
        left:69px;
        right:8px;
        top:91px;

        background:var(--bg);
        box-shadow:0 24px 70px rgba(0,0,0,.78);
      }
      html[data-mobile-drawer="collection"] .collection-rail { display:block; }
      html[data-mobile-drawer="lens"] .context-lens { display:block; }
      html[data-role="observer"] .collection-rail,
      html[data-role="observer"] .context-lens { display:none !important; }
      html[data-role="observer"] .mobile-drawer-control { display:none; }
      .primary-stage { grid-column:2; min-height:calc(100vh - 170px); }
      .module-label { display:none; }
      .session-shelf {

        height:62px;
        min-height:62px;
        margin:0;
        padding:12px 18px;
        background:var(--bg);
        box-shadow:0 -16px 40px rgba(0,0,0,.55);
      }
      .shelf-inner { grid-template-columns:1fr; }
      .actor-glance,.shelf-history { display:none; }
      .card-grid { grid-template-columns:repeat(2,minmax(120px,1fr)); }
      .field-groups,.relation-strip { grid-template-columns:1fr; }
    }

    html[data-motion="reduced"] *,
    html[data-motion="reduced"] *::before,
    html[data-motion="reduced"] *::after {
      scroll-behavior:auto !important;
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
    html[data-motion="reduced"] #ambient { display:none; }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after {
        scroll-behavior:auto !important;
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
      #ambient { display:none; }
    }

            { id:"ellis", icon:"EV", name:"Ellis Vale", type:"Spielerfigur", meta:"5 Fassung", visibility:"Gruppe", role:"Ermittler · Presse", resources:[["Fassung",71],["Verdacht",48]], groups:[["Körper",["Beobachten 62","Verfolgen 48","Ausdauer 41"]],["Ermittlung",["Recherche 77","Fotografie 68","Forensik 52"]],["Sozial",["Interview 73","Täuschen 59","Druck 43"]]] },
            { id:"june", icon:"JC", name:"June Calder", type:"Spielerfigur", meta:"ruhig", visibility:"Gruppe", role:"Archivarin · Historikerin", resources:[["Fassung",84],["Intuition",67]], groups:[["Körper",["Beobachten 55","Fahren 49","Heimlichkeit 44"]],["Ermittlung",["Archive 86","Geschichte 79","Analyse 72"]],["Sozial",["Beruhigen 68","Interview 57","Täuschen 35"]]] },
            { id:"porter", icon:"PB", name:"Porter Bell", type:"NPC", meta:"Zeuge", secret:true, visibility:"Nur SL", role:"Nachtportier · unklar", resources:[["Fassung",100],["Wissen",91]], groups:[["Hotel",["Erinnerung 94","Schlüssel 88","Gänge 99"]],["Verbergen",["Täuschen 72","Schweigen 84","Ablenken 67"]],["Sozial",["Höflichkeit 90","Drohung 22","Beobachten 76"]]] }
          ],
          scenes: [
            { id:"lobby", icon:"⌗", name:"Lobby des Miramar", type:"Aktive Scene", meta:"00:17", visibility:"Gruppe", description:"Leere Lobby, Regen und vier Minuten Zeitversatz.", fields:[["Modus","Cinematic"],["Personen","3"],["Hinweise","7"],["Wetter","Starkregen"]] },
            { id:"third", icon:"⌗", name:"Drittes Stockwerk", type:"Vorbereitet", meta:"verborgen", secret:true, visibility:"Nur SL", description:"Outline- und Tactical-Variante eines unmöglichen Flurs.", fields:[["Modus","Outline / Tactical"],["Räume","13"],["Trigger","4"],["Status","bereit"]] }
          ]
        }
      };

      var MODULES = {
        session: { label:"Session", kicker:"GM-Arbeitslast · Heute" },
        story: { label:"Story", kicker:"Chronicle · Verknüpfte Erinnerung" },
        cast: { label:"Cast", kicker:"Entities · Schema-Ansichten" },
        library: { label:"Library", kicker:"Collections · Instanzen" },
        table: { label:"Table", kicker:"Scene · Drei Renderer" },
        forge: { label:"Forge", kicker:"Themes · Regeln · Pakete" }
      };

      var state = {
        world:"aldenfall",
        skin:"relic",
        role:"gm",
        atmosphere:"crafted",
        motion:"full",
        contrast:"standard",
        module:"library",
        selection:{ session:"agenda", story:"night-delivery", cast:"brakka", library:"blade", table:"harbor", forge:"theme" },

        lastCommitted:null,
