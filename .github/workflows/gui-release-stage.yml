name: gui-release-stage
on:
  push:
    branches: [fix/gui-fuzz-release-20260911]
    paths: ['.github/workflows/gui-release-stage.yml', '.github/gui-release-stage.*']
permissions:
  contents: write
jobs:
  integrate-exact-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify baseline and explicit patch
        run: |
          cat .github/gui-release-stage.{0,1,2} | base64 -d | gzip -d > "$RUNNER_TEMP/gui-release.patch"
          echo "19dc266ed5c74c9f7c5f4a044fbd3f1fd5b650308e94819a0c9a4243638bfd4f  $RUNNER_TEMP/gui-release.patch" | sha256sum -c -
          git rm .github/gui-release-stage.{0,1,2} .github/workflows/gui-release-stage.yml
          test "$(git write-tree)" = 5aa4fbddc17fd0d76d0847bf01b4b6732538d0d1
          git apply --index "$RUNNER_TEMP/gui-release.patch"
          test "$(git write-tree)" = 5685e8eca0acf16a2b9e883c2e40b839d775118e
      - run: npm ci --no-audit --no-fund
      - name: Reproduce exact reviewed asset tree
        run: |
          node tools/assets/erzeuge-lootkarten.mjs
          node tools/assets/erzeuge-lootkarten.mjs --pruefe
          git add assets/loot/chronicle-heroes
          test "$(git write-tree)" = 932920493dbdc45f47d11e20b3f0f430fc4a4d71
      - name: Check integration before committing
        run: |
          npm run typecheck
          npm run build
          npm run gate:assets
          npx vitest run packages/client/test/gui-state-fuzz.test.ts packages/client/test/map-workshop-review.test.ts
      - name: Commit only the verified tree on the authorized feature branch
        run: |
          test "$(git ls-remote origin refs/heads/fix/gui-fuzz-release-20260911 | cut -f1)" = "$GITHUB_SHA"
          test "$(git write-tree)" = 932920493dbdc45f47d11e20b3f0f430fc4a4d71
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(gui): preserve dropdown focus, coalesce submissions and stabilize context menus' -m 'Explicit locally reviewed patch and exact reproduced asset tree; prepare v0.4.3 Windows packaging and seeded GUI acceptance. No main write, force push, secret export or gate bypass. Temporary staging files removed. Browser and Windows acceptance required before release.'
          git push origin HEAD:refs/heads/fix/gui-fuzz-release-20260911
