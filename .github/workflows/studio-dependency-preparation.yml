name: studio-dependency-preparation
on:
  push:
    branches: ['feature/map-studio-completion-20260911']
    paths: ['.github/workflows/studio-dependency-preparation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Resolve exact dependencies
        run: |
          npm install --workspace @chronicle/forge --save-exact polygon-clipping@0.15.7 earcut@3.2.3 --no-audit --no-fund
          npm install --save-dev --save-exact opentype.js@1.3.4 @fontsource/libre-baskerville --no-audit --no-fund
          npm ls polygon-clipping earcut opentype.js @fontsource/libre-baskerville
      - name: Public dependency and manifest archive only
        run: |
          find node_modules packages -path '*/node_modules' -prune -print0 | tar -czf "$RUNNER_TEMP/studio-dependencies.tar.gz" --null -T -
          tar -czf "$RUNNER_TEMP/studio-manifests.tar.gz" package.json package-lock.json packages/forge/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: studio-dependency-preparation
          path: |
            ${{ runner.temp }}/studio-dependencies.tar.gz
            ${{ runner.temp }}/studio-manifests.tar.gz
          retention-days: 1
