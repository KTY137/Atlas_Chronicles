name: prepare-v050
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-v050.yml']
permissions:
  contents: read
jobs:
  native-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare native startup without logging environment values
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {execFile,spawn} from 'node:child_process';
          import {promisify} from 'node:util';
          import {join} from 'node:path';
          const exec=promisify(execFile), source=new Map(Object.entries(process.env).map(([k,v])=>[k.toUpperCase(),v]));
          const keys=['SystemRoot','WINDIR','TEMP','TMP','USERPROFILE','LOCALAPPDATA','APPDATA','COMSPEC','LANG'];
          const safe=Object.fromEntries(keys.filter(k=>source.get(k.toUpperCase())).map(k=>[k,source.get(k.toUpperCase())]));
          const ps=join(safe.SystemRoot??'C:\\Windows','System32','WindowsPowerShell','v1.0','powershell.exe');
          const args=['-NoLogo','-NoProfile','-NonInteractive','-Command',"Write-Output 'native-started'"];
          await Promise.all([['inherited-visible',undefined,false],['inherited-hidden',undefined,true],['safe-visible',safe,false],['safe-hidden',safe,true]].map(async([label,env,windowsHide])=>{
            try {
              const pending=exec(ps,args,{env,windowsHide,shell:false,timeout:15000});
              pending.child.stdin?.end(); const result=await pending;
              console.log('PROBE',label,'ok',result.stdout.trim()==='native-started');
            } catch(e) { console.log('PROBE',label,'failed','timeout',!!e.killed); }
          }));
          await new Promise(resolve=>{
            const child=spawn(ps,args,{env:safe,windowsHide:true,shell:false,stdio:['ignore','pipe','pipe']});
            let output=''; child.stdout.on('data',chunk=>output+=chunk); child.stderr.resume();
            const timer=setTimeout(()=>child.kill(),15000);
            child.on('close',code=>{clearTimeout(timer);console.log('PROBE','stdin-ignore',code,output.trim()==='native-started');resolve();});
            child.on('error',()=>{clearTimeout(timer);console.log('PROBE','spawn-error');resolve();});
          });
          NODE
