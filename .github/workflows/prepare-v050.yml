name: prepare-v050
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-v050.yml']
permissions:
  contents: read
jobs:
  prepare-metadata:
    if: github.repository == 'KTY137/Atlas_Chronicles'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Temporary release preparation: create immutable blobs only. No branch,
      # commit, tag or release is changed by this job. Removed in the release commit.
      - uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const version = '0.5.0';
            const paths = ['package.json', 'packages/desktop/package.json', 'package-lock.json'];
            for (const path of paths) {
              const original = fs.readFileSync(path, 'utf8');
              const value = JSON.parse(original);
              assert.equal(value.version, '0.4.3', `Unexpected source version in ${path}`);
              value.version = version;
              if (path === 'package-lock.json') {
                assert.equal(value.packages[''].version, '0.4.3');
                assert.equal(value.packages['packages/desktop'].version, '0.4.3');
                value.packages[''].version = version;
                value.packages['packages/desktop'].version = version;
              }
              const content = JSON.stringify(value, null, 2) + '\n';
              const {data} = await github.rest.git.createBlob({...context.repo, content, encoding: 'utf-8'});
              core.info(`RELEASE_BLOB ${path} ${data.sha}`);
            }
            core.info(`RELEASE_BASE ${context.sha}`);
      - name: Report version-specific release references
        run: git grep -n -e 'v043' -e '0.4.3' -- .github/workflows tools/release tools/test packages/desktop/package.json || test "$?" = 1
