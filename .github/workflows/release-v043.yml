name: release-v043
on:
  workflow_run:
    workflows: [gate, gui-validation, map-studio, regelwerk, windows-package]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-v043
  cancel-in-progress: false
jobs:
  publish-verified-candidate:
    if: github.repository == 'KTY137/Atlas_Chronicles' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish only the exact tested main Windows build; preserve existing releases
        run: node tools/release/publish-v043.mjs
        env:
          GH_TOKEN: ${{ github.token }}
