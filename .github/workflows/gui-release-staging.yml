name: gui-release-staging
on:
  push:
    branches: ['release/gui-hardening-0.5.0']
    paths: ['.github/gui-release-staging/**', '.github/workflows/gui-release-staging.yml']
permissions:
  contents: write
jobs:
  apply-verified-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify explicit input and apply checked source changes
        run: |
          set -euo pipefail
          cat .github/gui-release-staging/0{0,1,2,3}.patch > "$RUNNER_TEMP/gui.patch"
          echo "16e1d013170ff07ef28a0005ee511d4ffe0d21fb051e8a1d8807507842260883  $RUNNER_TEMP/gui.patch" | sha256sum -c -
          git rm -- .github/gui-release-staging/00.patch .github/gui-release-staging/01.patch .github/gui-release-staging/02.patch .github/gui-release-staging/03.patch .github/workflows/gui-release-staging.yml
          test "$(git write-tree)" = '33721432416d28a53d01ad5152b00efc0f12f13e'
          git apply --index "$RUNNER_TEMP/gui.patch"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reproduce reviewed public artwork and verify entire target tree
        run: |
          set -euo pipefail
          node --import tsx tools/assets/erzeuge-lootkarten.mjs
          git add -- assets/loot/chronicle-heroes
          test "$(git write-tree)" = 'c66b0e4e8e59766b06904311b35b48e823ee06f3'
          npm run typecheck
          npm run build
      - name: Commit only this verified branch, without overwriting concurrent work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(gui): integrate verified menu lifecycle, seeded testing and reproducible release assets' -m 'Exact accepted source tree c66b0e4e8e59766b06904311b35b48e823ee06f3. Temporary staging resources removed. Full GUI and Windows release qualification still required. Refs #3.'
          git push origin HEAD:refs/heads/release/gui-hardening-0.5.0
