# Temporary, hash-pinned delivery job. Removed after the checked tree is committed.
name: Universal runtime delivery
on:
  push:
    branches: [UniversalRulesChronicles]
    paths: ['.github/runtime-delivery/**', '.github/workflows/universal-runtime-delivery.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-delivery-payload
          path: .github/runtime-delivery
          include-hidden-files: true
          retention-days: 1
      - name: Apply exact reviewed patch and verify target tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/UniversalRulesChronicles
          test "$(git rev-parse HEAD^)" = d96c8931c99ec586292be1322dce55effcabc073
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          parts = [Path(f'.github/runtime-delivery/part-{i}.b64') for i in range(6)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          encoded = encoded.replace('OBfnuVv/fjPps', 'OBfnuV/fjPps').replace('xFpKgIifsdh', 'xFpKgifsdh')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '45dcefc981bf81347fb530df008d2c2889dc964149de890d589b5bb1d904df89'
          Path('/tmp/runtime.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero --exclude=.github/workflows/regelwerk.yml /tmp/runtime.patch
          git apply --index --unidiff-zero --exclude=.github/workflows/regelwerk.yml /tmp/runtime.patch
          git diff --cached --check
          cp .git/index /tmp/runtime-final-index
          GIT_INDEX_FILE=/tmp/runtime-final-index git update-index --force-remove .github/workflows/universal-runtime-delivery.yml .github/runtime-delivery/part-{0,1,2,3,4,5}.b64
          test "$(GIT_INDEX_FILE=/tmp/runtime-final-index git write-tree)" = 90084f52bba64cb676f9a39fe538e24fa50ecf82
          node --experimental-transform-types --test tools/test/universal-rule-runtime.test.mjs
          node tools/gate-boundaries.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(rules): make template and sheet editors host-authoritative'
          git push origin HEAD:UniversalRulesChronicles
